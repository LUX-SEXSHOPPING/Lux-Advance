<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LUX — Acesso Administrativo</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CONFIG DO PROJETO -->
  <script src="./config.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      color: #eee4d8;

      background:
        linear-gradient(
          rgba(8, 3, 7, 0.76),
          rgba(8, 3, 7, 0.90)
        ),
        url("./lux-halloween.jpg")
        center center /
        cover
        fixed
        no-repeat;

    }

    .container {

      width: 100%;
      max-width: 460px;

    }

    .painel {

      padding: 38px 30px 30px;

      border:
        1px solid
        rgba(201, 162, 39, 0.55);

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(22, 8, 14, 0.97),
          rgba(6, 3, 7, 0.96)
        );

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.75),
        0 0 45px rgba(201, 162, 39, 0.08);

      backdrop-filter: blur(12px);

      text-align: center;

    }

    .icone {

      width: 82px;
      height: 82px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid
        rgba(241, 211, 107, 0.65);

      border-radius: 50%;

      color: #f1d36b;

      background:
        rgba(201, 162, 39, 0.10);

      box-shadow:
        0 0 30px rgba(201, 162, 39, 0.12);

    }

    .icone i {
      font-size: 31px;
    }

    .marca {

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 32px;

      font-weight: 600;

      letter-spacing: 4px;

      color: #f1d36b;

    }

    .subtitulo {

      margin-top: 5px;

      font-size: 16px;

      letter-spacing: 2px;

      color: #cbbfb1;

    }

    .linha {

      width: 90px;
      height: 1px;

      margin: 22px auto 25px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #c9a227,
          transparent
        );

    }

    h1 {

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 24px;

      color: #fff1d0;

      margin-bottom: 9px;

    }

    .descricao {

      color: #bfb2a5;

      font-size: 16px;

      line-height: 1.5;

      margin-bottom: 25px;

    }

    .campo {

      position: relative;

      margin-bottom: 16px;

    }

    .campo i {

      position: absolute;

      left: 17px;

      top: 50%;

      transform:
        translateY(-50%);

      color: #c9a227;

      z-index: 2;

    }

    .campo input {

      width: 100%;

      height: 55px;

      padding:
        0 17px
        0 47px;

      border:
        1px solid
        rgba(201, 162, 39, 0.30);

      border-radius: 13px;

      outline: none;

      color: #fff;

      background:
        rgba(255, 255, 255, 0.045);

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 17px;

    }

    .campo input:focus {

      border-color:
        rgba(241, 211, 107, 0.85);

      box-shadow:
        0 0 0 3px
        rgba(201, 162, 39, 0.08);

    }

    .campo input::placeholder {
      color: #8f8378;
    }

    .botao {

      width: 100%;

      height: 55px;

      border: none;

      border-radius: 13px;

      cursor: pointer;

      color: #170d05;

      background:
        linear-gradient(
          135deg,
          #c9a227,
          #f1d36b,
          #c9a227
        );

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 16px;

      font-weight: 700;

      letter-spacing: 1px;

    }

    .botao:disabled {

      opacity: .6;

      cursor: wait;

    }

    .mensagem {

      min-height: 25px;

      margin-top: 16px;

      font-size: 15px;

      line-height: 1.4;

    }

    .erro {
      color: #ff9999;
    }

    .sucesso {
      color: #e6c86e;
    }

    .esqueci {

      display: inline-block;

      margin-top: 18px;

      color: #c9a227;

      text-decoration: none;

      cursor: pointer;

      font-size: 15px;

    }

    .esqueci:hover {
      color: #f1d36b;
    }

    .voltar {

      display: block;

      margin-top: 23px;

      color: #9e9287;

      text-decoration: none;

      font-size: 14px;

    }

    .voltar:hover {
      color: #eee4d8;
    }

    .rodape {

      margin-top: 22px;

      padding-top: 18px;

      border-top:
        1px solid
        rgba(255,255,255,.07);

      color: #70675f;

      font-size: 12px;

      line-height: 1.5;

    }

    /* =========================================================
       MODAL
       ========================================================= */

    .modal {

      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0,0,0,.84);

      z-index: 100;

    }

    .modal.ativo {
      display: flex;
    }

    .modal-box {

      width: 100%;
      max-width: 430px;

      padding: 30px;

      border:
        1px solid
        rgba(201,162,39,.55);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          #190a11,
          #080307
        );

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.8);

      text-align: center;

    }

    .modal-box h2 {

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      color: #f1d36b;

      margin-bottom: 10px;

    }

    .modal-box p {

      color: #bfb2a5;

      line-height: 1.5;

      margin-bottom: 20px;

    }

    .modal-botoes {

      display: flex;

      gap: 10px;

      margin-top: 15px;

    }

    .modal-botoes button {

      flex: 1;

      height: 48px;

      border-radius: 10px;

      cursor: pointer;

      font-family:
        "Playfair Display",
        Georgia,
        serif;

    }

    .enviar {

      border: none;

      color: #170d05;

      background:
        linear-gradient(
          135deg,
          #c9a227,
          #f1d36b
        );

    }

    .cancelar {

      border:
        1px solid
        rgba(255,255,255,.15);

      color: #ddd;

      background:
        rgba(255,255,255,.05);

    }

    .modal-botoes button:disabled {

      opacity: .6;

      cursor: wait;

    }

    @media (max-width: 500px) {

      body {
        padding: 14px;
      }

      .painel {
        padding: 30px 21px 27px;
      }

      .marca {
        font-size: 28px;
      }

    }

  </style>

</head>


<body>

  <main class="container">

    <section class="painel">

      <div class="icone">
        <i class="fas fa-user-shield"></i>
      </div>

      <div class="marca">
        LUX
      </div>

      <div class="subtitulo">
        ADVANCE
      </div>

      <div class="linha"></div>

      <h1>
        Acesso Administrativo
      </h1>

      <p class="descricao">
        Área exclusiva de administração da plataforma LUX.
      </p>


      <form id="formLogin">

        <div class="campo">

          <i class="fas fa-lock"></i>

          <input
            type="password"
            id="senha"
            placeholder="Senha administrativa"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          class="botao"
          id="btnEntrar"
        >
          <i class="fas fa-right-to-bracket"></i>
          &nbsp;
          ENTRAR NO PAINEL
        </button>

      </form>


      <div
        id="mensagem"
        class="mensagem"
      ></div>


      <a
        href="#"
        class="esqueci"
        id="esqueciSenha"
      >
        Esqueci minha senha
      </a>


      <a
        href="./index.html"
        class="voltar"
      >
        <i class="fas fa-arrow-left"></i>
        Voltar para o site
      </a>


      <div class="rodape">

        LUX Advance © 2026<br>

        Área administrativa protegida.

      </div>

    </section>

  </main>


  <!-- =========================================================
       MODAL RECUPERAÇÃO
       ========================================================= -->

  <div
    class="modal"
    id="modal"
  >

    <div class="modal-box">

      <h2>
        Recuperar senha
      </h2>

      <p>
        Digite o e-mail administrativo para receber o link de recuperação pelo Supabase.
      </p>


      <div class="campo">

        <i class="fas fa-envelope"></i>

        <input
          type="email"
          id="emailRecuperacao"
          placeholder="E-mail administrativo"
          autocomplete="email"
        >

      </div>


      <div class="modal-botoes">

        <button
          type="button"
          class="cancelar"
          id="fecharModal"
        >
          Cancelar
        </button>

        <button
          type="button"
          class="enviar"
          id="enviarRecuperacao"
        >
          Enviar
        </button>

      </div>


      <div
        id="mensagemRecuperacao"
        class="mensagem"
      ></div>

    </div>

  </div>


  <script>

    /* =========================================================
       LUX — LOGIN ADMINISTRATIVO
       ========================================================= */

    const formLogin =
      document.getElementById("formLogin");

    const senha =
      document.getElementById("senha");

    const btnEntrar =
      document.getElementById("btnEntrar");

    const mensagem =
      document.getElementById("mensagem");


    function mostrarMensagem(
      texto,
      tipo
    ) {

      mensagem.textContent =
        texto;

      mensagem.className =
        "mensagem " +
        (tipo || "");

    }


    /* =========================================================
       LOGIN ADMINISTRATIVO
       ========================================================= */

    formLogin.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        mostrarMensagem("", "");

        const senhaDigitada =
          String(
            senha.value || ""
          ).trim();


        if (!senhaDigitada) {

          mostrarMensagem(
            "Digite sua senha.",
            "erro"
          );

          return;

        }


        if (!window.luxSupabase) {

          mostrarMensagem(
            "Supabase não foi inicializado. Verifique o config.js.",
            "erro"
          );

          return;

        }


        const supabase =
          window.luxSupabase;


        const emailAdmin =
          String(
            window.LUX_ADMIN_EMAIL || ""
          )
          .trim()
          .toLowerCase();


        if (!emailAdmin) {

          mostrarMensagem(
            "E-mail administrativo não configurado no config.js.",
            "erro"
          );

          return;

        }


        btnEntrar.disabled = true;

        btnEntrar.innerHTML =
          '<i class="fas fa-spinner fa-spin"></i> AUTENTICANDO...';


        try {

          const {
            data,
            error
          } =
            await supabase.auth.signInWithPassword({

              email:
                emailAdmin,

              password:
                senhaDigitada

            });


          if (error) {

            console.error(
              "Erro no login:",
              error
            );

            throw new Error(
              "E-mail ou senha administrativa inválidos."
            );

          }


          const user =
            data?.user;


          if (!user) {

            throw new Error(
              "Usuário administrativo não encontrado."
            );

          }


          const emailUsuario =
            String(
              user.email || ""
            )
            .trim()
            .toLowerCase();


          if (
            emailUsuario !==
            emailAdmin
          ) {

            await supabase.auth.signOut();

            throw new Error(
              "Esta conta não possui acesso administrativo."
            );

          }


          /*
           * CONFIRMA A SESSÃO
           */

          let session = null;


          for (
            let tentativa = 0;
            tentativa < 10;
            tentativa++
          ) {

            const {
              data: sessao
            } =
              await supabase.auth.getSession();


            session =
              sessao?.session || null;


            if (session) {
              break;
            }


            await new Promise(
              resolve =>
                setTimeout(
                  resolve,
                  300
                )
            );

          }


          if (!session) {

            throw new Error(
              "A sessão não foi criada. Tente novamente."
            );

          }


          mostrarMensagem(
            "Acesso autorizado. Abrindo painel...",
            "sucesso"
          );


          setTimeout(
            function() {

              window.location.replace(
                "./painel-admin.html"
              );

            },
            500
          );


        } catch (error) {

          console.error(
            "LUX ADMIN:",
            error
          );


          mostrarMensagem(
            error.message ||
            "Não foi possível realizar o acesso.",
            "erro"
          );


          btnEntrar.disabled = false;

          btnEntrar.innerHTML =
            '<i class="fas fa-right-to-bracket"></i> &nbsp; ENTRAR NO PAINEL';

        }

      }
    );


    /* =========================================================
       ABRIR RECUPERAÇÃO
       ========================================================= */

    const modal =
      document.getElementById("modal");

    const esqueciSenha =
      document.getElementById(
        "esqueciSenha"
      );

    const fecharModal =
      document.getElementById(
        "fecharModal"
      );

    const emailRecuperacao =
      document.getElementById(
        "emailRecuperacao"
      );

    const enviarRecuperacao =
      document.getElementById(
        "enviarRecuperacao"
      );

    const mensagemRecuperacao =
      document.getElementById(
        "mensagemRecuperacao"
      );


    esqueciSenha.addEventListener(
      "click",
      function(event) {

        event.preventDefault();


        emailRecuperacao.value =
          window.LUX_ADMIN_EMAIL || "";


        mensagemRecuperacao.textContent =
          "";

        mensagemRecuperacao.className =
          "mensagem";


        modal.classList.add(
          "ativo"
        );

      }
    );


    fecharModal.addEventListener(
      "click",
      function() {

        modal.classList.remove(
          "ativo"
        );

      }
    );


    modal.addEventListener(
      "click",
      function(event) {

        if (
          event.target === modal
        ) {

          modal.classList.remove(
            "ativo"
          );

        }

      }
    );


    /* =========================================================
       ENVIAR RECUPERAÇÃO DE SENHA
       ========================================================= */

    enviarRecuperacao.addEventListener(
      "click",
      async function() {

        mensagemRecuperacao.textContent =
          "";

        mensagemRecuperacao.className =
          "mensagem";


        const email =
          String(
            emailRecuperacao.value || ""
          )
          .trim()
          .toLowerCase();


        const emailAdmin =
          String(
            window.LUX_ADMIN_EMAIL || ""
          )
          .trim()
          .toLowerCase();


        /* -----------------------------------------------------
           VALIDAR E-MAIL
           ----------------------------------------------------- */

        if (!email) {

          mensagemRecuperacao.className =
            "mensagem erro";

          mensagemRecuperacao.textContent =
            "Digite o e-mail administrativo.";

          return;

        }


        if (!emailAdmin) {

          mensagemRecuperacao.className =
            "mensagem erro";

          mensagemRecuperacao.textContent =
            "E-mail administrativo não está configurado no config.js.";

          return;

        }


        if (
          email !== emailAdmin
        ) {

          mensagemRecuperacao.className =
            "mensagem erro";

          mensagemRecuperacao.textContent =
            "Digite o e-mail administrativo cadastrado no sistema.";

          return;

        }


        /* -----------------------------------------------------
           VERIFICAR SUPABASE
           ----------------------------------------------------- */

        if (!window.luxSupabase) {

          mensagemRecuperacao.className =
            "mensagem erro";

          mensagemRecuperacao.textContent =
            "Supabase não foi inicializado. Verifique o config.js.";

          return;

        }


        enviarRecuperacao.disabled =
          true;

        enviarRecuperacao.textContent =
          "Enviando...";


        try {

          /* ---------------------------------------------------
             URL EXATA DA PÁGINA DE REDEFINIÇÃO

             IMPORTANTE:
             Esta página precisa existir no GitHub Pages:
             
             /Lux-Advance/redefinir-senha.html
             --------------------------------------------------- */

          const redirectTo =
            "https://lux-sexshopping.github.io/Lux-Advance/redefinir-senha.html";


          console.log(
            "LUX — e-mail de recuperação:",
            email
          );

          console.log(
            "LUX — URL de redirecionamento:",
            redirectTo
          );


          /* ---------------------------------------------------
             ENVIA O E-MAIL PELO SUPABASE
             --------------------------------------------------- */

          const {
            error
          } =
            await window.luxSupabase.auth
              .resetPasswordForEmail(
                email,
                {
                  redirectTo:
                    redirectTo
                }
              );


          /* ---------------------------------------------------
             VERIFICAR ERRO
             --------------------------------------------------- */

          if (error) {

            console.error(
              "Supabase Recovery Error:",
              error
            );

            throw error;

          }


          /* ---------------------------------------------------
             SUCESSO
             --------------------------------------------------- */

          mensagemRecuperacao.className =
            "mensagem sucesso";

          mensagemRecuperacao.textContent =
            "Link enviado! Verifique o e-mail administrativo.";


        } catch (error) {

          console.error(
            "LUX — erro na recuperação:",
            error
          );


          let textoErro =
            error?.message ||
            "Não foi possível enviar o e-mail de recuperação.";


          const erroMinusculo =
            textoErro.toLowerCase();


          /* ---------------------------------------------------
             TRATAMENTO DE LIMITE DE ENVIO
             --------------------------------------------------- */

          if (
            erroMinusculo.includes(
              "rate limit"
            ) ||
            erroMinusculo.includes(
              "too many requests"
            ) ||
            erroMinusculo.includes(
              "email rate limit"
            )
          ) {

            textoErro =
              "Limite de envio de e-mails atingido. Aguarde alguns minutos e tente novamente.";

          }


          /* ---------------------------------------------------
             TRATAMENTO DE REDIRECT
             --------------------------------------------------- */

          if (
            erroMinusculo.includes(
              "redirect"
            ) ||
            erroMinusculo.includes(
              "not allowed"
            )
          ) {

            textoErro =
              "A URL de recuperação não está autorizada no Supabase. Verifique as Redirect URLs.";

          }


          mensagemRecuperacao.className =
            "mensagem erro";

          mensagemRecuperacao.textContent =
            textoErro;


        } finally {

          enviarRecuperacao.disabled =
            false;

          enviarRecuperacao.textContent =
            "Enviar";

        }

      }
    );


    /* =========================================================
       ESC — FECHAR MODAL
       ========================================================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape"
        ) {

          modal.classList.remove(
            "ativo"
          );

        }

      }
    );

  </script>

</body>

</html>
