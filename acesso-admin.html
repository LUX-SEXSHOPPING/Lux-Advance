<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>LUX — Acesso Executivo</title>

<link
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap"
  rel="stylesheet"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

  font-family:Arial,Helvetica,sans-serif;

  color:#f8f2e8;

  background:
    linear-gradient(
      rgba(5,2,4,.78),
      rgba(8,3,6,.94)
    ),
    url("./Halloween-feminina.jpg")
    center/cover fixed no-repeat;

}


/* =========================
   CARTÃO
========================= */

.container{

  width:100%;

  max-width:470px;

  padding:42px 30px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      rgba(31,13,21,.96),
      rgba(10,5,8,.97)
    );

  border:1px solid
    rgba(216,180,91,.35);

  border-radius:20px;

  box-shadow:
    0 30px 80px rgba(0,0,0,.65),
    0 0 45px rgba(216,180,91,.08);

  backdrop-filter:blur(14px);

}


/* =========================
   LOGO
========================= */

.logo{

  width:82px;

  height:82px;

  margin:0 auto 18px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  border:1px solid #d8b45b;

  color:#f3d889;

  font-family:
    "Playfair Display",
    serif;

  font-size:25px;

  font-weight:700;

  box-shadow:
    0 0 30px rgba(216,180,91,.15);

}


h1{

  font-family:
    "Playfair Display",
    serif;

  font-size:32px;

  color:#f3d889;

  margin-bottom:8px;

}


.subtitulo{

  color:#aaa19a;

  font-size:12px;

  letter-spacing:2px;

  text-transform:uppercase;

  margin-bottom:30px;

}


/* =========================
   TEXTO
========================= */

.descricao{

  color:#bdb5ae;

  font-size:13px;

  line-height:1.7;

  margin-bottom:25px;

}


/* =========================
   CAMPO
========================= */

label{

  display:block;

  text-align:left;

  color:#d8b45b;

  font-size:11px;

  letter-spacing:1.5px;

  margin-bottom:8px;

}


input{

  width:100%;

  height:58px;

  padding:0 18px;

  border-radius:10px;

  border:1px solid
    rgba(216,180,91,.35);

  background:
    rgba(4,3,4,.9);

  color:#fff;

  font-size:18px;

  text-align:center;

  letter-spacing:4px;

  outline:none;

  transition:.2s;

}


input:focus{

  border-color:#d8b45b;

  box-shadow:
    0 0 18px
    rgba(216,180,91,.12);

}


/* =========================
   BOTÃO
========================= */

button{

  width:100%;

  height:54px;

  margin-top:16px;

  border:1px solid #d8b45b;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      #d8b45b,
      #f3d889
    );

  color:#120a0d;

  font-weight:bold;

  letter-spacing:1px;

  cursor:pointer;

  transition:.2s;

}


button:hover{

  transform:translateY(-2px);

  box-shadow:
    0 10px 30px
    rgba(216,180,91,.2);

}


/* =========================
   ERRO
========================= */

.erro{

  display:none;

  margin-top:16px;

  padding:12px;

  border-radius:8px;

  background:
    rgba(120,20,35,.25);

  border:1px solid
    rgba(231,106,124,.35);

  color:#ffadb9;

  font-size:12px;

}


/* =========================
   VOLTAR
========================= */

.voltar{

  display:block;

  margin-top:22px;

  color:#aaa19a;

  text-decoration:none;

  font-size:12px;

}


.voltar:hover{

  color:#f3d889;

}


/* =========================
   RODAPÉ
========================= */

.footer{

  margin-top:28px;

  padding-top:20px;

  border-top:
    1px solid
    rgba(216,180,91,.12);

  color:#777;

  font-size:10px;

  line-height:1.6;

}


.footer strong{

  color:#d8b45b;

}


/* =========================
   CELULAR
========================= */

@media(max-width:500px){

  .container{

    padding:34px 22px;

  }

  h1{

    font-size:28px;

  }

}

</style>

</head>


<body>


<div class="container">


  <div class="logo">
    LUX
  </div>


  <h1>
    Acesso Executivo
  </h1>


  <div class="subtitulo">
    LUX — ADVANCE
  </div>


  <p class="descricao">

    Área restrita de administração.
    Este ambiente é destinado exclusivamente
    à gestão e supervisão da plataforma LUX Advance.

  </p>


  <form
    id="formAdmin"
  >


    <label for="codigoEntrada">
      CÓDIGO DE ACESSO
    </label>


    <input
      type="password"
      id="codigoEntrada"
      placeholder="••••••••"
      autocomplete="off"
      required
    >


    <button
      type="submit"
    >
      ACESSAR PAINEL EXECUTIVO
    </button>


  </form>


  <div
    id="avisoErro"
    class="erro"
  >
    Código de acesso inválido.
  </div>


  <a
    href="./index.html"
    class="voltar"
  >
    ← Voltar para a LUX
  </a>


  <div class="footer">

    <strong>
      LUX ADVANCE
    </strong>

    <br>

    Área administrativa restrita

    <br>

    © 2026 LUX Advance — Todos os direitos reservados.

  </div>


</div>


<script>

/* =========================================================
   LUX — ACESSO ADMINISTRATIVO
   ========================================================= */

const CODIGO_PERMITIDO =
  "LUXADM01";


/*
   ARQUIVO CORRETO DO PAINEL
*/

const PAGINA_ADMIN =
  "./painel-admin.html";


const form =
  document.getElementById(
    "formAdmin"
  );


const campo =
  document.getElementById(
    "codigoEntrada"
  );


const aviso =
  document.getElementById(
    "avisoErro"
  );


form.addEventListener(
  "submit",
  function(event){

    event.preventDefault();


    const digitado =
      campo.value.trim();


    aviso.style.display =
      "none";


    if(
      digitado ===
      CODIGO_PERMITIDO
    ){

      /*
         REDIRECIONAMENTO CORRETO
      */

      window.location.href =
        PAGINA_ADMIN;

    }else{

      aviso.style.display =
        "block";

      campo.value = "";

      campo.focus();

    }

  }
);

</script>


</body>

</html>
