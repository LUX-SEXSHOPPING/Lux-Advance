<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LUX — Acesso Administrativo</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./config.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      color: #eee4d8;

      background:
        linear-gradient(
          rgba(8,3,7,.76),
          rgba(8,3,7,.94)
        ),
        url("./lux-halloween.jpg")
        center / cover fixed no-repeat;

    }


    .container {

      width: 100%;

      max-width: 460px;

    }


    .painel {

      padding: 38px 30px 32px;

      text-align: center;

      border: 1px solid
        rgba(201,162,39,.55);

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(22,8,14,.97),
          rgba(6,3,7,.97)
        );

      box-shadow:
        0 30px 80px
        rgba(0,0,0,.78);

    }


    .icone {

      width: 82px;

      height: 82px;

      margin:
        0 auto 20px;

      display: flex;

      align-items: center;

      justify-content: center;

      border:
        1px solid
        rgba(241,211,107,.65);

      border-radius: 50%;

      color: #f1d36b;

      background:
        rgba(201,162,39,.10);

    }


    .icone i {

      font-size: 31px;

    }


    .marca {

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 32px;

      letter-spacing: 4px;

      color: #f1d36b;

    }


    .subtitulo {

      margin-top: 5px;

      color: #cbbfb1;

      font-size: 16px;

      letter-spacing: 2px;

    }


    .linha {

      width: 90px;

      height: 1px;

      margin:
        22px auto 25px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #c9a227,
          transparent
        );

    }


    h1 {

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      color: #fff1d0;

      font-size: 24px;

      margin-bottom: 10px;

    }


    .descricao {

      color: #bfb2a5;

      font-size: 16px;

      line-height: 1.5;

      margin-bottom: 25px;

    }


    .campo {

      position: relative;

      margin-bottom: 16px;

    }


    .campo i {

      position: absolute;

      left: 17px;

      top: 50%;

      transform:
        translateY(-50%);

      color: #c9a227;

    }


    .campo input {

      width: 100%;

      height: 55px;

      padding:
        0 17px 0 47px;

      border:
        1px solid
        rgba(201,162,39,.30);

      border-radius: 13px;

      outline: none;

      color: #fff;

      background:
        rgba(255,255,255,.045);

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 17px;

    }


    .campo input:focus {

      border-color:
        rgba(241,211,107,.85);

      box-shadow:
        0 0 0 3px
        rgba(201,162,39,.08);

    }


    .botao {

      width: 100%;

      height: 55px;

      border: none;

      border-radius: 13px;

      cursor: pointer;

      color: #170d05;

      background:
        linear-gradient(
          135deg,
          #c9a227,
          #f1d36b,
          #c9a227
        );

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-weight: 700;

      letter-spacing: 1px;

      transition: .2s;

    }


    .botao:hover {

      transform: translateY(-1px);

      box-shadow:
        0 10px 25px
        rgba(201,162,39,.22);

    }


    .botao:disabled {

      opacity: .6;

      cursor: wait;

    }


    .esqueci {

      display: inline-block;

      margin-top: 19px;

      color: #c9a227;

      text-decoration: none;

      font-size: 15px;

      cursor: pointer;

    }


    .esqueci:hover {

      color: #f1d36b;

    }


    .voltar {

      display: block;

      margin-top: 18px;

      color: #8f847b;

      text-decoration: none;

      font-size: 14px;

    }


    .voltar:hover {

      color: #eee4d8;

    }


    .mensagem {

      min-height: 25px;

      margin-top: 16px;

      font-size: 15px;

      line-height: 1.4;

    }


    .erro {

      color: #ff9999;

    }


    .sucesso {

      color: #e6c86e;

    }


    .rodape {

      margin-top: 22px;

      padding-top: 18px;

      border-top:
        1px solid
        rgba(255,255,255,.07);

      color: #70675f;

      font-size: 12px;

    }


    /* MODAL */

    .modal {

      position: fixed;

      inset: 0;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        rgba(0,0,0,.78);

      z-index: 9999;

    }


    .modal.ativo {

      display: flex;

    }


    .modal-box {

      width: 100%;

      max-width: 430px;

      padding: 30px;

      border:
        1px solid
        rgba(201,162,39,.55);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          #180911,
          #070307
        );

      box-shadow:
        0 30px 80px
        rgba(0,0,0,.85);

    }


    .modal-box h2 {

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      color: #f1d36b;

      margin-bottom: 10px;

    }


    .modal-box p {

      color: #bfb2a5;

      line-height: 1.5;

      margin-bottom: 20px;

    }


    .modal-box input {

      width: 100%;

      height: 52px;

      padding: 0 15px;

      border:
        1px solid
        rgba(201,162,39,.35);

      border-radius: 12px;

      outline: none;

      color: #fff;

      background:
        rgba(255,255,255,.05);

      font-size: 16px;

    }


    .modal-acoes {

      display: flex;

      gap: 10px;

      margin-top: 15px;

    }


    .modal-acoes button {

      flex: 1;

      height: 50px;

      border-radius: 11px;

      cursor: pointer;

      font-family:
        "Playfair Display",
        Georgia,
        serif;

    }


    .btn-enviar {

      border: none;

      color: #170d05;

      font-weight: 700;

      background:
        linear-gradient(
          135deg,
          #c9a227,
          #f1d36b
        );

    }


    .btn-fechar {

      border:
        1px solid
        rgba(255,255,255,.15);

      color: #eee4d8;

      background:
        rgba(255,255,255,.04);

    }


    @media (max-width: 500px) {

      .painel {

        padding:
          30px 20px 25px;

      }

      .marca {

        font-size: 28px;

      }

      .modal-box {

        padding: 24px 20px;

      }

    }

  </style>

</head>


<body>


  <main class="container">

    <section class="painel">

      <div class="icone">

        <i class="fas fa-user-shield"></i>

      </div>


      <div class="marca">
        LUX
      </div>


      <div class="subtitulo">
        ADVANCE
      </div>


      <div class="linha"></div>


      <h1>
        Acesso Administrativo
      </h1>


      <p class="descricao">

        Área exclusiva para administração
        e gerenciamento da plataforma LUX.

      </p>


      <form id="formLogin">

        <div class="campo">

          <i class="fas fa-envelope"></i>

          <input
            type="email"
            id="email"
            placeholder="E-mail administrativo"
            autocomplete="username"
            required
          >

        </div>


        <div class="campo">

          <i class="fas fa-lock"></i>

          <input
            type="password"
            id="senha"
            placeholder="Senha"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          class="botao"
          id="btnEntrar"
        >

          <i class="fas fa-right-to-bracket"></i>

          &nbsp;

          ENTRAR NO PAINEL

        </button>

      </form>


      <div
        id="mensagem"
        class="mensagem"
      ></div>


      <a
        href="#"
        class="esqueci"
        id="btnEsqueci"
      >

        <i class="fas fa-key"></i>

        Esqueci minha senha

      </a>


      <a
        href="./index.html"
        class="voltar"
      >

        <i class="fas fa-arrow-left"></i>

        Voltar para o site

      </a>


      <div class="rodape">

        LUX Advance © 2026

      </div>

    </section>

  </main>



  <!-- MODAL RECUPERAÇÃO -->

  <div
    class="modal"
    id="modalRecuperacao"
  >

    <div class="modal-box">

      <h2>
        Recuperar senha
      </h2>

      <p>

        Enviaremos um link seguro para
        redefinir a senha administrativa.

      </p>


      <input
        type="email"
        id="emailRecuperacao"
        placeholder="E-mail administrativo"
        autocomplete="email"
      >


      <div class="modal-acoes">

        <button
          type="button"
          class="btn-fechar"
          id="btnFechar"
        >

          CANCELAR

        </button>


        <button
          type="button"
          class="btn-enviar"
          id="btnEnviar"
        >

          ENVIAR LINK

        </button>

      </div>


      <div
        id="mensagemRecuperacao"
        class="mensagem"
      ></div>

    </div>

  </div>



  <script>

    const supabase =
      window.luxSupabase;


    const formLogin =
      document.getElementById(
        "formLogin"
      );


    const email =
      document.getElementById(
        "email"
      );


    const senha =
      document.getElementById(
        "senha"
      );


    const btnEntrar =
      document.getElementById(
        "btnEntrar"
      );


    const mensagem =
      document.getElementById(
        "mensagem"
      );


    const modal =
      document.getElementById(
        "modalRecuperacao"
      );


    const emailRecuperacao =
      document.getElementById(
        "emailRecuperacao"
      );


    const btnEsqueci =
      document.getElementById(
        "btnEsqueci"
      );


    const btnFechar =
      document.getElementById(
        "btnFechar"
      );


    const btnEnviar =
      document.getElementById(
        "btnEnviar"
      );


    const mensagemRecuperacao =
      document.getElementById(
        "mensagemRecuperacao"
      );


    function mostrarMensagem(
      texto,
      tipo
    ) {

      mensagem.textContent =
        texto;

      mensagem.className =
        "mensagem " +
        (tipo || "");

    }


    function mostrarMensagemRecuperacao(
      texto,
      tipo
    ) {

      mensagemRecuperacao.textContent =
        texto;

      mensagemRecuperacao.className =
        "mensagem " +
        (tipo || "");

    }


    if (!supabase) {

      mostrarMensagem(
        "Supabase não foi inicializado. Verifique o config.js.",
        "erro"
      );

    }


    /*
     * LOGIN ADMINISTRATIVO
     */

    formLogin.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        if (!supabase) {

          mostrarMensagem(
            "Supabase não foi inicializado.",
            "erro"
          );

          return;

        }


        const emailDigitado =
          String(
            email.value || ""
          )
          .trim()
          .toLowerCase();


        const senhaDigitada =
          String(
            senha.value || ""
          );


        if (!emailDigitado ||
            !senhaDigitada) {

          mostrarMensagem(
            "Informe o e-mail e a senha.",
            "erro"
          );

          return;

        }


        const adminEmail =
          String(
            window.LUX_ADMIN_EMAIL || ""
          )
          .trim()
          .toLowerCase();


        if (
          !adminEmail
        ) {

          mostrarMensagem(
            "E-mail administrativo não configurado no config.js.",
            "erro"
          );

          return;

        }


        if (
          emailDigitado !==
          adminEmail
        ) {

          mostrarMensagem(
            "Acesso administrativo não autorizado.",
            "erro"
          );

          return;

        }


        btnEntrar.disabled =
          true;


        btnEntrar.innerHTML =
          '<i class="fas fa-spinner fa-spin"></i> VERIFICANDO...';


        mostrarMensagem(
          "",
          ""
        );


        try {

          const {
            data,
            error
          } =
            await supabase.auth.signInWithPassword({

              email:
                emailDigitado,

              password:
                senhaDigitada

            });


          if (error) {

            console.error(
              "Erro no login:",
              error
            );

            const erro =
              String(
                error.message || ""
              ).toLowerCase();


            if (
              erro.includes(
                "invalid login credentials"
              )
            ) {

              throw new Error(
                "E-mail ou senha incorretos."
              );

            }


            throw new Error(
              error.message ||
              "Não foi possível realizar o login."
            );

          }


          const user =
            data?.user;


          if (!user) {

            throw new Error(
              "Usuário administrativo não encontrado."
            );

          }


          if (
            String(
              user.email || ""
            )
            .trim()
            .toLowerCase()
            !==
            adminEmail
          ) {

            await supabase.auth.signOut();

            throw new Error(
              "Este usuário não possui permissão administrativa."
            );

          }


          /*
           * Confirma se a sessão realmente foi criada
           */

          const {
            data: sessionData
          } =
            await supabase.auth.getSession();


          if (
            !sessionData?.session
          ) {

            throw new Error(
              "A sessão administrativa não foi criada. Tente novamente."
            );

          }


          mostrarMensagem(
            "Acesso autorizado. Abrindo painel...",
            "sucesso"
          );


          setTimeout(
            function() {

              window.location.replace(
                "./painel-admin.html"
              );

            },
            500
          );


        } catch (error) {

          console.error(
            "Erro administrativo:",
            error
          );


          mostrarMensagem(
            error?.message ||
            "Não foi possível entrar.",
            "erro"
          );


          btnEntrar.disabled =
            false;


          btnEntrar.innerHTML =
            '<i class="fas fa-right-to-bracket"></i> &nbsp; ENTRAR NO PAINEL';

        }

      }
    );



    /*
     * ABRIR RECUPERAÇÃO
     */

    btnEsqueci.addEventListener(
      "click",
      function(event) {

        event.preventDefault();


        emailRecuperacao.value =
          window.LUX_ADMIN_EMAIL ||
          email.value ||
          "";


        mostrarMensagemRecuperacao(
          "",
          ""
        );


        modal.classList.add(
          "ativo"
        );

      }
    );



    /*
     * FECHAR MODAL
     */

    btnFechar.addEventListener(
      "click",
      function() {

        modal.classList.remove(
          "ativo"
        );

      }
    );



    modal.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          modal
        ) {

          modal.classList.remove(
            "ativo"
          );

        }

      }
    );



    /*
     * ENVIAR RECUPERAÇÃO
     */

    btnEnviar.addEventListener(
      "click",
      async function() {

        if (!supabase) {

          mostrarMensagemRecuperacao(
            "Supabase não foi inicializado.",
            "erro"
          );

          return;

        }


        const emailDigitado =
          String(
            emailRecuperacao.value || ""
          )
          .trim()
          .toLowerCase();


        const adminEmail =
          String(
            window.LUX_ADMIN_EMAIL || ""
          )
          .trim()
          .toLowerCase();


        if (!emailDigitado) {

          mostrarMensagemRecuperacao(
            "Informe o e-mail administrativo.",
            "erro"
          );

          return;

        }


        if (
          emailDigitado !==
          adminEmail
        ) {

          mostrarMensagemRecuperacao(
            "Informe o e-mail administrativo correto.",
            "erro"
          );

          return;

        }


        btnEnviar.disabled =
          true;


        btnEnviar.textContent =
          "ENVIANDO...";


        try {

          /*
           * ESTA É A PÁGINA QUE DEVE EXISTIR
           * NO MESMO PROJETO DO GITHUB PAGES.
           */

          const redirectTo =
            "https://lux-sexshopping.github.io/Lux-Advance/redefinir-senha.html";


          const {
            error
          } =
            await supabase.auth.resetPasswordForEmail(
              emailDigitado,
              {
                redirectTo:
                  redirectTo
              }
            );


          if (error) {

            console.error(
              "Erro recuperação:",
              error
            );

            throw error;

          }


          mostrarMensagemRecuperacao(
            "Link enviado. Verifique sua caixa de entrada e também a pasta de spam.",
            "sucesso"
          );


        } catch (error) {

          console.error(
            "Erro ao enviar recuperação:",
            error
          );


          const erro =
            String(
              error?.message || ""
            ).toLowerCase();


          if (
            erro.includes(
              "rate limit"
            ) ||
            erro.includes(
              "too many"
            )
          ) {

            mostrarMensagemRecuperacao(
              "O envio de recuperação foi temporariamente limitado. Aguarde e tente novamente.",
              "erro"
            );

          } else {

            mostrarMensagemRecuperacao(
              error?.message ||
              "Não foi possível enviar o e-mail de recuperação.",
              "erro"
            );

          }

        }


        btnEnviar.disabled =
          false;


        btnEnviar.textContent =
          "ENVIAR LINK";

      }
    );

  </script>

</body>

</html>
