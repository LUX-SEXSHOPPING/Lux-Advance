<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>LUX — Acesso Executivo</title>

<link
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap"
  rel="stylesheet"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

  font-family:Arial,sans-serif;

  color:#f8f1e7;

  background:
    linear-gradient(
      rgba(5,3,4,.78),
      rgba(8,3,6,.94)
    ),
    url("./Halloween-feminina.jpg")
    center/cover fixed no-repeat;

}

.container{

  width:100%;

  max-width:470px;

}

.card{

  background:
    linear-gradient(
      145deg,
      rgba(30,14,21,.97),
      rgba(9,5,7,.98)
    );

  border:
    1px solid rgba(216,180,91,.35);

  border-radius:20px;

  padding:38px 30px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.65),
    0 0 35px rgba(216,180,91,.08);

  text-align:center;

}

.logo{

  width:78px;

  height:78px;

  margin:0 auto 20px;

  border-radius:50%;

  border:1px solid #d8b45b;

  display:flex;

  align-items:center;

  justify-content:center;

  font-family:
    "Playfair Display",
    serif;

  font-size:25px;

  font-weight:bold;

  color:#f3d889;

  box-shadow:
    0 0 25px rgba(216,180,91,.15);

}

h1{

  font-family:
    "Playfair Display",
    serif;

  color:#f3d889;

  font-size:31px;

  margin-bottom:8px;

}

.subtitulo{

  color:#aaa19a;

  font-size:12px;

  line-height:1.6;

  margin-bottom:30px;

}

.label{

  display:block;

  text-align:left;

  color:#d8b45b;

  font-size:11px;

  letter-spacing:1.5px;

  margin-bottom:8px;

}

input{

  width:100%;

  height:58px;

  padding:0 16px;

  border-radius:10px;

  border:1px solid rgba(216,180,91,.3);

  background:#080506;

  color:white;

  outline:none;

  font-size:18px;

  text-align:center;

  letter-spacing:4px;

}

input:focus{

  border-color:#d8b45b;

  box-shadow:
    0 0 15px rgba(216,180,91,.1);

}

button{

  width:100%;

  height:54px;

  margin-top:18px;

  border:none;

  border-radius:10px;

  cursor:pointer;

  font-weight:bold;

  letter-spacing:1px;

  color:#090506;

  background:
    linear-gradient(
      135deg,
      #c99e3e,
      #f3d889,
      #c99e3e
    );

  transition:.2s;

}

button:hover{

  transform:translateY(-2px);

  box-shadow:
    0 8px 25px rgba(216,180,91,.2);

}

.voltar{

  display:block;

  margin-top:22px;

  color:#999;

  text-decoration:none;

  font-size:12px;

}

.voltar:hover{

  color:#f3d889;

}

#avisoErro{

  display:none;

  margin-top:18px;

  padding:12px;

  border-radius:8px;

  border:1px solid rgba(231,106,124,.35);

  background:rgba(120,20,40,.15);

  color:#ffabb8;

  font-size:12px;

  line-height:1.5;

}

.rodape{

  margin-top:22px;

  color:#666;

  font-size:10px;

  line-height:1.6;

}

</style>

</head>


<body>

<div class="container">

  <div class="card">

    <div class="logo">
      LUX
    </div>

    <h1>
      Acesso Executivo
    </h1>

    <p class="subtitulo">

      Área administrativa da LUX Advance.
      Acesso restrito à administração da plataforma.

    </p>


    <label
      class="label"
      for="codigoEntrada"
    >
      CÓDIGO DE ACESSO
    </label>


    <input
      type="password"
      id="codigoEntrada"
      placeholder="••••••••"
      autocomplete="off"
      onkeydown="teclaEnter(event)"
    >


    <button
      onclick="verificar()"
    >
      ENTRAR NO PAINEL
    </button>


    <div id="avisoErro">

      Código de acesso inválido.

    </div>


    <a
      href="./index.html"
      class="voltar"
    >
      ← Voltar para a LUX
    </a>


    <div class="rodape">

      LUX ADVANCE<br>

      Agência Europeia • Conteúdo para maiores de 18 anos<br><br>

      © 2026 LUX Advance

    </div>

  </div>

</div>


<script>

/* =========================================================
   LUX — ACESSO EXECUTIVO
   ========================================================= */

const CODIGO_PERMITIDO =
  "LUXADM01";


const PAGINA_ADMIN =
  "./painel-admin.html";


function verificar(){

  const campo =
    document.getElementById(
      "codigoEntrada"
    );


  const aviso =
    document.getElementById(
      "avisoErro"
    );


  const codigo =
    campo.value.trim();


  aviso.style.display =
    "none";


  if(
    codigo === CODIGO_PERMITIDO
  ){

    /*
      IMPORTANTE:
      O destino correto é
      painel-admin.html
    */

    window.location.href =
      PAGINA_ADMIN;

    return;

  }


  aviso.style.display =
    "block";

  campo.value = "";

  campo.focus();

}


function teclaEnter(event){

  if(
    event.key === "Enter"
  ){

    verificar();

  }

}

</script>

</body>

</html>
