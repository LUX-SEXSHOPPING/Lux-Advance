<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>LUX — Acesso Administrativo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./config.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  font-family:Arial,Helvetica,sans-serif;

  color:#fff;

  background:
    linear-gradient(
      rgba(5,3,6,.88),
      rgba(5,3,6,.96)
    ),
    url("./lux-halloween.jpg")
    center/cover fixed;

}

.login-box{

  width:min(430px,100%);

  padding:38px 28px;

  border:1px solid rgba(248,213,138,.22);

  border-radius:24px;

  background:
    rgba(20,9,17,.96);

  box-shadow:
    0 25px 80px rgba(0,0,0,.65);

  text-align:center;

}

.logo{

  font-family:Georgia,serif;

  font-size:58px;

  letter-spacing:8px;

  color:#f8d58a;

  text-shadow:
    0 0 25px
    rgba(248,213,138,.22);

}

.subtitle{

  margin-top:8px;

  color:#b9aab6;

  font-size:13px;

  letter-spacing:1.5px;

  text-transform:uppercase;

}

.form-area{

  margin-top:30px;

  text-align:left;

}

label{

  display:block;

  margin-bottom:8px;

  color:#d7c9d3;

  font-size:13px;

}

input{

  width:100%;

  height:48px;

  padding:0 14px;

  border:1px solid
    rgba(248,213,138,.18);

  border-radius:10px;

  outline:none;

  color:white;

  background:
    rgba(255,255,255,.05);

}

input:focus{

  border-color:#ff4da6;

  box-shadow:
    0 0 0 3px
    rgba(255,77,166,.08);

}

button{

  width:100%;

  height:48px;

  margin-top:16px;

  border:0;

  border-radius:10px;

  color:#180b11;

  background:
    linear-gradient(
      135deg,
      #f8d58a,
      #d9aa4b
    );

  font-weight:bold;

  cursor:pointer;

}

button:disabled{

  opacity:.6;

  cursor:wait;

}

.message{

  display:none;

  margin-top:15px;

  padding:12px;

  border-radius:10px;

  font-size:13px;

  line-height:1.5;

}

.message.show{
  display:block;
}

.error{

  color:#ff9d9d;

  background:
    rgba(255,70,70,.09);

  border:1px solid
    rgba(255,70,70,.18);

}

.success{

  color:#78e8b5;

  background:
    rgba(70,211,154,.08);

  border:1px solid
    rgba(70,211,154,.18);

}

.loading{

  position:fixed;

  inset:0;

  z-index:99999;

  display:none;

  align-items:center;

  justify-content:center;

  background:#080509;

}

.loading.show{
  display:flex;
}

.loading-box{

  width:min(90%,420px);

  padding:35px 25px;

  text-align:center;

  border:1px solid
    rgba(248,213,138,.18);

  border-radius:22px;

  background:
    rgba(20,10,18,.96);

}

.loading-logo{

  font-family:Georgia,serif;

  font-size:48px;

  letter-spacing:7px;

  color:#f8d58a;

}

.loading-text{

  margin-top:12px;

  color:#b9aab6;

}

.spinner{

  width:38px;

  height:38px;

  margin:25px auto 0;

  border:3px solid
    rgba(255,255,255,.12);

  border-top-color:#ff4da6;

  border-radius:50%;

  animation:
    spin 1s linear infinite;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

.back{

  display:block;

  margin-top:20px;

  color:#b9aab6;

  text-decoration:none;

  font-size:12px;

}

.back:hover{
  color:#ff79bd;
}

</style>

</head>

<body>

<div class="login-box">

  <div class="logo">
    LUX
  </div>

  <div class="subtitle">
    Acesso administrativo
  </div>

  <div class="form-area">

    <form id="formAdmin">

      <label for="senhaAdmin">
        Senha administrativa
      </label>

      <input
        id="senhaAdmin"
        type="password"
        autocomplete="current-password"
        placeholder="Digite sua senha"
        required
      >

      <button
        id="btnEntrar"
        type="submit"
      >
        Entrar no painel
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

  </div>

  <a
    href="./index.html"
    class="back"
  >
    Voltar para a LUX
  </a>

</div>


<div
  id="loading"
  class="loading"
>

  <div class="loading-box">

    <div class="loading-logo">
      LUX
    </div>

    <div class="loading-text">
      Abrindo painel administrativo...
    </div>

    <div class="spinner"></div>

  </div>

</div>


<script>

const supabase = window.luxSupabase;

const ADMIN_EMAIL =
  String(
    window.LUX_ADMIN_EMAIL || ""
  )
  .trim()
  .toLowerCase();


const form =
  document.getElementById(
    "formAdmin"
  );

const senha =
  document.getElementById(
    "senhaAdmin"
  );

const btn =
  document.getElementById(
    "btnEntrar"
  );

const message =
  document.getElementById(
    "message"
  );

const loading =
  document.getElementById(
    "loading"
  );


function mostrarMensagem(
  texto,
  tipo = "error"
){

  message.textContent =
    texto;

  message.className =
    "message show " +
    tipo;

}


function mostrarCarregando(){

  loading.classList.add(
    "show"
  );

  btn.disabled = true;

}


function esconderCarregando(){

  loading.classList.remove(
    "show"
  );

  btn.disabled = false;

}


form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    message.className =
      "message";

    const senhaDigitada =
      senha.value;

    if(!senhaDigitada){

      mostrarMensagem(
        "Digite sua senha administrativa."
      );

      return;

    }

    if(!supabase){

      mostrarMensagem(
        "Supabase não foi inicializado. Verifique o config.js."
      );

      return;

    }

    if(!ADMIN_EMAIL){

      mostrarMensagem(
        "E-mail administrativo não configurado no config.js."
      );

      return;

    }


    mostrarCarregando();


    try{

      /*
       * LOGIN DIRETO
       * Não ficamos esperando outro
       * getSession() para liberar o painel.
       */

      const resultado =
        await supabase.auth.signInWithPassword({

          email:
            ADMIN_EMAIL,

          password:
            senhaDigitada

        });


      if(resultado.error){

        throw resultado.error;

      }


      const usuario =
        resultado.data?.user;


      if(!usuario){

        throw new Error(
          "A sessão administrativa não foi criada."
        );

      }


      const emailUsuario =
        String(
          usuario.email || ""
        )
        .trim()
        .toLowerCase();


      if(
        emailUsuario !==
        ADMIN_EMAIL
      ){

        await supabase.auth.signOut();

        throw new Error(
          "Esta conta não possui permissão administrativa."
        );

      }


      mostrarMensagem(
        "Acesso autorizado. Abrindo painel...",
        "success"
      );


      /*
       * PEQUENO TEMPO APENAS PARA
       * A SESSÃO SER PERSISTIDA.
       */

      setTimeout(
        function(){

          window.location.replace(
            "./painel-admin.html"
          );

        },
        250
      );


    }catch(error){

      console.error(
        "Erro no acesso administrativo:",
        error
      );

      esconderCarregando();

      mostrarMensagem(
        error?.message ||
        "Senha incorreta ou erro ao acessar o painel."
      );

    }

  }
);


/*
 * Se o administrador já estiver
 * autenticado, pode entrar diretamente.
 *
 * Não usamos isso para aguardar o login.
 */

(async function verificarSessaoExistente(){

  try{

    if(!supabase){
      return;
    }

    const resultado =
      await supabase.auth.getSession();

    const session =
      resultado.data?.session;

    if(!session?.user){
      return;
    }

    const email =
      String(
        session.user.email || ""
      )
      .trim()
      .toLowerCase();

    if(
      email === ADMIN_EMAIL
    ){

      window.location.replace(
        "./painel-admin.html"
      );

    }

  }catch(error){

    console.warn(
      "Sessão existente não pôde ser verificada:",
      error
    );

  }

})();

</script>

</body>

</html>
