<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>LUX — Cadastro de Modelo</title>

  <link
    rel="stylesheet"
    href="app.css"
  >

  <link
    rel="stylesheet"
    href="login.css"
  >

</head>

<body>

  <main class="login-wrap">

    <a
      class="voltar"
      href="login.html"
    >
      ← Voltar ao login
    </a>

    <section class="login-card">

      <div class="marca">
        LUX
      </div>

      <p class="sub">
        Cadastro de modelo
      </p>

      <p
        style="
          color:#b9afb4;
          line-height:1.6;
          text-align:center;
        "
      >
        Faça seu cadastro para análise
        e aprovação pela administração LUX.
      </p>

      <div
        id="mensagem"
        class="mensagem"
        hidden
      ></div>

      <form id="cadastroModeloForm">

        <label for="nome">
          Nome
        </label>

        <input
          id="nome"
          type="text"
          autocomplete="name"
          required
          placeholder="Seu nome"
        >

        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          required
          placeholder="seu@email.com"
        >

        <label for="senha">
          Senha
        </label>

        <input
          id="senha"
          type="password"
          autocomplete="new-password"
          minlength="6"
          required
          placeholder="Mínimo de 6 caracteres"
        >

        <label for="confirmarSenha">
          Confirmar senha
        </label>

        <input
          id="confirmarSenha"
          type="password"
          autocomplete="new-password"
          minlength="6"
          required
          placeholder="Digite a senha novamente"
        >

        <button
          class="btn primary"
          type="submit"
          id="btnCadastrar"
        >
          Enviar cadastro
        </button>

      </form>

      <p class="senha-link">

        Já possui uma conta?

        <a href="login.html">
          Entrar
        </a>

      </p>

      <div class="separador">
        <span>USUÁRIO</span>
      </div>

      <div class="cadastros">

        <a href="cadastro-usuario.html">
          Criar conta de usuário
        </a>

      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="auth.js"></script>

  <script>

    document
      .getElementById("cadastroModeloForm")
      .addEventListener(
        "submit",
        async function(e) {

          e.preventDefault();

          const mensagem =
            document.getElementById("mensagem");

          const botao =
            document.getElementById("btnCadastrar");

          const nome =
            document
              .getElementById("nome")
              .value
              .trim();

          const email =
            document
              .getElementById("email")
              .value
              .trim();

          const senha =
            document
              .getElementById("senha")
              .value;

          const confirmarSenha =
            document
              .getElementById("confirmarSenha")
              .value;

          mensagem.hidden = false;

          mensagem.className =
            "mensagem";

          if (nome.length < 2) {

            mensagem.className =
              "mensagem error";

            mensagem.textContent =
              "Informe seu nome.";

            return;

          }

          if (senha.length < 6) {

            mensagem.className =
              "mensagem error";

            mensagem.textContent =
              "A senha deve ter pelo menos 6 caracteres.";

            return;

          }

          if (senha !== confirmarSenha) {

            mensagem.className =
              "mensagem error";

            mensagem.textContent =
              "As senhas não coincidem.";

            return;

          }

          botao.disabled = true;

          mensagem.textContent =
            "Enviando cadastro...";

          try {

            await cadastrar(
              "modelo",
              nome,
              email,
              senha
            );

            mensagem.className =
              "mensagem success";

            mensagem.textContent =
              "Cadastro enviado com sucesso! Seu perfil ficará aguardando aprovação da administração.";

            document
              .getElementById("nome")
              .disabled = true;

            document
              .getElementById("email")
              .disabled = true;

            document
              .getElementById("senha")
              .disabled = true;

            document
              .getElementById("confirmarSenha")
              .disabled = true;

            setTimeout(
              function() {

                window.location.href =
                  "login.html";

              },
              3500
            );

          } catch (erro) {

            mensagem.className =
              "mensagem error";

            mensagem.textContent =
              erro.message;

            botao.disabled = false;

          }

        }
      );

  </script>

</body>

</html>
