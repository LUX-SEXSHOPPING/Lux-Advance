<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Modelo — LUX</title>

  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="login.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-brand">
        <div class="login-logo">LUX</div>

        <div class="login-subtitle">
          Sensualidade & Sofisticação
        </div>
      </div>

      <h1>Cadastro de Modelo</h1>

      <p class="login-description">
        Crie sua conta para solicitar seu cadastro na plataforma LUX.
      </p>

      <form id="cadastroModeloForm">

        <!-- NOME -->

        <label for="nome">Nome completo</label>

        <input
          type="text"
          id="nome"
          placeholder="Digite seu nome completo"
          autocomplete="name"
          required
        >


        <!-- APELIDO -->

        <label for="apelido">Apelido / Nome artístico</label>

        <input
          type="text"
          id="apelido"
          placeholder="Digite seu nome artístico"
          autocomplete="nickname"
        >


        <!-- CPF -->

        <label for="cpf">CPF</label>

        <input
          type="text"
          id="cpf"
          placeholder="000.000.000-00"
          inputmode="numeric"
          maxlength="14"
          autocomplete="off"
          required
        >


        <!-- DATA DE NASCIMENTO -->

        <label for="dataNascimento">
          Data de nascimento
        </label>

        <input
          type="date"
          id="dataNascimento"
          autocomplete="bday"
          required
        >


        <!-- WHATSAPP -->

        <label for="whatsapp">WhatsApp</label>

        <input
          type="tel"
          id="whatsapp"
          placeholder="(00) 00000-0000"
          autocomplete="tel"
          required
        >


        <!-- CATEGORIA -->

        <label for="categoriaCatalogo">
          Como deseja aparecer no catálogo?
        </label>

        <select
          id="categoriaCatalogo"
          required
        >

          <option value="">
            Selecione uma categoria
          </option>

          <option value="feminino">
            Modelo Feminino
          </option>

          <option value="masculino">
            Modelo Masculino
          </option>

          <option value="lgbtq">
            LGBTQ+
          </option>

        </select>


        <!-- IDADE -->

        <label for="idade">Idade</label>

        <input
          type="number"
          id="idade"
          placeholder="Será calculada pela data de nascimento"
          min="18"
          max="100"
          readonly
          required
        >


        <!-- ALTURA -->

        <label for="altura">Altura</label>

        <input
          type="number"
          id="altura"
          placeholder="Altura em centímetros"
          min="100"
          max="250"
        >


        <!-- CEP -->

        <label for="cep">CEP</label>

        <input
          type="text"
          id="cep"
          placeholder="00000-000"
          inputmode="numeric"
          maxlength="9"
          autocomplete="postal-code"
          required
        >


        <!-- ESTADO -->

        <label for="estado">Estado / UF</label>

        <input
          type="text"
          id="estado"
          placeholder="Ex.: RS"
          maxlength="2"
          autocomplete="address-level1"
          required
        >


        <!-- CIDADE -->

        <label for="cidade">Cidade</label>

        <input
          type="text"
          id="cidade"
          placeholder="Digite sua cidade"
          autocomplete="address-level2"
          required
        >


        <!-- BAIRRO -->

        <label for="bairro">Bairro</label>

        <input
          type="text"
          id="bairro"
          placeholder="Digite seu bairro"
          autocomplete="address-level3"
          required
        >


        <!-- ENDEREÇO -->

        <label for="endereco">
          Rua / Logradouro
        </label>

        <input
          type="text"
          id="endereco"
          placeholder="Digite a rua ou logradouro"
          autocomplete="street-address"
          required
        >


        <!-- NÚMERO -->

        <label for="numero">Número</label>

        <input
          type="text"
          id="numero"
          placeholder="Número"
          autocomplete="address-line2"
          required
        >


        <!-- COMPLEMENTO -->

        <label for="complemento">
          Complemento
        </label>

        <input
          type="text"
          id="complemento"
          placeholder="Apartamento, casa, bloco etc."
          autocomplete="address-line2"
        >


        <!-- PAÍS -->

        <label for="pais">País</label>

        <input
          type="text"
          id="pais"
          value="Brasil"
          autocomplete="country-name"
        >


        <!-- CABELO -->

        <label for="corCabelo">
          Cor do cabelo
        </label>

        <input
          type="text"
          id="corCabelo"
          placeholder="Ex.: Castanho"
        >


        <!-- OLHOS -->

        <label for="corOlhos">
          Cor dos olhos
        </label>

        <input
          type="text"
          id="corOlhos"
          placeholder="Ex.: Castanhos"
        >


        <!-- IDIOMAS -->

        <label for="idiomas">Idiomas</label>

        <input
          type="text"
          id="idiomas"
          placeholder="Ex.: Português, Espanhol"
        >


        <!-- DESCRIÇÃO -->

        <label for="descricao">
          Descrição
        </label>

        <textarea
          id="descricao"
          placeholder="Escreva uma breve descrição sobre você"
          rows="5"
        ></textarea>


        <!-- EMAIL -->

        <label for="email">E-mail</label>

        <input
          type="email"
          id="email"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        >


        <!-- SENHA -->

        <label for="senha">Senha</label>

        <input
          type="password"
          id="senha"
          placeholder="Mínimo de 6 caracteres"
          autocomplete="new-password"
          minlength="6"
          required
        >


        <!-- CONFIRMAR SENHA -->

        <label for="confirmarSenha">
          Confirmar senha
        </label>

        <input
          type="password"
          id="confirmarSenha"
          placeholder="Digite a senha novamente"
          autocomplete="new-password"
          minlength="6"
          required
        >


        <!-- MAIORIDADE -->

        <label class="checkbox-row">

          <input
            type="checkbox"
            id="maioridade"
            required
          >

          <span>
            Confirmo que sou maior de 18 anos.
          </span>

        </label>


        <!-- BOTÃO -->

        <button
          type="submit"
          class="btn-primary"
          id="btnCadastrarModelo"
        >
          Solicitar cadastro
        </button>

      </form>


      <div
        id="mensagem"
        class="login-message"
      ></div>


      <div class="login-links">

        <a href="login.html">
          Já tenho uma conta
        </a>

        <a href="cadastro-usuario.html">
          Cadastro de usuário
        </a>

      </div>

    </section>

  </main>


  <script>

    const formulario =
      document.getElementById(
        "cadastroModeloForm"
      );


    const mensagem =
      document.getElementById(
        "mensagem"
      );


    const botao =
      document.getElementById(
        "btnCadastrarModelo"
      );


    /* =====================================================
       MÁSCARA CPF
       ===================================================== */

    document
      .getElementById("cpf")
      .addEventListener(
        "input",
        function () {

          let valor =
            this.value
              .replace(/\D/g, "")
              .slice(0, 11);


          valor =
            valor.replace(
              /(\d{3})(\d)/,
              "$1.$2"
            );


          valor =
            valor.replace(
              /(\d{3})(\d)/,
              "$1.$2"
            );


          valor =
            valor.replace(
              /(\d{3})(\d{1,2})$/,
              "$1-$2"
            );


          this.value =
            valor;

        }
      );


    /* =====================================================
       MÁSCARA CEP
       ===================================================== */

    document
      .getElementById("cep")
      .addEventListener(
        "input",
        function () {

          let valor =
            this.value
              .replace(/\D/g, "")
              .slice(0, 8);


          if (valor.length > 5) {

            valor =
              valor.substring(0, 5) +
              "-" +
              valor.substring(5);

          }


          this.value =
            valor;

        }
      );


    /* =====================================================
       MÁSCARA WHATSAPP
       ===================================================== */

    document
      .getElementById("whatsapp")
      .addEventListener(
        "input",
        function () {

          let valor =
            this.value
              .replace(/\D/g, "")
              .slice(0, 11);


          if (valor.length <= 10) {

            valor =
              valor.replace(
                /^(\d{2})(\d)/,
                "($1) $2"
              );

            valor =
              valor.replace(
                /(\d{4})(\d)/,
                "$1-$2"
              );

          } else {

            valor =
              valor.replace(
                /^(\d{2})(\d)/,
                "($1) $2"
              );

            valor =
              valor.replace(
                /(\d{5})(\d)/,
                "$1-$2"
              );

          }


          this.value =
            valor;

        }
      );


    /* =====================================================
       DATA DE NASCIMENTO → IDADE
       ===================================================== */

    function calcularIdade() {

      const campoData =
        document.getElementById(
          "dataNascimento"
        );


      const campoIdade =
        document.getElementById(
          "idade"
        );


      if (!campoData.value) {

        campoIdade.value =
          "";

        return;

      }


      const nascimento =
        new Date(
          campoData.value +
          "T00:00:00"
        );


      const hoje =
        new Date();


      let idade =
        hoje.getFullYear() -
        nascimento.getFullYear();


      const mes =
        hoje.getMonth() -
        nascimento.getMonth();


      if (
        mes < 0 ||
        (
          mes === 0 &&
          hoje.getDate() <
          nascimento.getDate()
        )
      ) {

        idade--;

      }


      campoIdade.value =
        idade >= 0
          ? idade
          : "";

    }


    document
      .getElementById(
        "dataNascimento"
      )
      .addEventListener(
        "change",
        calcularIdade
      );


    /* =====================================================
       BUSCA CEP — VIACEP
       ===================================================== */

    document
      .getElementById("cep")
      .addEventListener(
        "blur",
        async function () {

          const cep =
            this.value
              .replace(/\D/g, "");


          if (cep.length !== 8) {

            return;

          }


          try {

            const resposta =
              await fetch(
                "https://viacep.com.br/ws/" +
                cep +
                "/json/"
              );


            if (!resposta.ok) {

              throw new Error(
                "Não foi possível consultar o CEP."
              );

            }


            const dados =
              await resposta.json();


            if (dados.erro) {

              mensagem.className =
                "login-message error";

              mensagem.textContent =
                "CEP não encontrado.";

              return;

            }


            document
              .getElementById("estado")
              .value =
              dados.uf || "";


            document
              .getElementById("cidade")
              .value =
              dados.localidade || "";


            document
              .getElementById("bairro")
              .value =
              dados.bairro || "";


            document
              .getElementById("endereco")
              .value =
              dados.logradouro || "";


            mensagem.textContent =
              "";

            mensagem.className =
              "login-message";

          } catch (erro) {

            console.error(
              "Erro ao consultar CEP:",
              erro
            );

          }

        }
      );


    /* =====================================================
       ENVIO DO CADASTRO
       ===================================================== */

    formulario.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const nome =
          document
            .getElementById("nome")
            .value
            .trim();


        const apelido =
          document
            .getElementById("apelido")
            .value
            .trim();


        const cpf =
          document
            .getElementById("cpf")
            .value
            .trim();


        const dataNascimento =
          document
            .getElementById("dataNascimento")
            .value;


        const whatsapp =
          document
            .getElementById("whatsapp")
            .value
            .trim();


        const categoriaCatalogo =
          document
            .getElementById(
              "categoriaCatalogo"
            )
            .value;


        const idade =
          Number(
            document
              .getElementById("idade")
              .value
          );


        const altura =
          Number(
            document
              .getElementById("altura")
              .value
          ) || null;


        const cep =
          document
            .getElementById("cep")
            .value
            .trim();


        const estado =
          document
            .getElementById("estado")
            .value
            .trim()
            .toUpperCase();


        const cidade =
          document
            .getElementById("cidade")
            .value
            .trim();


        const bairro =
          document
            .getElementById("bairro")
            .value
            .trim();


        const endereco =
          document
            .getElementById("endereco")
            .value
            .trim();


        const numero =
          document
            .getElementById("numero")
            .value
            .trim();


        const complemento =
          document
            .getElementById("complemento")
            .value
            .trim();


        const pais =
          document
            .getElementById("pais")
            .value
            .trim() ||
          "Brasil";


        const corCabelo =
          document
            .getElementById("corCabelo")
            .value
            .trim();


        const corOlhos =
          document
            .getElementById("corOlhos")
            .value
            .trim();


        const idiomas =
          document
            .getElementById("idiomas")
            .value
            .trim();


        const descricao =
          document
            .getElementById("descricao")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const senha =
          document
            .getElementById("senha")
            .value;


        const confirmarSenha =
          document
            .getElementById("confirmarSenha")
            .value;


        const maioridade =
          document
            .getElementById("maioridade")
            .checked;


        mensagem.textContent =
          "";

        mensagem.className =
          "login-message";


        /* =================================================
           VALIDAÇÕES
           ================================================= */


        if (!nome) {

          mensagem.textContent =
            "Digite seu nome completo.";

          return;

        }


        if (!cpf) {

          mensagem.textContent =
            "Digite seu CPF.";

          return;

        }


        const cpfNumeros =
          cpf.replace(/\D/g, "");


        if (cpfNumeros.length !== 11) {

          mensagem.textContent =
            "Digite um CPF válido.";

          return;

        }


        if (!dataNascimento) {

          mensagem.textContent =
            "Informe sua data de nascimento.";

          return;

        }


        if (!idade || idade < 18) {

          mensagem.textContent =
            "O cadastro de modelo é permitido somente para maiores de 18 anos.";

          return;

        }


        if (!whatsapp) {

          mensagem.textContent =
            "Digite seu WhatsApp.";

          return;

        }


        if (!categoriaCatalogo) {

          mensagem.textContent =
            "Selecione como deseja aparecer no catálogo.";

          return;

        }


        if (!cep) {

          mensagem.textContent =
            "Digite seu CEP.";

          return;

        }


        if (!estado) {

          mensagem.textContent =
            "Informe seu estado.";

          return;

        }


        if (!cidade) {

          mensagem.textContent =
            "Digite sua cidade.";

          return;

        }


        if (!bairro) {

          mensagem.textContent =
            "Digite seu bairro.";

          return;

        }


        if (!endereco) {

          mensagem.textContent =
            "Digite sua rua ou logradouro.";

          return;

        }


        if (!numero) {

          mensagem.textContent =
            "Informe o número do endereço.";

          return;

        }


        if (!email) {

          mensagem.textContent =
            "Digite seu e-mail.";

          return;

        }


        if (senha.length < 6) {

          mensagem.textContent =
            "A senha precisa ter pelo menos 6 caracteres.";

          return;

        }


        if (senha !== confirmarSenha) {

          mensagem.textContent =
            "As senhas não são iguais.";

          return;

        }


        if (!maioridade) {

          mensagem.textContent =
            "É necessário confirmar que você é maior de 18 anos.";

          return;

        }


        /* =================================================
           ENVIO
           ================================================= */

        botao.disabled =
          true;


        botao.textContent =
          "Enviando cadastro...";


        try {

          if (
            typeof window.cadastrar !==
            "function"
          ) {

            throw new Error(
              "A função de cadastro não foi carregada. Verifique o auth.js."
            );

          }


          const resultado =
            await window.cadastrar(
              "modelo",
              nome,
              email,
              senha,
              {

                maioridade_confirmada:
                  true,

                categoria_catalogo:
                  categoriaCatalogo,

                apelido:
                  apelido,

                cpf:
                  cpf,

                data_nascimento:
                  dataNascimento,

                whatsapp:
                  whatsapp,

                idade:
                  idade,

                altura_cm:
                  altura,

                cep:
                  cep,

                estado:
                  estado,

                cidade:
                  cidade,

                bairro:
                  bairro,

                endereco:
                  endereco,

                numero:
                  numero,

                complemento:
                  complemento,

                pais:
                  pais,

                cor_cabelo:
                  corCabelo,

                cor_olhos:
                  corOlhos,

                idiomas:
                  idiomas,

                descricao:
                  descricao

              }
            );


          if (
            !resultado ||
            !resultado.success
          ) {

            throw new Error(
              resultado?.error ||
              "Não foi possível realizar o cadastro."
            );

          }


          mensagem.className =
            "login-message success";


          mensagem.innerHTML =
            "Cadastro enviado com sucesso!<br><br>" +
            "Seu cadastro ficará pendente de análise pela administração da LUX.";


          botao.textContent =
            "Cadastro enviado";


          setTimeout(
            function() {

              window.location.href =
                "login.html";

            },
            5000
          );


        } catch (erro) {

          console.error(
            erro
          );


          mensagem.className =
            "login-message error";


          mensagem.textContent =
            erro.message ||
            "Erro ao realizar cadastro.";


          botao.disabled =
            false;


          botao.textContent =
            "Solicitar cadastro";

        }

      }
    );

  </script>

</body>
</html>
