<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Modelo — LUX</title>

  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="login.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-brand">
        <div class="login-logo">LUX</div>
        <div class="login-subtitle">
          Sensualidade & Sofisticação
        </div>
      </div>

      <h1>Cadastro de Modelo</h1>

      <p class="login-description">
        Crie sua conta para solicitar seu cadastro na plataforma LUX.
      </p>

      <form id="cadastroModeloForm">

        <label for="nome">Nome</label>

        <input
          type="text"
          id="nome"
          placeholder="Digite seu nome"
          autocomplete="name"
          required
        >

        <label for="email">E-mail</label>

        <input
          type="email"
          id="email"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        >

        <label for="senha">Senha</label>

        <input
          type="password"
          id="senha"
          placeholder="Mínimo de 6 caracteres"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <label for="confirmarSenha">Confirmar senha</label>

        <input
          type="password"
          id="confirmarSenha"
          placeholder="Digite a senha novamente"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <label class="checkbox-row">

          <input
            type="checkbox"
            id="maioridade"
            required
          >

          <span>
            Confirmo que sou maior de 18 anos.
          </span>

        </label>

        <button
          type="submit"
          class="btn-primary"
          id="btnCadastrarModelo"
        >
          Solicitar cadastro
        </button>

      </form>

      <div id="mensagem" class="login-message"></div>

      <div class="login-links">

        <a href="login.html">
          Já tenho uma conta
        </a>

        <a href="cadastro-usuario.html">
          Cadastro de usuário
        </a>

      </div>

    </section>

  </main>

  <script>

    const formulario = document.getElementById("cadastroModeloForm");
    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("btnCadastrarModelo");

    formulario.addEventListener("submit", async function(event) {

      event.preventDefault();

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const confirmarSenha =
        document.getElementById("confirmarSenha").value;

      const maioridade =
        document.getElementById("maioridade").checked;

      mensagem.textContent = "";
      mensagem.className = "login-message";

      if (!nome) {
        mensagem.textContent = "Digite seu nome.";
        return;
      }

      if (senha.length < 6) {
        mensagem.textContent =
          "A senha precisa ter pelo menos 6 caracteres.";
        return;
      }

      if (senha !== confirmarSenha) {
        mensagem.textContent =
          "As senhas não são iguais.";
        return;
      }

      if (!maioridade) {
        mensagem.textContent =
          "É necessário confirmar que você é maior de 18 anos.";
        return;
      }

      botao.disabled = true;
      botao.textContent = "Enviando cadastro...";

      try {

        if (typeof window.cadastrar !== "function") {
          throw new Error(
            "A função de cadastro não foi carregada. Verifique o auth.js."
          );
        }

        const resultado = await window.cadastrar(
          "modelo",
          nome,
          email,
          senha,
          {
            maioridade_confirmada: true
          }
        );

        if (!resultado.success) {
          throw new Error(
            resultado.error || "Não foi possível realizar o cadastro."
          );
        }

        mensagem.className = "login-message success";

        mensagem.innerHTML =
          "Cadastro enviado com sucesso!<br><br>" +
          "Seu cadastro ficará pendente de análise pela administração da LUX.";

        botao.textContent = "Cadastro enviado";

        setTimeout(function() {
          window.location.href = "login.html";
        }, 5000);

      } catch (erro) {

        console.error(erro);

        mensagem.className = "login-message error";
        mensagem.textContent =
          erro.message || "Erro ao realizar cadastro.";

        botao.disabled = false;
        botao.textContent = "Solicitar cadastro";
      }

    });

  </script>

</body>
</html>
