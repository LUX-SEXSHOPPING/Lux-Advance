<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUX — Cadastro de Modelo</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/login.css"></head><body><main class="login-wrap"><a class="voltar" href="login.html">← Voltar</a><section class="login-card" style="max-width:760px"><div class="marca">LUX</div><p class="sub">Cadastro completo de modelo</p><div class="notice">O cadastro é enviado para análise. O perfil só aparece publicamente depois da aprovação da administração. Você precisa ter 18 anos ou mais.</div><div id="mensagem" class="mensagem" hidden></div><form id="cadastro"><div class="form-grid"><div class="field"><label>Nome de exibição *</label><input id="nome" required maxlength="80"></div><div class="field"><label>E-mail de acesso *</label><input id="email" type="email" required></div><div class="field"><label>Senha *</label><input id="senha" type="password" minlength="8" required></div><div class="field"><label>Idade *</label><input id="idade" type="number" min="18" max="99" required></div><div class="field"><label>Cidade</label><input id="cidade" maxlength="80"></div><div class="field"><label>País</label><input id="pais" value="Brasil" maxlength="60"></div><div class="field"><label>Cor do cabelo</label><select id="cabelo"><option value="">Selecione</option><option>Preto</option><option>Castanho</option><option>Loiro</option><option>Ruivo</option><option>Colorido</option><option>Outro</option></select></div><div class="field"><label>Cor dos olhos</label><select id="olhos"><option value="">Selecione</option><option>Castanhos</option><option>Pretos</option><option>Azuis</option><option>Verdes</option><option>Mel</option><option>Cinza</option><option>Outro</option></select></div><div class="field"><label>Altura (cm)</label><input id="altura" type="number" min="100" max="230"></div><div class="field"><label>Idiomas</label><input id="idiomas" placeholder="Português, Inglês..."></div><div class="field full"><label>Descrição / apresentação</label><textarea id="descricao" maxlength="800" placeholder="Escreva uma apresentação profissional."></textarea></div><div class="field full"><label>URL da foto de perfil (opcional)</label><input id="foto" type="url" placeholder="https://..."></div><div class="field full"><label><input id="aceite18" type="checkbox" required> Confirmo que tenho 18 anos ou mais e que as informações fornecidas são verdadeiras.</label></div></div><button class="btn primary" type="submit">Enviar cadastro para análise</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script>document.getElementById('cadastro').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('mensagem');m.hidden=false;m.className='mensagem';m.textContent='Criando conta e enviando os dados para análise...';try{const db=requireClient();const {data,error}=await db.auth.signUp({email:email.value.trim(),password:senha.value,options:{data:{tipo:'modelo',nome:nome.value.trim(),idade:Number(idade.value),cidade:cidade.value.trim(),pais:pais.value.trim()||'Brasil',cor_cabelo:cabelo.value,cor_olhos:olhos.value,altura_cm:altura.value?Number(altura.value):null,idiomas:idiomas.value.trim(),descricao:descricao.value.trim(),foto_url:foto.value.trim(),maioridade_confirmada:aceite18.checked}}});if(error)throw new Error(friendlyAuthError(error));m.className='mensagem success';m.textContent=data.session?'Cadastro criado. Seu perfil está pendente de análise.':'Cadastro criado. Confirme seu e-mail e depois entre para acompanhar seu perfil. A administração fará a verificação antes da publicação.';e.target.reset();}catch(err){m.className='mensagem error';m.textContent=err.message||'Erro no cadastro.';}});</script></body></html>
