<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Modelo — LUX</title>

  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="login.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-brand">
        <div class="login-logo">LUX</div>
        <div class="login-subtitle">
          Sensualidade & Sofisticação
        </div>
      </div>

      <h1>Cadastro de Modelo</h1>

      <p class="login-description">
        Crie sua conta para solicitar seu cadastro na plataforma LUX.
      </p>

      <form id="cadastroModeloForm">

        <label for="nome">Nome</label>

        <input
          type="text"
          id="nome"
          placeholder="Digite seu nome"
          autocomplete="name"
          required
        >

        <label for="apelido">Apelido / Nome artístico</label>

        <input
          type="text"
          id="apelido"
          placeholder="Digite seu nome artístico"
          autocomplete="nickname"
        >

        <label for="whatsapp">WhatsApp</label>

        <input
          type="tel"
          id="whatsapp"
          placeholder="(00) 00000-0000"
          autocomplete="tel"
          required
        >

        <label for="idade">Idade</label>

        <input
          type="number"
          id="idade"
          placeholder="Digite sua idade"
          min="18"
          max="100"
          required
        >

        <label for="altura">Altura</label>

        <input
          type="number"
          id="altura"
          placeholder="Altura em centímetros"
          min="100"
          max="250"
        >

        <label for="cidade">Cidade</label>

        <input
          type="text"
          id="cidade"
          placeholder="Digite sua cidade"
          autocomplete="address-level2"
          required
        >

        <label for="estado">Estado</label>

        <input
          type="text"
          id="estado"
          placeholder="Digite seu estado"
          autocomplete="address-level1"
        >

        <label for="pais">País</label>

        <input
          type="text"
          id="pais"
          value="Brasil"
          autocomplete="country-name"
        >

        <label for="endereco">Endereço</label>

        <input
          type="text"
          id="endereco"
          placeholder="Digite seu endereço"
          autocomplete="street-address"
        >

        <label for="corCabelo">Cor do cabelo</label>

        <input
          type="text"
          id="corCabelo"
          placeholder="Ex.: Castanho"
        >

        <label for="corOlhos">Cor dos olhos</label>

        <input
          type="text"
          id="corOlhos"
          placeholder="Ex.: Castanhos"
        >

        <label for="idiomas">Idiomas</label>

        <input
          type="text"
          id="idiomas"
          placeholder="Ex.: Português, Espanhol"
        >

        <label for="descricao">Descrição</label>

        <textarea
          id="descricao"
          placeholder="Escreva uma breve descrição sobre você"
          rows="5"
        ></textarea>

        <label for="email">E-mail</label>

        <input
          type="email"
          id="email"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        >

        <label for="senha">Senha</label>

        <input
          type="password"
          id="senha"
          placeholder="Mínimo de 6 caracteres"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <label for="confirmarSenha">Confirmar senha</label>

        <input
          type="password"
          id="confirmarSenha"
          placeholder="Digite a senha novamente"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <label class="checkbox-row">

          <input
            type="checkbox"
            id="maioridade"
            required
          >

          <span>
            Confirmo que sou maior de 18 anos.
          </span>

        </label>

        <button
          type="submit"
          class="btn-primary"
          id="btnCadastrarModelo"
        >
          Solicitar cadastro
        </button>

      </form>

      <div id="mensagem" class="login-message"></div>

      <div class="login-links">

        <a href="login.html">
          Já tenho uma conta
        </a>

        <a href="cadastro-usuario.html">
          Cadastro de usuário
        </a>

      </div>

    </section>

  </main>

  <script>

    const formulario =
      document.getElementById("cadastroModeloForm");

    const mensagem =
      document.getElementById("mensagem");

    const botao =
      document.getElementById("btnCadastrarModelo");


    formulario.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const nome =
          document.getElementById("nome").value.trim();

        const apelido =
          document.getElementById("apelido").value.trim();

        const whatsapp =
          document.getElementById("whatsapp").value.trim();

        const idade =
          Number(
            document.getElementById("idade").value
          );

        const altura =
          Number(
            document.getElementById("altura").value
          ) || null;

        const cidade =
          document.getElementById("cidade").value.trim();

        const estado =
          document.getElementById("estado").value.trim();

        const pais =
          document.getElementById("pais").value.trim() ||
          "Brasil";

        const endereco =
          document.getElementById("endereco").value.trim();

        const corCabelo =
          document.getElementById("corCabelo").value.trim();

        const corOlhos =
          document.getElementById("corOlhos").value.trim();

        const idiomas =
          document.getElementById("idiomas").value.trim();

        const descricao =
          document.getElementById("descricao").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const senha =
          document.getElementById("senha").value;

        const confirmarSenha =
          document.getElementById("confirmarSenha").value;

        const maioridade =
          document.getElementById("maioridade").checked;


        mensagem.textContent = "";
        mensagem.className = "login-message";


        if (!nome) {

          mensagem.textContent =
            "Digite seu nome.";

          return;
        }


        if (!whatsapp) {

          mensagem.textContent =
            "Digite seu WhatsApp.";

          return;
        }


        if (!idade || idade < 18) {

          mensagem.textContent =
            "O cadastro de modelo é permitido somente para maiores de 18 anos.";

          return;
        }


        if (!cidade) {

          mensagem.textContent =
            "Digite sua cidade.";

          return;
        }


        if (!email) {

          mensagem.textContent =
            "Digite seu e-mail.";

          return;
        }


        if (senha.length < 6) {

          mensagem.textContent =
            "A senha precisa ter pelo menos 6 caracteres.";

          return;
        }


        if (senha !== confirmarSenha) {

          mensagem.textContent =
            "As senhas não são iguais.";

          return;
        }


        if (!maioridade) {

          mensagem.textContent =
            "É necessário confirmar que você é maior de 18 anos.";

          return;
        }


        botao.disabled = true;
        botao.textContent =
          "Enviando cadastro...";


        try {

          if (
            typeof window.cadastrar !== "function"
          ) {

            throw new Error(
              "A função de cadastro não foi carregada. Verifique o auth.js."
            );

          }


          const resultado =
            await window.cadastrar(
              "modelo",
              nome,
              email,
              senha,
              {

                maioridade_confirmada:
                  true,

                apelido:
                  apelido,

                whatsapp:
                  whatsapp,

                idade:
                  idade,

                altura_cm:
                  altura,

                cidade:
                  cidade,

                estado:
                  estado,

                pais:
                  pais,

                endereco:
                  endereco,

                cor_cabelo:
                  corCabelo,

                cor_olhos:
                  corOlhos,

                idiomas:
                  idiomas,

                descricao:
                  descricao

              }
            );


          if (
            !resultado ||
            !resultado.success
          ) {

            throw new Error(
              resultado?.error ||
              "Não foi possível realizar o cadastro."
            );

          }


          mensagem.className =
            "login-message success";


          mensagem.innerHTML =
            "Cadastro enviado com sucesso!<br><br>" +
            "Seu cadastro ficará pendente de análise pela administração da LUX.";


          botao.textContent =
            "Cadastro enviado";


          setTimeout(
            function() {

              window.location.href =
                "login.html";

            },
            5000
          );


        } catch (erro) {

          console.error(
            erro
          );


          mensagem.className =
            "login-message error";


          mensagem.textContent =
            erro.message ||
            "Erro ao realizar cadastro.";


          botao.disabled =
            false;


          botao.textContent =
            "Solicitar cadastro";

        }

      }
    );

  </script>

</body>
</html>
