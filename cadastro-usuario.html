<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>LUX — Criar conta</title>

  <link
    rel="stylesheet"
    href="app.css"
  >

  <link
    rel="stylesheet"
    href="login.css"
  >

</head>


<body>

  <main class="login-wrap">

    <a
      class="voltar"
      href="login.html"
    >
      ← Voltar ao login
    </a>


    <section class="login-card">

      <div class="marca">
        LUX
      </div>


      <p class="sub">
        Criar conta de usuário
      </p>


      <p
        style="
          color:#b9afb4;
          line-height:1.6;
          text-align:center;
        "
      >
        Crie sua conta para acessar
        sua área exclusiva na LUX.
      </p>


      <div
        id="mensagem"
        class="mensagem"
        hidden
      ></div>


      <form id="cadastroForm">

        <label for="nome">
          Nome
        </label>


        <input
          id="nome"
          type="text"
          autocomplete="name"
          required
          placeholder="Seu nome"
        >


        <label for="email">
          E-mail
        </label>


        <input
          id="email"
          type="email"
          autocomplete="email"
          required
          placeholder="seu@email.com"
        >


        <label for="senha">
          Senha
        </label>


        <input
          id="senha"
          type="password"
          autocomplete="new-password"
          minlength="6"
          required
          placeholder="Mínimo de 6 caracteres"
        >


        <label for="confirmarSenha">
          Confirmar senha
        </label>


        <input
          id="confirmarSenha"
          type="password"
          autocomplete="new-password"
          minlength="6"
          required
          placeholder="Digite a senha novamente"
        >


        <button
          class="btn primary"
          type="submit"
          id="btnCadastrar"
        >
          Criar minha conta
        </button>

      </form>


      <p class="senha-link">

        Já possui uma conta?

        <a href="login.html">
          Entrar
        </a>

      </p>


      <div class="separador">
        <span>MODELO</span>
      </div>


      <div class="cadastros">

        <a href="cadastro-modelo.html">
          Quero me cadastrar como modelo
        </a>

      </div>

    </section>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- CONFIGURAÇÃO -->

  <script src="config.js"></script>


  <!-- AUTENTICAÇÃO -->

  <script src="auth.js"></script>


  <script>

    document
      .getElementById("cadastroForm")
      .addEventListener(
        "submit",
        async function(e) {

          e.preventDefault();


          const mensagem =
            document.getElementById(
              "mensagem"
            );

          const botao =
            document.getElementById(
              "btnCadastrar"
            );


          const nome =
            document
              .getElementById("nome")
              .value
              .trim();


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          const senha =
            document
              .getElementById("senha")
              .value;


          const confirmarSenha =
            document
              .getElementById("confirmarSenha")
              .value;


          mensagem.hidden = false;

          mensagem.className =
            "mensagem";


          if (nome.length < 2) {

            mensagem.className =
              "mensagem error";

            mensagem.textContent =
              "Informe seu nome.";

            return;

          }


          if (senha.length < 6) {

            mensagem.className =
              "mensagem error";

            mensagem.textContent =
              "A senha deve ter pelo menos 6 caracteres.";

            return;

          }


          if (
            senha !== confirmarSenha
          ) {

            mensagem.className =
              "mensagem error";

            mensagem.textContent =
              "As senhas não coincidem.";

            return;

          }


          botao.disabled = true;

          mensagem.textContent =
            "Criando sua conta...";


          try {

            await cadastrar(
              "usuario",
              nome,
              email,
              senha
            );


            mensagem.className =
              "mensagem success";


            mensagem.textContent =
              "Conta criada com sucesso! Verifique seu e-mail para confirmar o cadastro.";


            document
              .getElementById("nome")
              .disabled = true;

            document
              .getElementById("email")
              .disabled = true;

            document
              .getElementById("senha")
              .disabled = true;

            document
              .getElementById("confirmarSenha")
              .disabled = true;


            setTimeout(
              function() {

                window.location.href =
                  "login.html";

              },
              3000
            );


          } catch (erro) {

            mensagem.className =
              "mensagem error";

            mensagem.textContent =
              erro.message;

            botao.disabled = false;

          }

        }
      );

  </script>

</body>

</html>
