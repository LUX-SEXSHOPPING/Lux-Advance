<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUX — Cadastro de Usuário</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/login.css"></head><body><main class="login-wrap"><a class="voltar" href="login.html">← Voltar</a><section class="login-card"><div class="marca">LUX</div><p class="sub">Criar conta de usuário</p><div id="mensagem" class="mensagem" hidden></div><form id="cadastro"><label>Nome</label><input id="nome" required maxlength="80"><label>E-mail</label><input id="email" type="email" required><label>Senha</label><input id="senha" type="password" minlength="8" required><button class="btn primary" type="submit">Criar conta</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script>document.getElementById('cadastro').addEventListener('submit',async e=>{e.preventDefault();mensagem.hidden=false;mensagem.textContent='Criando conta...';try{await cadastrar('usuario',nome.value.trim(),email.value.trim(),senha.value);mensagem.className='mensagem success';mensagem.textContent='Conta criada. Confirme seu e-mail e depois entre.';e.target.reset();}catch(err){mensagem.className='mensagem error';mensagem.textContent=err.message;}});</script></body></html>
