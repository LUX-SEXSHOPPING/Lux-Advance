  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #fff;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(255,77,166,.16),
          transparent 40%
        ),
        radial-gradient(
          circle at 0% 100%,
          rgba(248,213,138,.08),
          transparent 35%
        ),
        #080406;
    }


    /* =========================
       TOPO
    ========================= */

    .topbar {

      width: 100%;

      padding: 18px;

      display: flex;

      justify-content: flex-end;

      align-items: center;
    }


    .voltar {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding: 10px 17px;

      border-radius: 30px;

      text-decoration: none;

      color: #f8d58a;

      border:
        1px solid
        rgba(248,213,138,.38);

      background:
        rgba(255,255,255,.025);

      transition: .3s;
    }


    .voltar:hover {

      background: #f8d58a;

      color: #10070a;

      transform:
        translateY(-2px);
    }

       CONTAINER
    ========================= */

      width: min(720px, 92%);

      margin:
        10px auto 60px;
    }
