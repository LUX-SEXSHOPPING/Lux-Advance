<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c9a227">
<meta name="description" content="LUX Advance — Mais que um site, uma experiência.">
<title>LUX Advance — Mais que um site, uma experiência</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

:root{
  --dourado:#c9a227;
  --dourado-claro:#f0d878;
  --champanhe:#f5e6c8;
  --texto-claro:#efe7dd;
  --texto-suave:#cbbfaf;
  --ouro-brilhante:#ffd700;
  --borda-dourada:rgba(201,162,39,.28);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',system-ui,sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  color:var(--texto-claro);
  min-height:100vh;

  background:
    #000 url('lux-halloween.jpg')
    center top / cover no-repeat fixed;
}

body::before{
  content:'';
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.42);

  z-index:0;
  pointer-events:none;
}

.conteudo{
  position:relative;
  z-index:1;

  max-width:1120px;
  margin:0 auto;

  padding:0 22px;
}

/* ==============================
   CABEÇALHO
================================ */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:24px 0;

  position:relative;
  z-index:10;
}

/* LOGO */

.logo-header{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo-img{
  width:80px;
  height:80px;

  object-fit:contain;

  filter:
    brightness(1.3)
    saturate(1.4)
    drop-shadow(
      0 0 12px
      rgba(201,162,39,.5)
    );

  transition:all .3s;
}

.logo-img:hover{
  filter:
    brightness(1.5)
    saturate(1.6)
    drop-shadow(
      0 0 20px
      rgba(201,162,39,.8)
    );

  transform:scale(1.08);
}

.logo-lux{
  font-size:40px;
  font-weight:800;
  font-style:italic;

  letter-spacing:6px;

  color:var(--champanhe);

  text-shadow:
    0 0 24px
    rgba(201,162,39,.4);

  position:relative;
}

.logo-lux::after{
  content:'';

  position:absolute;

  left:2px;
  right:14px;
  bottom:-7px;

  height:1px;

  background:
    linear-gradient(
      90deg,
      var(--dourado),
      transparent
    );
}

/* ==============================
   BOTÃO ENTRAR
================================ */

.btn-entrar{
  display:inline-flex;

  align-items:center;
  justify-content:center;
  gap:9px;

  min-width:125px;

  padding:13px 22px;

  border-radius:12px;

  text-decoration:none;

  color:#17120a;

  font-size:15px;
  font-weight:800;

  letter-spacing:.5px;

  background:
    linear-gradient(
      135deg,
      #f0d878,
      #c9a227 60%,
      #8a6d14
    );

  border:1px solid #f0d878;

  box-shadow:
    0 7px 24px
    rgba(201,162,39,.35);

  transition:all .3s ease;
}

.btn-entrar:hover{
  transform:translateY(-2px);

  box-shadow:
    0 11px 30px
    rgba(201,162,39,.55);

  filter:brightness(1.08);
}

.btn-entrar i{
  font-size:16px;
}

/* ==============================
   HERO
================================ */

.hero{
  text-align:center;

  padding:
    100px 10px
    120px;

  position:relative;
  z-index:2;
}

.hero h1{
  font-size:min(72px,13vw);

  font-style:italic;
  font-weight:800;

  line-height:.95;

  letter-spacing:6px;

  padding-left:10px;

  background:
    linear-gradient(
      180deg,
      #fdf3d0 0%,
      var(--dourado-claro) 45%,
      var(--dourado) 78%,
      #8a6d14 100%
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  filter:
    drop-shadow(
      0 0 26px
      rgba(201,162,39,.3)
    );
}

.hero .slogan{
  font-size:
    clamp(
      17px,
      2.6vw,
      24px
    );

  color:var(--champanhe);

  margin-top:18px;

  letter-spacing:2px;

  text-shadow:
    0 2px 12px
    rgba(0,0,0,.8);
}

.hero .descricao{
  max-width:620px;

  margin:24px auto 0;

  color:var(--texto-suave);

  font-size:15px;

  line-height:1.8;

  text-shadow:
    0 1px 6px
    rgba(0,0,0,.6);
}

/* ==============================
   RESPONSIVO
================================ */

@media(max-width:768px){

  header{
    padding:18px 0;
  }

  .logo-img{
    width:60px;
    height:60px;
  }

  .logo-lux{
    font-size:27px;
    letter-spacing:3px;
  }

  .btn-entrar{
    min-width:100px;
    padding:11px 15px;
    font-size:14px;
  }

  .hero{
    padding:
      90px 8px
      100px;
  }

  .hero h1{
    font-size:
      min(58px,13vw);

    letter-spacing:3px;
  }

  .hero .slogan{
    font-size:16px;
    letter-spacing:1px;
  }

}

@media(max-width:480px){

  .logo-header{
    gap:8px;
  }

  .logo-img{
    width:52px;
    height:52px;
  }

  .logo-lux{
    font-size:22px;
    letter-spacing:2px;
  }

  .btn-entrar{
    min-width:90px;
    padding:10px 12px;
    font-size:13px;
  }

}

</style>

</head>

<body>

<div class="conteudo">

<header>

  <!-- LOGO LUX -->
  <div class="logo-header">

    <img
      src="logo3.png"
      alt="LUX Advance"
      class="logo-img"
    >

    <div class="logo-lux">
      LUX Advance
    </div>

  </div>

  <!-- ÚNICO BOTÃO DO CABEÇALHO -->
  <a
    href="login.html"
    class="btn-entrar"
  >
    <i class="fas fa-lock"></i>
    Entrar
  </a>

</header>


<!-- ==============================
     PÁGINA INICIAL
================================ -->

<section class="hero">

  <h1>
    LUX Advance
  </h1>

  <p class="slogan">
    MAIS QUE UM SITE, UMA EXPERIÊNCIA
  </p>

  <p class="descricao">
    Conectamos momentos especiais
    com pessoas extraordinárias.
  </p>

</section>

</div>

</body>

</html>
