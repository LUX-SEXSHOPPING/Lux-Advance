<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUX — Entrar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700;1,800&display=swap" as="style">
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style">
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700;1,800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --dourado: #c9a227;
      --dourado-claro: #f0d878;
      --champanhe: #f5e6c8;
      --texto-claro: #efe7dd;
      --texto-suave: #cbbfaf;
      --vinho: #6e0f2e;
      --fundo: #0c0809;
      --painel: rgba(255, 255, 255, .045);
      --borda-dourada: rgba(201, 162, 39, .28);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      color: var(--texto-claro);
      min-height: 100vh;
      background: 
        radial-gradient(900px 520px at 82% -12%, rgba(110, 15, 46, .38), transparent 60%),
        radial-gradient(760px 420px at 8% 112%, rgba(201, 162, 39, .14), transparent 62%),
        var(--fundo);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 42%, rgba(201, 162, 39, .05) 48%, transparent 54%),
        linear-gradient(-115deg, transparent 62%, rgba(110, 15, 46, .09) 70%, transparent 78%);
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: url('logo3.png') center/contain no-repeat;
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
      filter: brightness(1.2) saturate(1.3);
    }

    .serif {
      font-family: 'Playfair Display', serif;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: linear-gradient(135deg, rgba(12, 8, 9, .95), rgba(20, 15, 18, .95));
      border: 1px solid var(--borda-dourada);
      border-radius: 20px;
      padding: 50px 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(201, 162, 39, .15);
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .login-logo img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      filter: brightness(1.3) saturate(1.4) drop-shadow(0 0 12px rgba(201, 162, 39, .5));
    }

    .login-title {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 4px;
      color: var(--champanhe);
      text-shadow: 0 0 24px rgba(201, 162, 39, .4);
    }

    .login-subtitle {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      font-style: italic;
      color: var(--dourado-claro);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--dourado-claro);
      margin-bottom: 8px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--borda-dourada);
      color: var(--texto-claro);
      font-size: 14px;
      transition: all .3s;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      background: rgba(255, 255, 255, .1);
      border-color: rgba(201, 162, 39, .6);
      box-shadow: 0 0 12px rgba(201, 162, 39, .2);
    }

    input::placeholder {
      color: var(--texto-suave);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .btn {
      flex: 1;
      min-width: 100px;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all .3s;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .btn-login {
      background: linear-gradient(135deg, #f0d878, #c9a227 60%, #8a6d14);
      color: #1a1206;
      box-shadow: 0 8px 24px rgba(201, 162, 39, .3);
      font-weight: 700;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(201, 162, 39, .45);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(201, 162, 39, .08);
      color: var(--dourado-claro);
      border: 1px solid var(--borda-dourada);
      flex: 1;
    }

    .btn-secondary:hover {
      background: rgba(201, 162, 39, .14);
      transform: translateY(-2px);
      box-shadow: 0 0 12px rgba(201, 162, 39, .2);
    }

    .divider {
      text-align: center;
      margin: 24px 0;
      font-size: 12px;
      color: var(--texto-suave);
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 45%;
      height: 1px;
      background: var(--borda-dourada);
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .login-footer {
      text-align: center;
      font-size: 13px;
      color: var(--texto-suave);
    }

    .login-footer a {
      color: var(--dourado-claro);
      text-decoration: none;
      font-weight: 600;
      transition: all .3s;
    }

    .login-footer a:hover {
      color: var(--dourado);
      text-shadow: 0 0 8px rgba(201, 162, 39, .5);
    }

    .error-message {
      display: none;
      background: rgba(200, 70, 70, .15);
      border: 1px solid rgba(200, 70, 70, .4);
      color: #ff8a8a;
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 13px;
      text-align: center;
    }

    .error-message.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: var(--dourado-claro);
      font-size: 12px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(201, 162, 39, .3);
      border-top-color: var(--dourado-claro);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 40px 20px;
      }

      .login-title {
        font-size: 28px;
      }

      .btn {
        min-width: 80px;
        padding: 11px 16px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <img src="logo3.png" alt="LUX Logo">
        </div>
        <h1 class="login-title">LUX</h1>
        <p class="login-subtitle">Sensualidade & Sofisticação</p>
      </div>

      <div id="errorMessage" class="error-message"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> E-mail</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="seu@email.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="senha"><i class="fas fa-lock"></i> Senha</label>
          <input 
            type="password" 
            id="senha" 
            name="senha" 
            placeholder="Sua senha segura" 
            required 
            autocomplete="current-password"
          >
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-login">
            <i class="fas fa-sign-in-alt"></i> Entrar
          </button>
        </div>

        <div class="loading" id="loading">
          <span class="spinner"></span> Entrando...
        </div>
      </form>

      <div class="divider">OU</div>

      <div class="form-actions">
        <a href="pre-cadastro.html" class="btn btn-secondary">
          <i class="fas fa-user-plus"></i> Cadastro
        </a>
      </div>

      <div class="login-footer">
        <p>
          Não tem conta? 
          <a href="pre-cadastro.html">Crie uma agora</a>
        </p>
        <p style="margin-top: 12px; font-size: 11px;">
          <a href="index.html" style="color: var(--texto-suave);">← Voltar ao início</a>
        </p>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const senhaInput = document.getElementById('senha');
    const errorMessage = document.getElementById('errorMessage');
    const loading = document.getElementById('loading');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      const senha = senhaInput.value.trim();

      if (!email || !senha) {
        mostrarErro('Por favor, preencha todos os campos.');
        return;
      }

      errorMessage.textContent = '';
      errorMessage.classList.remove('show');
      loading.style.display = 'block';
      loginForm.style.opacity = '0.6';
      loginForm.style.pointerEvents = 'none';

      try {
        const usuario = await login(email, senha);
        
        // Aguarda um pouco para feedback visual
        await new Promise(r => setTimeout(r, 500));

        // Redireciona com base no tipo
        const tipo = await getTipoUsuario(usuario.id);
        if (tipo === 'modelo') {
          location.href = 'painel.html';
        } else {
          location.href = 'painel.html';
        }
      } catch (erro) {
        mostrarErro(erro.message);
        loading.style.display = 'none';
        loginForm.style.opacity = '1';
        loginForm.style.pointerEvents = 'auto';
        senhaInput.value = '';
      }
    });

    function mostrarErro(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('show');
      loading.style.display = 'none';
      loginForm.style.opacity = '1';
      loginForm.style.pointerEvents = 'auto';
    }

    // Limpar erro ao editar
    emailInput.addEventListener('input', () => {
      if (errorMessage.classList.contains('show')) {
        errorMessage.classList.remove('show');
      }
    });

    senhaInput.addEventListener('input', () => {
      if (errorMessage.classList.contains('show')) {
        errorMessage.classList.remove('show');
      }
    });
  </script>
</body>
</html>
