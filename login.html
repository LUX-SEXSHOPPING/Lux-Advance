<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>LUX — Login</title>

    <link rel="stylesheet" href="app.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">
                <h1>LUX</h1>
                <p>Entre na sua conta</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Sua senha"
                        autocomplete="current-password"
                        required>
                </div>

                <div
                    id="mensagem"
                    style="display:none;">
                </div>

                <button
                    type="submit"
                    id="btnLogin">
                    ENTRAR
                </button>

            </form>

            <div class="auth-links">

                <a href="cadastro.html">
                    Criar conta
                </a>

                <a href="index.html">
                    Voltar para o início
                </a>

            </div>

        </section>

    </main>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CONFIGURAÇÃO -->
    <script src="config.js"></script>

    <!-- AUTENTICAÇÃO -->
    <script src="auth.js"></script>


    <script>

        // ============================================
        // REDIRECIONAMENTO POR PERFIL
        // ============================================

        function redirecionarPorPerfil(perfil) {

            if (!perfil || !perfil.tipo) {
                throw new Error(
                    "Tipo de usuário não encontrado."
                );
            }

            switch (perfil.tipo) {

                case "modelo":
                    window.location.replace(
                        "painel-modelo.html"
                    );
                    break;

                case "usuario":
                    window.location.replace(
                        "painel-usuario.html"
                    );
                    break;

                case "admin":
                    window.location.replace(
                        "painel-adm.html"
                    );
                    break;

                default:
                    throw new Error(
                        "Tipo de usuário inválido."
                    );
            }
        }


        // ============================================
        // VERIFICAR SESSÃO EXISTENTE
        // ============================================

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                try {

                    const {
                        data: { session }
                    } =
                        await supabaseClient.auth.getSession();

                    if (!session?.user) {
                        return;
                    }

                    const perfil =
                        await getPerfil(
                            session.user.id
                        );

                    if (!perfil) {
                        await supabaseClient.auth.signOut();
                        return;
                    }

                    redirecionarPorPerfil(perfil);

                } catch (error) {

                    console.error(
                        "Erro ao verificar sessão:",
                        error
                    );

                }
            }
        );


        // ============================================
        // LOGIN
        // ============================================

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();

                    const senha =
                        document
                            .getElementById("senha")
                            .value;

                    const btn =
                        document
                            .getElementById("btnLogin");

                    const mensagem =
                        document
                            .getElementById("mensagem");


                    btn.disabled = true;

                    btn.textContent =
                        "ENTRANDO...";

                    mensagem.style.display =
                        "none";

                    try {

                        const resultado =
                            await login(
                                email,
                                senha
                            );

                        if (!resultado.success) {
                            throw new Error(
                                resultado.error ||
                                "Não foi possível fazer login."
                            );
                        }

                        const perfil =
                            resultado.perfil;

                        if (!perfil) {
                            throw new Error(
                                "Perfil não encontrado."
                            );
                        }

                        // Um único redirecionamento
                        redirecionarPorPerfil(
                            perfil
                        );

                    } catch (error) {

                        console.error(
                            "Erro no login:",
                            error
                        );

                        mensagem.textContent =
                            error?.message ||
                            "E-mail ou senha incorretos.";

                        mensagem.style.display =
                            "block";

                        btn.disabled = false;

                        btn.textContent =
                            "ENTRAR";
                    }
                }
            );

    </script>

</body>

</html>
