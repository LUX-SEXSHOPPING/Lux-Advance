<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#c9a227"
>

<meta
  name="description"
  content="LUX Advance — Mais que um site, uma experiência."
>

<title>LUX Advance — Mais que um site, uma experiência</title>


<link
  rel="manifest"
  href="manifest.json"
>


<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
>


<style>

/* ==================================================
   VARIÁVEIS LUX
================================================== */

:root{

  --ouro:#c9a227;
  --ouro-claro:#f4d875;
  --ouro-brilho:#ffe9a3;

  --champanhe:#f5e6c8;

  --texto:#f1e9df;
  --texto-suave:#c9beb0;

  --preto:#050304;

}


/* ==================================================
   RESET
================================================== */

*{

  margin:0;
  padding:0;

  box-sizing:border-box;

  font-family:
    "Segoe UI",
    system-ui,
    sans-serif;

}


html{

  scroll-behavior:smooth;

}


body{

  min-height:100vh;

  color:var(--texto);

  background:

    #000
    url("lux-halloween.jpg")
    center top / cover
    no-repeat fixed;

  overflow-x:hidden;

}


/* ==================================================
   CAMADA ESCURA
================================================== */

body::before{

  content:"";

  position:fixed;

  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.28),
      rgba(0,0,0,.48)
    );

  z-index:0;

  pointer-events:none;

}


/* ==================================================
   CONTEÚDO
================================================== */

.conteudo{

  position:relative;

  z-index:2;

  width:100%;

  max-width:1200px;

  margin:0 auto;

  padding:
    0 22px;

}


/* ==================================================
   CABEÇALHO
================================================== */

header{

  width:100%;

  min-height:100px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:25px;

  position:relative;

  z-index:10;

  padding:
    20px 0;

}


/* ==================================================
   NOME LUX
================================================== */

.logo-lux{

  color:var(--champanhe);

  font-size:40px;

  font-weight:800;

  font-style:italic;

  letter-spacing:6px;

  text-shadow:

    0 0 10px rgba(201,162,39,.25),

    0 0 28px rgba(201,162,39,.22);

  position:relative;

}


.logo-lux::after{

  content:"";

  position:absolute;

  left:2px;

  bottom:-8px;

  width:115px;

  height:1px;

  background:

    linear-gradient(
      90deg,
      var(--ouro),
      transparent
    );

}


/* ==================================================
   BOTÃO ENTRAR
   PERMANECE NO CANTO SUPERIOR DIREITO
================================================== */

.btn-entrar{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:9px;

  min-width:125px;

  padding:
    13px 22px;

  border-radius:11px;

  text-decoration:none;

  color:#17120a;

  font-size:15px;

  font-weight:800;

  letter-spacing:.5px;

  background:

    linear-gradient(
      135deg,
      #f5df83,
      #c9a227 58%,
      #8b6d15
    );

  border:
    1px solid
    #f7df83;

  box-shadow:

    0 7px 25px
    rgba(201,162,39,.30);

  transition:
    .3s ease;

}


.btn-entrar:hover{

  transform:
    translateY(-2px);

  filter:
    brightness(1.08);

  box-shadow:

    0 10px 30px
    rgba(201,162,39,.48);

}


.btn-entrar i{

  font-size:15px;

}


/* ==================================================
   ÁREA DO MENU
   FICA ABAIXO DO CABEÇALHO
================================================== */

.menu-area{

  width:100%;

  display:flex;

  justify-content:center;

  margin-top:4px;

  margin-bottom:34px;

  padding:
    13px 12px;

  background:

    linear-gradient(
      180deg,
      rgba(4,3,4,.91),
      rgba(7,5,6,.82)
    );

  border-top:
    1px solid
    rgba(201,162,39,.40);

  border-bottom:
    1px solid
    rgba(201,162,39,.35);

  box-shadow:

    0 8px 30px
    rgba(0,0,0,.40),

    inset 0 1px
    rgba(255,255,255,.025);

}


/* ==================================================
   MENU
================================================== */

.menu{

  width:100%;

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  align-items:center;

  gap:10px;

}


/* ==================================================
   CADA CAIXINHA
================================================== */

.menu a{

  position:relative;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:9px;

  min-width:132px;

  height:48px;

  padding:
    0 18px;

  border-radius:25px;

  border:
    1px solid
    rgba(201,162,39,.65);

  background:

    linear-gradient(
      145deg,
      rgba(10,8,9,.97),
      rgba(19,13,14,.92)
    );

  color:
    #eee1c9;

  text-decoration:none;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:16px;

  font-weight:700;

  letter-spacing:.3px;

  box-shadow:

    inset 0 0 0 1px
    rgba(255,255,255,.025),

    0 4px 14px
    rgba(0,0,0,.35);

  transition:
    all .28s ease;

}


/* ==================================================
   BRILHO SUPERIOR DAS CAIXAS
================================================== */

.menu a::before{

  content:"";

  position:absolute;

  top:1px;

  left:20%;

  right:20%;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,233,163,.7),
      transparent
    );

  opacity:.7;

}


/* ==================================================
   ÍCONES
================================================== */

.menu a i{

  color:
    var(--ouro-claro);

  font-size:17px;

  filter:

    drop-shadow(
      0 0 5px
      rgba(201,162,39,.35)
    );

}


/* ==================================================
   HOVER
================================================== */

.menu a:hover{

  color:
    #fff2c6;

  border-color:
    var(--ouro-claro);

  background:

    linear-gradient(
      145deg,
      rgba(39,28,10,.96),
      rgba(15,10,11,.96)
    );

  transform:
    translateY(-2px);

  box-shadow:

    0 7px 20px
    rgba(201,162,39,.22),

    inset 0 0 14px
    rgba(201,162,39,.06);

}


.menu a:hover i{

  color:
    #ffeaa0;

}


/* ==================================================
   ITEM ATIVO — INÍCIO
================================================== */

.menu a.ativo{

  color:#fff4ca;

  border-color:
    #f1cf5f;

  background:

    linear-gradient(
      145deg,
      rgba(50,37,12,.96),
      rgba(18,13,10,.96)
    );

  box-shadow:

    0 0 18px
    rgba(201,162,39,.24),

    inset 0 0 12px
    rgba(201,162,39,.07);

}


.menu a.ativo i{

  color:
    #ffe27b;

}


/* ==================================================
   SELEÇÃO PREMIUM
================================================== */

.menu a.premium{

  border-color:
    rgba(255,215,90,.78);

  color:
    #f5d979;

}


.menu a.premium i{

  color:
    #ffd700;

}


/* ==================================================
   DOAR PIX
================================================== */

.menu a.pix{

  border-color:
    rgba(240,216,120,.78);

  color:
    #f5d979;

}


.menu a.pix i{

  color:
    #ffd700;

}


/* ==================================================
   HERO
   COMEÇA ABAIXO DO MENU
================================================== */

.hero{

  width:100%;

  text-align:center;

  padding:
    72px 10px
    120px;

  position:relative;

  z-index:3;

}


/* ==================================================
   TÍTULO
================================================== */

.hero h1{

  font-size:
    min(72px,13vw);

  line-height:.95;

  font-style:italic;

  font-weight:800;

  letter-spacing:6px;

  padding-left:8px;

  background:

    linear-gradient(
      180deg,
      #fff4ce 0%,
      #f0d878 43%,
      #c9a227 78%,
      #80620f 100%
    );

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;

  filter:

    drop-shadow(
      0 0 25px
      rgba(201,162,39,.32)
    );

}


/* ==================================================
   SLOGAN
================================================== */

.hero .slogan{

  margin-top:20px;

  color:
    var(--champanhe);

  font-size:
    clamp(
      17px,
      2.6vw,
      24px
    );

  font-weight:500;

  letter-spacing:2px;

  text-shadow:

    0 2px 12px
    rgba(0,0,0,.9);

}


/* ==================================================
   DESCRIÇÃO
================================================== */

.hero .descricao{

  max-width:650px;

  margin:
    24px auto 0;

  color:
    var(--texto-suave);

  font-size:16px;

  line-height:1.8;

  text-shadow:

    0 2px 8px
    rgba(0,0,0,.9);

}


/* ==================================================
   RESPONSIVO TABLET
================================================== */

@media(max-width:950px){

  .menu{

    gap:8px;

  }

  .menu a{

    min-width:125px;

    height:46px;

    padding:
      0 15px;

    font-size:15px;

  }

}


/* ==================================================
   RESPONSIVO CELULAR
================================================== */

@media(max-width:700px){

  .conteudo{

    padding:
      0 12px;

  }


  header{

    min-height:85px;

    padding:
      16px 0;

  }


  .logo-lux{

    font-size:27px;

    letter-spacing:3px;

  }


  .logo-lux::after{

    width:80px;

  }


  .btn-entrar{

    min-width:105px;

    padding:
      11px 15px;

    font-size:13px;

  }


  .menu-area{

    margin-bottom:28px;

    padding:
      11px 7px;

  }


  .menu{

    gap:7px;

  }


  .menu a{

    min-width:
      calc(33.333% - 7px);

    height:44px;

    padding:
      0 7px;

    gap:5px;

    font-size:12px;

  }


  .menu a i{

    font-size:13px;

  }


  .hero{

    padding:
      62px 7px
      100px;

  }


  .hero h1{

    font-size:
      min(58px,13vw);

    letter-spacing:3px;

  }


  .hero .slogan{

    font-size:16px;

    letter-spacing:1px;

  }


  .hero .descricao{

    font-size:14px;

  }

}


/* ==================================================
   CELULARES PEQUENOS
================================================== */

@media(max-width:430px){

  .logo-lux{

    font-size:22px;

    letter-spacing:2px;

  }


  .btn-entrar{

    min-width:92px;

    padding:
      10px 12px;

    font-size:12px;

  }


  .menu{

    gap:6px;

  }


  .menu a{

    min-width:
      calc(33.333% - 6px);

    height:42px;

    padding:
      0 5px;

    font-size:10px;

  }


  .menu a i{

    font-size:11px;

  }


  .hero{

    padding-top:55px;

  }

}

</style>

</head>


<body>


<div class="conteudo">


<!-- ==================================================
     CABEÇALHO
================================================== -->

<header>


  <div class="logo-lux">
    LUX Advance
  </div>


  <!-- ENTRAR PERMANECE NO CANTO SUPERIOR DIREITO -->

  <a
    href="login.html"
    class="btn-entrar"
  >

    <i class="fas fa-lock"></i>

    Entrar

  </a>


</header>



<!-- ==================================================
     MENU — CAIXINHAS
================================================== -->

<div class="menu-area">


  <nav class="menu">


    <a
      href="index.html"
      class="ativo"
    >

      <i class="fas fa-house"></i>

      Início

    </a>


    <a href="loja.html">

      <i class="fas fa-cart-shopping"></i>

      Loja

    </a>


    <a href="catalago.html">

      <i class="fas fa-book-open"></i>

      Catálogo

    </a>


    <a href="planos.html">

      <i class="fas fa-crown"></i>

      Planos

    </a>


    <a href="pre-cadastro.html">

      <i class="fas fa-user-plus"></i>

      Pré-Cadastro

    </a>


    <a href="agendar.html">

      <i class="fas fa-calendar-days"></i>

      Agendar

    </a>


    <a href="termos.html">

      <i class="fas fa-shield-halved"></i>

      Termos

    </a>


    <a
      href="selecao-premium.html"
      class="premium"
    >

      <i class="fas fa-gem"></i>

      Seleção Premium

    </a>


    <a
      href="doar-pix.html"
      class="pix"
    >

      <i class="fas fa-qrcode"></i>

      Doar PIX

    </a>


  </nav>


</div>



<!-- ==================================================
     CONTEÚDO PRINCIPAL
================================================== -->

<section class="hero">


  <h1>
    LUX Advance
  </h1>


  <p class="slogan">

    MAIS QUE UM SITE,
    UMA EXPERIÊNCIA

  </p>


  <p class="descricao">

    Conectamos momentos especiais
    com pessoas extraordinárias.

  </p>


</section>


</div>


</body>

</html>
