<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>LUX — Entrar</title>

  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="login.css">

</head>

<body>

  <main class="login-wrap">

    <a
      class="voltar"
      href="index.html"
    >
      ← Voltar ao LUX
    </a>


    <section class="login-card">

      <div class="marca">
        LUX
      </div>

      <p class="sub">
        Acesso exclusivo
      </p>

      <p class="descricao-login">
        Entre como usuário ou modelo.
        Cada conta recebe uma área própria.
      </p>


      <div
        id="mensagem"
        class="mensagem"
        hidden
      ></div>


      <form id="loginForm">

        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          required
          placeholder="seu@email.com"
        >


        <label for="senha">
          Senha
        </label>

        <input
          id="senha"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Sua senha"
        >


        <button
          class="btn primary"
          id="btnEntrar"
          type="submit"
        >
          Entrar
        </button>

      </form>


      <p class="senha-link">

        <a href="recuperar-senha.html">
          Esqueci minha senha
        </a>

      </p>


      <div class="separador">
        <span>CRIAR CONTA</span>
      </div>


      <div class="cadastros">

        <a href="cadastro-usuario.html">
          Criar conta de usuário
        </a>

        <a href="cadastro-modelo.html">
          Cadastrar como modelo
        </a>

      </div>

    </section>

  </main>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="auth.js"></script>


  <script>

    const formulario =
      document.getElementById(
        "loginForm"
      );

    const mensagem =
      document.getElementById(
        "mensagem"
      );

    const botao =
      document.getElementById(
        "btnEntrar"
      );


    /* =====================================================
       REDIRECIONAR PELO PERFIL
       ===================================================== */

    function abrirPainel(perfil) {

      if (!perfil) {

        throw new Error(
          "Perfil da conta não encontrado."
        );

      }


      if (perfil.tipo === "modelo") {

        window.location.replace(
          "painel-modelo.html"
        );

        return;

      }


      if (perfil.tipo === "admin") {

        window.location.replace(
          "painel.html"
        );

        return;

      }


      window.location.replace(
        "painel-usuario.html"
      );

    }


    /* =====================================================
       VERIFICAR SESSÃO JÁ EXISTENTE
       ===================================================== */

    async function verificarSessao() {

      try {

        if (!window.luxSupabase) {
          return;
        }


        const {
          data: {
            session
          }
        } =
          await window.luxSupabase.auth
            .getSession();


        if (!session || !session.user) {
          return;
        }


        const perfil =
          await getPerfil(
            session.user.id
          );


        if (!perfil) {
          return;
        }


        abrirPainel(perfil);


      } catch (erro) {

        console.log(
          "Nenhuma sessão anterior válida."
        );

      }

    }


    verificarSessao();


    /* =====================================================
       LOGIN
       ===================================================== */

    formulario.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const senha =
          document
            .getElementById("senha")
            .value;


        mensagem.hidden = false;

        mensagem.className =
          "mensagem";

        mensagem.textContent =
          "Entrando...";


        botao.disabled = true;

        botao.textContent =
          "Entrando...";


        try {

          const resultado =
            await login(
              email,
              senha
            );


          if (
            !resultado ||
            resultado.success !== true
          ) {

            throw new Error(
              resultado?.error ||
              "Não foi possível entrar."
            );

          }


          /*
           * IMPORTANTE:
           * login() já retorna o perfil.
           * Não tentamos usar resultado.id.
           */

          const perfil =
            resultado.perfil;


          if (!perfil) {

            throw new Error(
              "A conta foi autenticada, mas o perfil ainda não foi encontrado."
            );

          }


          mensagem.className =
            "mensagem success";

          mensagem.textContent =
            "Login realizado. Abrindo sua área...";


          abrirPainel(perfil);


        } catch (erro) {

          console.error(
            "Erro no login:",
            erro
          );


          mensagem.hidden = false;

          mensagem.className =
            "mensagem error";

          mensagem.textContent =
            erro.message ||
            "E-mail ou senha incorretos.";


          botao.disabled = false;

          botao.textContent =
            "Entrar";

        }

      }
    );

  </script>

</body>

</html>
