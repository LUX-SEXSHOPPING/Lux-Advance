<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>LUX Advance — Acesso</title>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- CONFIGURAÇÃO -->
<script src="./config.js"></script>

<!-- AUTENTICAÇÃO -->
<script src="./auth.js"></script>


<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: #fff;

  background:
    linear-gradient(
      rgba(5,2,7,.78),
      rgba(12,3,10,.96)
    ),
    url("./lux-halloween.jpg")
    center / cover fixed no-repeat;

  padding: 20px;

}


.container {

  width: 100%;

  max-width: 480px;

  margin: 0 auto;

}


.voltar {

  display: inline-block;

  color: #f8d58a;

  text-decoration: none;

  font-size: 14px;

  margin-bottom: 15px;

}


.card {

  background:
    linear-gradient(
      145deg,
      rgba(25,6,18,.97),
      rgba(7,3,9,.98)
    );

  border:
    1px solid
    rgba(248,213,138,.35);

  border-radius: 22px;

  padding: 30px 23px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.65);

}


.logo {

  text-align: center;

  color: #f8d58a;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 34px;

  font-weight: bold;

  font-style: italic;

}


.slogan {

  text-align: center;

  color: #aaa;

  font-size: 11px;

  letter-spacing: 1px;

  margin-top: 5px;

  margin-bottom: 28px;

}


.tela {

  display: none;

}


.tela.ativa {

  display: block;

}


h1 {

  text-align: center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 25px;

  margin:
    0 0 9px;

}


.descricao {

  text-align: center;

  color: #aaa;

  font-size: 13px;

  line-height: 1.5;

  margin-bottom: 25px;

}


.opcoes {

  display: grid;

  gap: 13px;

}


.opcao {

  width: 100%;

  min-height: 82px;

  padding: 17px;

  border-radius: 14px;

  border:
    1px solid
    rgba(248,213,138,.35);

  background:
    rgba(255,255,255,.045);

  color: #fff;

  cursor: pointer;

  text-align: left;

  font-family: Arial, sans-serif;

  transition: .2s;

}


.opcao:hover {

  border-color:
    rgba(248,213,138,.75);

  background:
    rgba(248,213,138,.08);

}


.opcao strong {

  display: block;

  color: #f8d58a;

  font-size: 16px;

  margin-bottom: 6px;

}


.opcao span {

  display: block;

  color: #aaa;

  font-size: 12px;

  line-height: 1.4;

}


.campo {

  margin-bottom: 15px;

}


.campo label {

  display: block;

  color: #f8d58a;

  font-size: 12px;

  font-weight: bold;

  margin-bottom: 7px;

}


input,
textarea {

  width: 100%;

  border-radius: 11px;

  border:
    1px solid
    rgba(255,255,255,.13);

  background:
    rgba(255,255,255,.055);

  color: #fff;

  outline: none;

  font-family: Arial, sans-serif;

  font-size: 14px;

  padding: 13px;

}


input {

  height: 47px;

}


textarea {

  min-height: 85px;

  resize: vertical;

}


input:focus,
textarea:focus {

  border-color:
    rgba(248,213,138,.75);

}


input::placeholder,
textarea::placeholder {

  color: #777;

}


.btn-principal {

  width: 100%;

  height: 50px;

  border: none;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #f8d58a,
      #d7a84d
    );

  color: #16070d;

  font-weight: bold;

  font-size: 14px;

  cursor: pointer;

}


.btn-principal:disabled {

  opacity: .55;

  cursor: wait;

}


.btn-secundario {

  width: 100%;

  height: 45px;

  margin-top: 10px;

  border-radius: 11px;

  border:
    1px solid
    rgba(248,213,138,.3);

  background: transparent;

  color: #f8d58a;

  cursor: pointer;

}


.tipo {

  text-align: center;

  color: #f8d58a;

  font-size: 12px;

  font-weight: bold;

  margin-bottom: 12px;

  letter-spacing: .5px;

}


.mensagem {

  display: none;

  padding: 12px;

  margin-top: 15px;

  border-radius: 10px;

  text-align: center;

  font-size: 12px;

  line-height: 1.5;

}


.mensagem.erro {

  display: block;

  color: #ffbdc9;

  background:
    rgba(180,30,70,.15);

  border:
    1px solid
    rgba(255,70,100,.3);

}


.mensagem.sucesso {

  display: block;

  color: #c5ffd6;

  background:
    rgba(50,150,80,.15);

  border:
    1px solid
    rgba(100,220,140,.25);

}


.rodape {

  text-align: center;

  color: #666;

  font-size: 10px;

  margin-top: 18px;

}


@media(max-width:480px) {

  body {
    padding: 15px;
  }

  .card {
    padding: 27px 19px;
  }

  .logo {
    font-size: 30px;
  }

}

</style>

</head>


<body>


<div class="container">


<a
  href="./index.html"
  class="voltar"
>
← Voltar
</a>


<div class="card">


<div class="logo">
LUX Advance
</div>


<div class="slogan">
MAIS QUE UM SITE, UMA EXPERIÊNCIA
</div>



<!-- =====================================================
     TELA INICIAL
===================================================== -->

<section
  id="telaInicial"
  class="tela ativa"
>

<h1>
Acesso LUX
</h1>


<div class="descricao">

Entre na sua conta ou crie
seu cadastro gratuitamente.

</div>


<div class="opcoes">


<button
  type="button"
  id="btnJaTenho"
  class="opcao"
>

<strong>
🔐 Já tenho cadastro
</strong>

<span>
Entre com seu e-mail e senha
para acessar sua área.
</span>

</button>


<button
  type="button"
  id="btnNaoTenho"
  class="opcao"
>

<strong>
✦ Ainda não tenho cadastro
</strong>

<span>
Crie sua conta escolhendo
Usuário ou Modelo.
</span>

</button>


</div>


</section>



<!-- =====================================================
     LOGIN
===================================================== -->

<section
  id="telaLogin"
  class="tela"
>

<h1>
Entrar
</h1>


<div class="descricao">
Digite seus dados de acesso.
</div>


<form id="formLogin">


<div class="campo">

<label>
E-MAIL
</label>

<input
  type="email"
  id="loginEmail"
  placeholder="Digite seu e-mail"
  required
>

</div>


<div class="campo">

<label>
SENHA
</label>

<input
  type="password"
  id="loginSenha"
  placeholder="Digite sua senha"
  required
>

</div>


<button
  type="submit"
  class="btn-principal"
  id="btnLogin"
>
ENTRAR
</button>


</form>


<div
  id="msgLogin"
  class="mensagem"
></div>


<button
  type="button"
  class="btn-secundario"
  id="btnVoltarLogin"
>
← Voltar
</button>


</section>



<!-- =====================================================
     ESCOLHA DO CADASTRO
===================================================== -->

<section
  id="telaEscolha"
  class="tela"
>

<h1>
Criar cadastro
