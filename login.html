<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LUX — Entrar</title>

  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <main class="login-wrap">

    <a class="voltar" href="index.html">
      ← Voltar ao LUX
    </a>

    <section class="login-card">

      <div class="marca">LUX</div>

      <p class="sub">
        Acesso exclusivo
      </p>

      <p style="color:#b9afb4">
        Entre como usuário ou modelo.
        Cada conta recebe uma área própria.
      </p>

      <div id="mensagem" class="mensagem" hidden></div>

      <form id="loginForm">

        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          required
          placeholder="seu@email.com"
        >

        <label for="senha">
          Senha
        </label>

        <input
          id="senha"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Sua senha"
        >

        <button
          class="btn primary"
          type="submit"
        >
          Entrar
        </button>

      </form>

      <p class="senha-link">
        <a href="redefinir-senha.html">
          Esqueci minha senha
        </a>
      </p>

      <div class="separador">
        <span>CRIAR CONTA</span>
      </div>

      <div class="cadastros">

        <a href="cadastro-usuario.html">
          Criar conta de usuário
        </a>

        <a href="cadastro-modelo.html">
          Cadastrar como modelo
        </a>

      </div>

    </section>

  </main>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CONFIGURAÇÃO -->
  <script src="config.js?v=3"></script>

  <!-- AUTENTICAÇÃO -->
  <script src="auth.js?v=3"></script>


  <script>

    const form = document.getElementById("loginForm");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", async function (e) {

      e.preventDefault();

      mensagem.hidden = false;
      mensagem.className = "mensagem";
      mensagem.textContent = "Entrando...";

      const email = document
        .getElementById("email")
        .value
        .trim();

      const senha = document
        .getElementById("senha")
        .value;


      try {

        /* Verifica se o sistema de autenticação carregou */

        if (typeof window.login !== "function") {
          throw new Error(
            "Sistema de login não carregado. Atualize a página e tente novamente."
          );
        }


        /* Faz login no Supabase */

        const usuario = await window.login(
          email,
          senha
        );


        if (!usuario || !usuario.id) {
          throw new Error(
            "Não foi possível identificar sua conta."
          );
        }


        /* Busca o tipo da conta */

        const tipo = await window.getTipoUsuario(
          usuario.id
        );


        if (!tipo) {
          throw new Error(
            "Sua conta foi criada, mas o perfil ainda não está disponível. Aguarde alguns instantes e tente novamente."
          );
        }


        mensagem.textContent =
          "Login realizado. Abrindo seu painel...";


        /*
         * REDIRECIONAMENTO DOS PAINÉIS
         *
         * Os arquivos estão na raiz do projeto.
         */

        if (tipo === "modelo") {

          window.location.href =
            "painel-modelo.html";

        }

        else if (tipo === "admin") {

          window.location.href =
            "painel.html";

        }

        else {

          window.location.href =
            "painel-usuario.html";

        }


      } catch (erro) {

        console.error(
          "Erro no login:",
          erro
        );

        mensagem.hidden = false;

        mensagem.className =
          "mensagem error";

        mensagem.textContent =
          erro?.message ||
          "Não foi possível realizar o login.";

      }

    });

  </script>

</body>

</html>
