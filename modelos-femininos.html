<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>LUX — Modelos Femininos</title>

  <link
    rel="stylesheet"
    href="app.css"
  >
</head>

<body style="
  background:
    #000
    url('./Halloween-feminina.jpg')
    center top / cover
    no-repeat fixed;
">

  <header class="topbar">

    <a
      class="brand"
      href="index.html"
    >
      LUX
    </a>

    <div class="actions">

      <a
        class="btn ghost"
        href="login.html"
      >
        Entrar
      </a>

    </div>

  </header>


  <main class="container">

    <section class="hero">

      <div class="eyebrow">
        LUX
      </div>

      <h1 class="title">
        Modelos Femininos
      </h1>

      <p class="subtitle">
        Conheça os perfis femininos disponíveis
        na plataforma LUX.
      </p>

    </section>


    <section
      id="listaModelos"
      class="grid"
    >

      <div class="empty">
        Carregando modelos...
      </div>

    </section>

  </main>


  <footer class="footer">
    LUX — Sensualidade & Sofisticação
  </footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="auth.js"></script>


  <script>

    async function carregarModelos() {

      const lista =
        document.getElementById(
          "listaModelos"
        );

      try {

        const db =
          requireClient();


        const {
          data,
          error
        } =
          await db
            .from("modelo_perfis")
            .select("*");


        if (error) {
          throw error;
        }


        if (
          !data ||
          data.length === 0
        ) {

          lista.innerHTML = `
            <div class="empty">
              Nenhum modelo feminino disponível no momento.
            </div>
          `;

          return;

        }


        lista.innerHTML =
          data.map(
            modelo => {

              const nome =
                escapeHTML(
                  modelo.nome_exibicao || modelo.nome ||
                  "Modelo LUX"
                );


              const cidade =
                escapeHTML(
                  modelo.cidade ||
                  "Disponível na LUX"
                );


              let imagem = "";

              if (
                modelo.foto
              ) {

                imagem = `
                  <img
                    class="avatar"
                    src="${escapeHTML(modelo.foto)}"
                    alt="${nome}"
                  >
                `;

              } else {

                imagem = `
                  <div
                    class="avatar"
                    style="
                      display:flex;
                      align-items:center;
                      justify-content:center;
                      color:var(--gold2);
                      font-family:'Playfair Display',serif;
                      font-size:28px;
                    "
                  >
                    LUX
                  </div>
                `;

              }


              return `

                <article class="card">

                  ${imagem}

                  <div class="card-body">

                    <span class="pill lux-plan-badge">
                      ✦ LUX
                      <span>
                        ${escapeHTML(modelo.selo_codigo || "ESSENCE")}
                      </span>
                    </span>

                    <span class="pill">
                      MODELO LUX
                    </span>

                    <h2>
                      ${nome}
                    </h2>

                    <p
                      style="
                        color:var(--muted);
                      "
                    >
                      ${cidade}
                    </p>

                    <div class="actions">

                      <a
                        class="btn primary"
                        href="login.html"
                      >
                        Acessar
                      </a>

                    </div>

                  </div>

                </article>

              `;

            }
          ).join("");


      } catch (erro) {

        console.error(erro);

        lista.innerHTML = `
          <div class="empty">
            Não foi possível carregar os modelos.
          </div>
        `;

      }

    }


    carregarModelos();

  </script>

</body>

</html>
