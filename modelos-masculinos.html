<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>LUX — Modelos Masculinos</title>

  <link
    rel="stylesheet"
    href="app.css"
  >

  <style>

    body{
      background:
        linear-gradient(
          rgba(0,0,0,.58),
          rgba(0,0,0,.78)
        ),
        url("./Halloween-feminina.jpg")
        center top / cover
        no-repeat fixed;
    }

    .pesquisa-lux{
      max-width:650px;
      margin:0 auto 35px;
      display:flex;
      gap:10px;
    }

    .pesquisa-lux input{
      flex:1;
      padding:15px 18px;
      border-radius:30px;
      border:1px solid rgba(248,213,138,.5);
      background:rgba(0,0,0,.65);
      color:#fff;
      outline:none;
    }

    .pesquisa-lux input::placeholder{
      color:#aaa;
    }

    .catalogo-link{
      display:inline-block;
      margin-bottom:25px;
    }

  </style>

</head>

<body>

  <header class="topbar">

    <a
      class="brand"
      href="index.html"
    >
      LUX
    </a>

    <div class="actions">

      <a
        class="btn ghost"
        href="catalago.html"
      >
        Catálogo
      </a>

      <a
        class="btn ghost"
        href="login.html"
      >
        Entrar
      </a>

    </div>

  </header>


  <main class="container">

    <section class="hero">

      <div class="eyebrow">
        LUX
      </div>

      <h1 class="title">
        Modelos Masculinos
      </h1>

      <p class="subtitle">
        Conheça os perfis masculinos disponíveis
        na plataforma LUX.
      </p>

    </section>


    <a
      class="btn ghost catalogo-link"
      href="catalago.html"
    >
      ← Voltar ao Catálogo
    </a>


    <div class="pesquisa-lux">

      <input
        type="search"
        id="pesquisa"
        placeholder="Pesquisar por nome ou cidade..."
        autocomplete="off"
      >

    </div>


    <section
      id="listaModelos"
      class="grid"
    >

      <div class="empty">
        Carregando modelos...
      </div>

    </section>

  </main>


  <footer class="footer">
    LUX — Sensualidade & Sofisticação
  </footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="auth.js"></script>


  <script>

    let modelos = [];


    function escapeHTML(valor){

      return String(valor || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

    }


    function mostrarModelos(listaDados){

      const lista =
        document.getElementById(
          "listaModelos"
        );


      if(
        !listaDados ||
        listaDados.length === 0
      ){

        lista.innerHTML = `
          <div class="empty">
            Nenhum modelo masculino disponível.
          </div>
        `;

        return;

      }


      lista.innerHTML =
        listaDados.map(modelo => {

          const nome =
            escapeHTML(
              modelo.nome_exibicao ||
              modelo.nome ||
              "Modelo LUX"
            );


          const cidade =
            escapeHTML(
              modelo.cidade ||
              "Disponível na LUX"
            );


          let imagem = "";


          if(modelo.foto){

            imagem = `
              <img
                class="avatar"
                src="${escapeHTML(modelo.foto)}"
                alt="${nome}"
              >
            `;

          }else{

            imagem = `
              <div
                class="avatar"
                style="
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  color:var(--gold2);
                  font-family:'Playfair Display',serif;
                  font-size:28px;
                "
              >
                LUX
              </div>
            `;

          }


          return `

            <article class="card">

              ${imagem}

              <div class="card-body">

                <span class="pill lux-plan-badge">
                  ✦ LUX
                  <span>
                    ${escapeHTML(
                      modelo.selo_codigo ||
                      "ESSENCE"
                    )}
                  </span>
                </span>

                <span class="pill">
                  MODELO MASCULINO
                </span>

                <h2>
                  ${nome}
                </h2>

                <p style="color:var(--muted)">
                  ${cidade}
                </p>

                <div class="actions">

                  <a
                    class="btn primary"
                    href="login.html"
                  >
                    Acessar
                  </a>

                </div>

              </div>

            </article>

          `;

        }).join("");

    }


    async function carregarModelos(){

      const lista =
        document.getElementById(
          "listaModelos"
        );


      try{

        const db =
          window.luxSupabase;


        if(!db){

          throw new Error(
            "Supabase não inicializado."
          );

        }


        const {
          data,
          error
        } =
          await db
            .from("modelo_perfis")
            .select("*");


        if(error){

          throw error;

        }


        modelos = data || [];

        mostrarModelos(modelos);


      }catch(erro){

        console.error(erro);

        lista.innerHTML = `
          <div class="empty">
            Não foi possível carregar os modelos.
          </div>
        `;

      }

    }


    document
      .getElementById("pesquisa")
      .addEventListener(
        "input",
        function(){

          const termo =
            this.value
              .trim()
              .toLowerCase();


          if(!termo){

            mostrarModelos(modelos);

            return;

          }


          const filtrados =
            modelos.filter(modelo => {

              const nome =
                String(
                  modelo.nome_exibicao ||
                  modelo.nome ||
                  ""
                ).toLowerCase();


              const cidade =
                String(
                  modelo.cidade ||
                  ""
                ).toLowerCase();


              return (
                nome.includes(termo) ||
                cidade.includes(termo)
              );

            });


          mostrarModelos(filtrados);

        }
      );


    carregarModelos();

  </script>

</body>

</html>
