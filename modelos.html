<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#0b0608"
  >

  <meta
    name="description"
    content="LUX Advance — Modelos"
  >

  <title>LUX — Modelos</title>

  <link
    rel="stylesheet"
    href="./app.css"
  >

  <style>

    :root {
      --lux-bg: #0b0608;
      --lux-bg-2: #12090d;
      --lux-card: rgba(25, 13, 18, .94);
      --lux-card-2: rgba(18, 9, 13, .98);
      --lux-gold: #f5d58c;
      --lux-gold-2: #c9a227;
      --lux-text: #f7f0f2;
      --lux-muted: #b9afb4;
      --lux-border: rgba(245, 213, 140, .18);
      --lux-pink: #ff4da6;
      --lux-green: #25d366;
      --lux-shadow: 0 18px 50px rgba(0,0,0,.45);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(201,162,39,.13),
          transparent 38%
        ),
        radial-gradient(
          circle at 0% 40%,
          rgba(255,77,166,.05),
          transparent 28%
        ),
        var(--lux-bg);

      color: var(--lux-text);
    }

    .lux-modelos-topbar {
      width: 100%;
      padding: 14px 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      position: sticky;
      top: 0;
      z-index: 1000;

      background:
        linear-gradient(
          180deg,
          rgba(11,6,8,.98),
          rgba(11,6,8,.90)
        );

      border-bottom: 1px solid var(--lux-border);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .lux-brand {
      text-decoration: none;
      color: var(--lux-gold);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 25px;
      font-weight: 700;
      letter-spacing: 4px;

      text-shadow:
        0 0 18px rgba(245,213,140,.16);
    }

    .lux-top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lux-top-button {
      min-height: 40px;
      padding: 9px 14px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 999px;

      border: 1px solid var(--lux-border);

      background: rgba(255,255,255,.035);

      color: var(--lux-text);

      text-decoration: none;

      font-size: 11px;
      font-weight: 700;
      letter-spacing: .7px;

      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
    }

    .lux-top-button:hover {
      transform: translateY(-1px);
      border-color: rgba(245,213,140,.45);
      background: rgba(245,213,140,.08);
    }

    .lux-top-button.gold {
      color: #130b0e;

      background:
        linear-gradient(
          135deg,
          #f8d98f,
          #c9a227
        );

      border-color: #f5d58c;
    }

    .lux-modelos-container {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0 50px;
    }

    .lux-modelos-hero {
      text-align: center;
      padding: 15px 8px 28px;
    }

    .lux-eyebrow {
      color: var(--lux-gold);

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 4px;

      margin-bottom: 9px;

      text-transform: uppercase;
    }

    .lux-modelos-title {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(34px, 7vw, 58px);

      line-height: 1.05;

      color: #fff;

      letter-spacing: 1px;
    }

    .lux-modelos-subtitle {
      max-width: 650px;

      margin: 13px auto 0;

      color: var(--lux-muted);

      font-size: 14px;
      line-height: 1.7;
    }

    .lux-filter-panel {
      margin-bottom: 25px;

      padding: 18px;

      border: 1px solid var(--lux-border);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.015)
        );

      box-shadow: var(--lux-shadow);
    }

    .lux-filter-title {
      margin: 0 0 13px;

      color: var(--lux-gold);

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    .lux-filter-grid {
      display: grid;

      grid-template-columns:
        minmax(180px, 1.5fr)
        repeat(3, minmax(140px, 1fr));

      gap: 10px;
    }

    .lux-input,
    .lux-select {
      width: 100%;

      min-height: 45px;

      padding: 11px 13px;

      border-radius: 12px;

      border: 1px solid rgba(245,213,140,.14);

      outline: none;

      background: #10080b;

      color: #f5eef1;

      font-size: 13px;
    }

    .lux-input::placeholder {
      color: #766b71;
    }

    .lux-input:focus,
    .lux-select:focus {
      border-color: rgba(245,213,140,.48);

      box-shadow:
        0 0 0 3px rgba(245,213,140,.06);
    }

    .lux-select option {
      background: #10080b;
      color: #fff;
    }

    .lux-results-info {
      margin-top: 12px;

      color: #887c82;

      font-size: 11px;
    }

    .lux-results-info strong {
      color: var(--lux-gold);
    }

    .lux-modelos-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(245px, 1fr));

      gap: 20px;
    }

    .lux-model-card {
      position: relative;

      overflow: hidden;

      border-radius: 20px;

      border: 1px solid var(--lux-border);

      background:
        linear-gradient(
          180deg,
          rgba(31,16,22,.98),
          rgba(15,8,11,.99)
        );

      box-shadow: var(--lux-shadow);

      transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
    }

    .lux-model-card:hover {
      transform: translateY(-5px);

      border-color:
        rgba(245,213,140,.42);

      box-shadow:
        0 24px 60px rgba(0,0,0,.56);
    }

    .lux-photo-wrap {
      position: relative;

      width: 100%;
      height: 315px;

      overflow: hidden;

      background:
        radial-gradient(
          circle,
          rgba(245,213,140,.10),
          transparent 60%
        ),
        #10080b;
    }

    .lux-model-photo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      object-position: center;

      transition:
        transform .45s ease;
    }

    .lux-model-card:hover .lux-model-photo {
      transform: scale(1.035);
    }

    .lux-photo-fallback {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--lux-gold);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 40px;

      letter-spacing: 6px;

      background:
        radial-gradient(
          circle at center,
          rgba(245,213,140,.12),
          transparent 55%
        );
    }

    .lux-selo-manto {
      position: absolute;

      top: 15px;
      right: -35px;

      z-index: 4;

      width: 150px;

      padding: 8px;

      text-align: center;

      color: #130b0d;

      font-size: 10px;
      font-weight: 900;

      letter-spacing: 1.2px;

      text-transform: uppercase;

      background:
        linear-gradient(
          135deg,
          #fff0bb 0%,
          #f5d58c 38%,
          #c9a227 100%
        );

      border-top: 1px solid rgba(255,255,255,.65);
      border-bottom: 1px solid rgba(72,49,0,.4);

      box-shadow:
        0 5px 18px rgba(0,0,0,.35);

      transform: rotate(38deg);

      white-space: nowrap;

      pointer-events: none;
    }

    .lux-selo-manto::before,
    .lux-selo-manto::after {
      content: "";

      position: absolute;

      width: 7px;
      height: 7px;

      top: 50%;

      transform:
        translateY(-50%)
        rotate(45deg);

      background: #8e7118;
    }

    .lux-selo-manto::before {
      left: 9px;
    }

    .lux-selo-manto::after {
      right: 9px;
    }

    .lux-card-body {
      padding: 16px 16px 17px;
    }

    .lux-card-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 8px;

      margin-bottom: 9px;
    }

    .lux-plan {
      display: inline-flex;

      align-items: center;

      min-height: 27px;

      padding: 5px 9px;

      border-radius: 999px;

      border: 1px solid rgba(245,213,140,.25);

      background: rgba(245,213,140,.07);

      color: var(--lux-gold);

      font-size: 9px;
      font-weight: 900;

      letter-spacing: .8px;
    }

    .lux-verified {
      color: #f8d58a;

      font-size: 11px;
      white-space: nowrap;
    }

    .lux-model-name {
      margin: 0;

      color: #fff;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 25px;

      line-height: 1.1;
    }

    .lux-location {
      display: flex;

      align-items: center;

      gap: 6px;

      margin: 9px 0 0;

      color: var(--lux-muted);

      font-size: 12px;

      line-height: 1.5;
    }

    .lux-location-icon {
      color: var(--lux-gold);
    }

    .lux-stars {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 8px;

      margin-top: 14px;

      padding-top: 12px;

      border-top: 1px solid rgba(255,255,255,.06);
    }

    .lux-stars-count {
      color: #d8cbd0;

      font-size: 12px;
    }

    .lux-stars-count strong {
      color: var(--lux-gold);

      font-size: 14px;
    }

    .lux-rate-button {
      min-height: 34px;

      padding: 7px 11px;

      border-radius: 999px;

      border: 1px solid rgba(245,213,140,.28);

      background: rgba(245,213,140,.06);

      color: var(--lux-gold);

      cursor: pointer;

      font-size: 10px;
      font-weight: 800;

      transition:
        background .2s ease,
        transform .2s ease;
    }

    .lux-rate-button:hover {
      background: rgba(245,213,140,.13);
      transform: translateY(-1px);
    }

    .lux-rate-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .lux-whatsapp {
      width: 100%;

      min-height: 43px;

      margin-top: 13px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      border-radius: 12px;

      border: 1px solid rgba(37,211,102,.25);

      background:
        linear-gradient(
          135deg,
          rgba(37,211,102,.14),
          rgba(37,211,102,.05)
        );

      color: #baf5cf;

      text-decoration: none;

      font-size: 11px;

      font-weight: 900;

      letter-spacing: .8px;

      transition:
        transform .2s ease,
        background .2s ease;
    }

    .lux-whatsapp:hover {
      transform: translateY(-1px);

      background:
        linear-gradient(
          135deg,
          rgba(37,211,102,.22),
          rgba(37,211,102,.08)
        );
    }

    .lux-status-box {
      grid-column: 1 / -1;

      padding: 48px 20px;

      text-align: center;

      border-radius: 20px;

      border: 1px dashed rgba(245,213,140,.18);

      background: rgba(255,255,255,.018);

      color: var(--lux-muted);
    }

    .lux-status-icon {
      margin-bottom: 12px;

      color: var(--lux-gold);

      font-size: 31px;
    }

    .lux-status-title {
      color: #fff;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 21px;
    }

    .lux-status-text {
      margin-top: 7px;

      color: #8f8389;

      font-size: 12px;

      line-height: 1.6;
    }

    .lux-notice {
      margin-bottom: 18px;

      padding: 12px 15px;

      border-radius: 12px;

      border: 1px solid rgba(245,213,140,.18);

      background: rgba(245,213,140,.05);

      color: #e8d9c0;

      font-size: 12px;

      line-height: 1.5;
    }

    .lux-notice.error {
      border-color: rgba(255,77,166,.22);
      background: rgba(255,77,166,.05);
    }

    .lux-footer {
      padding: 30px 18px 45px;

      text-align: center;

      color: #665b61;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 12px;

      letter-spacing: 1px;
    }

    @media (max-width: 760px) {

      .lux-filter-grid {
        grid-template-columns: 1fr 1fr;
      }

      .lux-filter-grid .lux-input {
        grid-column: 1 / -1;
      }

      .lux-photo-wrap {
        height: 330px;
      }

      .lux-modelos-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 12px;
      }

      .lux-card-body {
        padding: 13px;
      }

      .lux-model-name {
        font-size: 20px;
      }

      .lux-stars {
        display: block;
      }

      .lux-rate-button {
        width: 100%;
        margin-top: 9px;
      }

    }

    @media (max-width: 470px) {

      .lux-modelos-container {
        width: min(100% - 20px, 1180px);
        padding-top: 22px;
      }

      .lux-modelos-grid {
        grid-template-columns: 1fr;
      }

      .lux-photo-wrap {
        height: 390px;
      }

      .lux-filter-grid {
        grid-template-columns: 1fr;
      }

      .lux-filter-grid .lux-input {
        grid-column: auto;
      }

      .lux-top-button {
        padding: 8px 10px;
        font-size: 9px;
      }

      .lux-brand {
        font-size: 21px;
      }

    }

  </style>

</head>


<body>

  <header class="lux-modelos-topbar">

    <a
      class="lux-brand"
      href="index.html"
      aria-label="LUX"
    >
      LUX
    </a>

    <div class="lux-top-actions">

      <a
        class="lux-top-button gold"
        href="painel-usuario.html"
      >
        ← MINHA ÁREA
      </a>

    </div>

  </header>


  <main class="lux-modelos-container">

    <section class="lux-modelos-hero">

      <div class="lux-eyebrow">
        LUX ADVANCE
      </div>

      <h1 class="lux-modelos-title">
        Modelos-Advance
      </h1>

      <p class="lux-modelos-subtitle">
        Conheça os perfis disponíveis na LUX e encontre sua experiência.
      </p>

    </section>


    <div
      id="mensagem"
      class="lux-notice"
      hidden
    ></div>


    <section class="lux-filter-panel">

      <h2 class="lux-filter-title">
        Encontrar uma modelo
      </h2>

      <div class="lux-filter-grid">

        <input
          id="filtroBusca"
          class="lux-input"
          type="search"
          placeholder="Pesquisar por nome..."
          autocomplete="off"
        >

        <select
          id="filtroPais"
          class="lux-select"
        >
          <option value="">
            Todos os países
          </option>
        </select>

        <select
          id="filtroEstado"
          class="lux-select"
        >
          <option value="">
            Todos os estados
          </option>
        </select>

        <select
          id="filtroCidade"
          class="lux-select"
        >
          <option value="">
            Todas as cidades
          </option>
        </select>

      </div>

      <div
        id="resultadoInfo"
        class="lux-results-info"
      >
        Carregando modelos...
      </div>

    </section>


    <section
      id="listaModelos"
      class="lux-modelos-grid"
    >

      <div class="lux-status-box">

        <div class="lux-status-icon">
          ◇
        </div>

        <div class="lux-status-title">
          Carregando modelos
        </div>

        <div class="lux-status-text">
          Aguarde enquanto buscamos os perfis disponíveis.
        </div>

      </div>

    </section>

  </main>


  <footer class="lux-footer">
    LUX-ADVANCE Sensualidade & Sofisticação
  </footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./config.js?v=5"></script>

  <script src="./auth.js?v=10"></script>


  <script>

    /* =========================================================
       CONFIGURAÇÕES
       ========================================================= */

    const WHATSAPP_LUX = "5551980612941";

    let todosModelos = [];

    let usuarioAtual = null;


    /* =========================================================
       SEGURANÇA HTML
       ========================================================= */

    function escapeHTML(valor) {

      return String(valor ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function textoNormalizado(valor) {

      return String(valor ?? "")
        .trim()
        .toLowerCase();

    }


    function valorLocalizacao(modelo, campo) {

      return String(
        modelo?.[campo] ?? ""
      ).trim();

    }


    /* =========================================================
       MENSAGENS
       ========================================================= */

    function mostrarMensagem(
      texto,
      erro = false
    ) {

      const elemento =
        document.getElementById(
          "mensagem"
        );

      if (!elemento) return;

      elemento.textContent = texto;

      elemento.hidden = false;

      elemento.classList.toggle(
        "error",
        erro
      );

    }


    function esconderMensagem() {

      const elemento =
        document.getElementById(
          "mensagem"
        );

      if (!elemento) return;

      elemento.hidden = true;

    }


    /* =========================================================
       SESSÃO
       ========================================================= */

    async function obterUsuarioAtual() {

      try {

        if (!window.luxSupabase) {
          return null;
        }

        const {
          data: sessaoData
        } =
          await window.luxSupabase.auth.getSession();

        const sessao =
          sessaoData?.session;

        if (!sessao?.user) {
          return null;
        }

        const {
          data,
          error
        } =
          await window.luxSupabase.auth.getUser();

        if (error) {

          console.warn(
            "[LUX] getUser:",
            error.message
          );

          return sessao.user;

        }

        return (
          data?.user ||
          sessao.user
        );

      } catch (erro) {

        console.error(
          "[LUX] sessão:",
          erro
        );

        return null;

      }

    }


    /* =========================================================
       WHATSAPP
       ========================================================= */

    function gerarWhatsApp(modelo) {

      const nome =
        modelo?.nome_exibicao ||
        "uma modelo LUX";

      const mensagem =
        `Olá, LUX-ADVANCE. Tenho interesse em conhecer o perfil de ${nome}.`;

      return (
        "https://wa.me/" +
        WHATSAPP_LUX +
        "?text=" +
        encodeURIComponent(
          mensagem
        )
      );

    }


    /* =========================================================
       SELOS
       ========================================================= */

    function obterSelo(modelo) {

      const selo =
        modelo?.selo_codigo ||
        modelo?.plano_codigo ||
        "ESSENCE";

      return String(selo)
        .replace("LUX-", "")
        .trim()
        .toUpperCase();

    }


    /* =========================================================
       LOCALIZAÇÃO
       ========================================================= */

    function textoLocalizacao(modelo) {

      const partes = [];

      const cidade =
        valorLocalizacao(
          modelo,
          "cidade"
        );

      const estado =
        valorLocalizacao(
          modelo,
          "estado"
        );

      const pais =
        valorLocalizacao(
          modelo,
          "pais"
        );

      if (cidade) {
        partes.push(cidade);
      }

      if (estado) {
        partes.push(estado);
      }

      if (pais) {
        partes.push(pais);
      }

      if (!partes.length) {
        return "Disponível na LUX";
      }

      return partes.join(" • ");

    }


    /* =========================================================
       FILTROS
       ========================================================= */

    function preencherSelect(
      id,
      valores,
      textoPadrao
    ) {

      const select =
        document.getElementById(id);

      if (!select) return;

      const atual =
        select.value;

      const unicos = [
        ...new Set(
          valores
            .map(
              valor =>
                String(
                  valor ?? ""
                ).trim()
            )
            .filter(Boolean)
        )
      ].sort(
        (a, b) =>
          a.localeCompare(
            b,
            "pt-BR"
          )
      );

      select.innerHTML =
        `<option value="">${escapeHTML(textoPadrao)}</option>` +
        unicos
          .map(
            valor =>
              `<option value="${escapeHTML(valor)}">${escapeHTML(valor)}</option>`
          )
          .join("");

      if (
        unicos.includes(atual)
      ) {
        select.value = atual;
      }

    }


    function atualizarFiltros() {

      const pais =
        document.getElementById(
          "filtroPais"
        )?.value || "";

      const estado =
        document.getElementById(
          "filtroEstado"
        )?.value || "";

      const paisNormalizado =
        textoNormalizado(pais);

      const estadoNormalizado =
        textoNormalizado(estado);

      const modelosPais =
        pais

          ? todosModelos.filter(
              modelo =>
                textoNormalizado(
                  modelo.pais
                ) === paisNormalizado
            )

          : todosModelos;


      preencherSelect(
        "filtroEstado",
        modelosPais.map(
          modelo =>
            modelo.estado
        ),
        "Todos os estados"
      );


      const modelosEstado =
        estado

          ? modelosPais.filter(
              modelo =>
                textoNormalizado(
                  modelo.estado
                ) === estadoNormalizado
            )

          : modelosPais;


      preencherSelect(
        "filtroCidade",
        modelosEstado.map(
          modelo =>
            modelo.cidade
        ),
        "Todas as cidades"
      );

    }


    function preencherFiltrosIniciais() {

      preencherSelect(
        "filtroPais",
        todosModelos.map(
          modelo =>
            modelo.pais
        ),
        "Todos os países"
      );

      atualizarFiltros();

    }


    function aplicarFiltros() {

      const busca =
        textoNormalizado(
          document.getElementById(
            "filtroBusca"
          )?.value
        );

      const pais =
        textoNormalizado(
          document.getElementById(
            "filtroPais"
          )?.value
        );

      const estado =
        textoNormalizado(
          document.getElementById(
            "filtroEstado"
          )?.value
        );

      const cidade =
        textoNormalizado(
          document.getElementById(
            "filtroCidade"
          )?.value
        );


      const filtrados =
        todosModelos.filter(
          modelo => {

            const nome =
              textoNormalizado(
                modelo.nome_exibicao
              );

            const apelido =
              textoNormalizado(
                modelo.apelido
              );

            const cidadeModelo =
              textoNormalizado(
                modelo.cidade
              );

            const estadoModelo =
              textoNormalizado(
                modelo.estado
              );

            const paisModelo =
              textoNormalizado(
                modelo.pais
              );


            const correspondeBusca =
              !busca ||
              nome.includes(busca) ||
              apelido.includes(busca) ||
              cidadeModelo.includes(busca) ||
              estadoModelo.includes(busca) ||
              paisModelo.includes(busca);


            const correspondePais =
              !pais ||
              paisModelo === pais;


            const correspondeEstado =
              !estado ||
              estadoModelo === estado;


            const correspondeCidade =
              !cidade ||
              cidadeModelo === cidade;


            return (
              correspondeBusca &&
              correspondePais &&
              correspondeEstado &&
              correspondeCidade
            );

          }
        );


      renderizarModelos(
        filtrados
      );

    }


    /* =========================================================
       EVENTOS
       ========================================================= */

    function configurarFiltros() {

      const busca =
        document.getElementById(
          "filtroBusca"
        );

      const pais =
        document.getElementById(
          "filtroPais"
        );

      const estado =
        document.getElementById(
          "filtroEstado"
        );

      const cidade =
        document.getElementById(
          "filtroCidade"
        );


      if (busca) {

        busca.addEventListener(
          "input",
          aplicarFiltros
        );

      }


      if (pais) {

        pais.addEventListener(
          "change",
          () => {

            atualizarFiltros();

            aplicarFiltros();

          }
        );

      }


      if (estado) {

        estado.addEventListener(
          "change",
          () => {

            atualizarFiltros();

            aplicarFiltros();

          }
        );

      }


      if (cidade) {

        cidade.addEventListener(
          "change",
          aplicarFiltros
        );

      }

    }


    /* =========================================================
       CARD
       ========================================================= */

    function criarCard(modelo) {

      const nome =
        escapeHTML(
          modelo.nome_exibicao ||
          modelo.apelido ||
          "Modelo"
        );


      const foto =
        modelo.foto_url
          ? escapeHTML(
              modelo.foto_url
            )
          : "";


      const localizacao =
        escapeHTML(
          textoLocalizacao(
            modelo
          )
        );


      const selo =
        escapeHTML(
          obterSelo(
            modelo
          )
        );


      const estrelas =
        Number(
          modelo.estrelas_total || 0
        );


      const modeloId =
        escapeHTML(
          modelo.id
        );


      const whatsapp =
        gerarWhatsApp(
          modelo
        );


      const idade =
        Number(
          modelo.idade || 0
        );


      const plano =
        escapeHTML(
          modelo.plano_nome ||
          modelo.plano_codigo ||
          modelo.plano ||
          "LUX-ESSENCE"
        );


      const categoria =
        escapeHTML(
          modelo.categoria_catalogo ||
          "LUX-ADVANCE"
        );


      return `

        <article
          class="lux-model-card"
          data-modelo-id="${modeloId}"
        >

          <div class="lux-photo-wrap">

            ${
              foto

              ?

              `
                <img
                  class="lux-model-photo"
                  src="${foto}"
                  alt="${nome}"
                  loading="lazy"
                  onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                >

                <div
                  class="lux-photo-fallback"
                  style="display:none;"
                >
                  LUX
                </div>
              `

              :

              `
                <div class="lux-photo-fallback">
                  LUX
                </div>
              `
            }


            <div
              class="lux-selo-manto"
              aria-label="Selo ${selo}"
            >
              ✦ LUX-ADVANCE ${selo}
            </div>

          </div>


          <div class="lux-card-body">

            <div class="lux-card-top">

              <span class="lux-plan">
                ${plano}
              </span>

              <span
                class="lux-verified"
                title="Perfil disponível na LUX"
              >
                ✦ VERIFICADA
              </span>

            </div>


            <h2 class="lux-model-name">
              ${nome}
            </h2>


            ${
              idade >= 18

              ?

              `
                <p class="lux-location">

                  <span class="lux-location-icon">
                    ♢
                  </span>

                  ${idade} anos

                </p>
              `

              :

              ""
            }


            <p class="lux-location">

              <span class="lux-location-icon">
                ◉
              </span>

              ${localizacao}

            </p>


            <p
              class="lux-location"
              style="margin-top:5px;"
            >

              <span class="lux-location-icon">
                ✦
              </span>

              ${categoria}

            </p>


            <div class="lux-stars">

              <div class="lux-stars-count">

                ⭐

                <strong>
                  ${estrelas}
                </strong>

                ${
                  estrelas === 1
                    ? " estrela recebida"
                    : " estrelas recebidas"
                }

              </div>


              <button
                type="button"
                class="lux-rate-button"
                data-rate-id="${modeloId}"
                onclick="avaliarModelo('${modeloId}')"
              >
                ⭐ DAR 1 ESTRELA
              </button>

            </div>


            <a
              class="lux-whatsapp"
              href="${whatsapp}"
              target="_blank"
              rel="noopener noreferrer"
            >

              <span>
                ☎
              </span>

              FALAR NO WHATSAPP

            </a>

          </div>

        </article>

      `;

    }


    /* =========================================================
       RENDERIZAÇÃO
       ========================================================= */

    function renderizarModelos(
      modelos
    ) {

      const lista =
        document.getElementById(
          "listaModelos"
        );

      const info =
        document.getElementById(
          "resultadoInfo"
        );


      if (!lista) return;


      if (info) {

        info.innerHTML =
          `<strong>${modelos.length}</strong> ` +
          (
            modelos.length === 1
              ? "modelo encontrada"
              : "modelos encontrados"
          );

      }


      if (!modelos.length) {

        lista.innerHTML = `

          <div class="lux-status-box">

            <div class="lux-status-icon">
              ◇
            </div>

            <div class="lux-status-title">
              Nenhum perfil encontrado
            </div>

            <div class="lux-status-text">
              Tente alterar os filtros ou a pesquisa.
            </div>

          </div>

        `;

        return;

      }


      lista.innerHTML =
        modelos
          .map(
            modelo =>
              criarCard(
                modelo
              )
          )
          .join("");

    }


    /* =========================================================
       CARREGAMENTO DOS MODELOS
       ========================================================= */

    async function carregarModelos() {

      const lista =
        document.getElementById(
          "listaModelos"
        );

      const info =
        document.getElementById(
          "resultadoInfo"
        );


      try {

        esconderMensagem();


        if (!window.luxSupabase) {

          throw new Error(
            "Supabase não foi inicializado."
          );

        }


        /*
         * IMPORTANTE:
         *
         * Não usamos mais .in("verificacao_status", ...)
         * diretamente na consulta.
         *
         * Primeiro buscamos os perfis permitidos pelo
         * Supabase. Depois verificamos o status aqui.
         *
         * Isso mantém o sistema mais tolerante a pequenas
         * diferenças no valor salvo no campo.
         */

        const {
          data,
          error
        } =
          await window.luxSupabase
            .from("modelo_perfis")
            .select("*");


        if (error) {

          console.error(
            "[LUX SUPABASE]",
            error
          );

          throw error;

        }


        /*
         * Aceita os status utilizados pelo sistema.
         */

        const statusPermitidos = [
          "aprovado",
          "aprovada",
          "verificada",
          "verificado"
        ];


        todosModelos =
          (Array.isArray(data)
            ? data
            : []
          ).filter(
            modelo => {

              const status =
                textoNormalizado(
                  modelo.verificacao_status
                );

              return statusPermitidos.includes(
                status
              );

            }
          );


        /*
         * Ordena primeiro pelas modelos
         * com mais estrelas.
         */

        todosModelos.sort(
          (a, b) => {

            const estrelasA =
              Number(
                a.estrelas_total || 0
              );

            const estrelasB =
              Number(
                b.estrelas_total || 0
              );


            if (
              estrelasA !==
              estrelasB
            ) {

              return (
                estrelasB -
                estrelasA
              );

            }


            return String(
              a.nome_exibicao ||
              a.apelido ||
              ""
            ).localeCompare(
              String(
                b.nome_exibicao ||
                b.apelido ||
                ""
              ),
              "pt-BR"
            );

          }
        );


        /*
         * Nenhum modelo aprovado/verificado.
         */

        if (!todosModelos.length) {

          lista.innerHTML = `

            <div class="lux-status-box">

              <div class="lux-status-icon">
                ◇
              </div>

              <div class="lux-status-title">
                Nenhum modelo disponível
              </div>

              <div class="lux-status-text">
                Ainda não existem modelos aprovados
                ou verificados disponíveis para os usuários.
              </div>

            </div>

          `;


          if (info) {

            info.textContent =
              "0 modelos encontrados";

          }


          return;

        }


        /*
         * Monta os filtros com os modelos
         * encontrados.
         */

        preencherFiltrosIniciais();


        /*
         * Mostra os modelos para o usuário.
         */

        renderizarModelos(
          todosModelos
        );


      } catch (erro) {

        console.error(
          "[LUX MODELOS]",
          erro
        );


        mostrarMensagem(
          "Não foi possível carregar os modelos. Verifique a conexão com o Supabase.",
          true
        );


        if (info) {

          info.textContent =
            "Não foi possível carregar os modelos.";

        }


        lista.innerHTML = `

          <div class="lux-status-box">

            <div class="lux-status-icon">
              !
            </div>

            <div class="lux-status-title">
              Não foi possível carregar
            </div>

            <div class="lux-status-text">
              O sistema não conseguiu consultar
              os modelos neste momento.
            </div>

          </div>

        `;

      }

    }


    /* =========================================================
       AVALIAÇÃO — 1 ESTRELA POR USUÁRIO
       ========================================================= */

    async function avaliarModelo(
      modeloId
    ) {

      const botao =
        document.querySelector(
          `[data-rate-id="${modeloId}"]`
        );


      try {

        if (botao) {
          botao.disabled = true;
        }


        const usuario =
          await obterUsuarioAtual();


        if (!usuario) {

          alert(
            "Sua sessão não foi encontrada. Entre novamente na sua área para avaliar."
          );

          window.location.href =
            "login.html";

          return;

        }


        const modelo =
          todosModelos.find(
            item =>
              String(item.id) ===
              String(modeloId)
          );


        if (!modelo) {

          throw new Error(
            "Modelo não encontrada."
          );

        }


        const status =
          textoNormalizado(
            modelo.verificacao_status
          );


        if (
          ![
            "verificada",
            "verificado",
            "aprovado",
            "aprovada"
          ].includes(status)
        ) {

          alert(
            "Esta modelo ainda não está disponível para receber avaliações."
          );

          return;

        }


        const {
          data: avaliacaoExistente,
          error: erroConsulta
        } =
          await window.luxSupabase
            .from(
              "avaliacoes_modelos"
            )
            .select("id")
            .eq(
              "modelo_id",
              modeloId
            )
            .eq(
              "usuario_id",
              usuario.id
            )
            .maybeSingle();


        if (erroConsulta) {
          throw erroConsulta;
        }


        if (avaliacaoExistente) {

          alert(
            "Você já deu sua estrela para esta modelo."
          );

          return;

        }


        const {
          error: erroInsert
        } =
          await window.luxSupabase
            .from(
              "avaliacoes_modelos"
            )
            .insert({

              modelo_id:
                modeloId,

              usuario_id:
                usuario.id,

              valor: 1

            });


        if (erroInsert) {

          if (
            erroInsert.code ===
            "23505"
          ) {

            alert(
              "Você já deu sua estrela para esta modelo."
            );

            return;

          }

          throw erroInsert;

        }


        alert(
          "Sua estrela foi registrada com sucesso. ⭐"
        );


        const modeloLocal =
          todosModelos.find(
            item =>
              String(item.id) ===
              String(modeloId)
          );


        if (modeloLocal) {

          modeloLocal.estrelas_total =
            Number(
              modeloLocal.estrelas_total || 0
            ) + 1;

        }


        aplicarFiltros();


      } catch (erro) {

        console.error(
          "[LUX AVALIAÇÃO]",
          erro
        );


        alert(
          "Não foi possível registrar sua estrela. Tente novamente."
        );


      } finally {

        if (botao) {
          botao.disabled = false;
        }

      }

    }


    /* =========================================================
       INICIALIZAÇÃO
       ========================================================= */

    async function iniciarPagina() {

      configurarFiltros();

      await carregarModelos();

    }


    document.addEventListener(
      "DOMContentLoaded",
      iniciarPagina
    );

  </script>
