<style>

/* =========================================================
   LUX ADVANCE — HALLOWEEN
========================================================= */

:root{
  --lux-gold:#f8d58a;
  --lux-pink:#ff4da6;
  --lux-bg:#080509;
  --lux-card:#110b10;
  --lux-text:#f7f2f4;
  --lux-muted:#b9afb4;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(255,77,166,.10),
      transparent 35%
    ),
    radial-gradient(
      circle at 100% 50%,
      rgba(248,213,138,.07),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #050305,
      #0b0608 45%,
      #050305
    );

}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.12;
  background:
    radial-gradient(
      circle at 15% 20%,

      transparent 2px

      circle at 80% 70%,
      #f8d58a 0 1px,
      transparent 2px

  z-index:0;
}

.topbar,
.container,
.footer{
  position:relative;

}


/* =========================================================
   CABEÇALHO
========================================================= */

.topbar{

.brand{

}


/* =========================================================
   BOTÃO MINHA ÁREA
========================================================= */

.btn-voltar-area{

========================================================= */

/* =========================================================

/* =========================================================

/* =========================================================

/* =========================================================

<script>

/* =========================================================
   VARIÁVEIS
========================================================= */

let modelosLUX = [];

let categoriaAtual = "todos";


/* =========================================================
   SEGURANÇA HTML
========================================================= */

function escapeHTML(valor){

  return String(valor ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   CATEGORIA
========================================================= */

function normalizarCategoria(valor){

  const texto =
    String(valor || "")
      .toLowerCase()
      .trim()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"");


  if(
    texto.includes("lgbt") ||
    texto.includes("gay") ||
    texto.includes("trans") ||
    texto.includes("queer")
  ){

    return "lgbtq";

  }


  if(
    texto.includes("mascul") ||
    texto === "homem"
  ){

    return "masculino";

  }


  if(
    texto.includes("feminin") ||
    texto === "mulher"
  ){

    return "feminino";

  }


  return texto || "feminino";

}


/* =========================================================
   PLANO
========================================================= */

function obterPlano(modelo){

  const plano =
    String(
      modelo.plano ||
      modelo.plano_atual ||
      modelo.nome_plano ||
      modelo.assinatura ||
      modelo.plano_codigo ||
      modelo.selo_codigo ||
      "ESSENCE"
    )
    .toLowerCase()
    .trim();


  if(plano.includes("diamond"))
    return "DIAMOND";


  if(plano.includes("royal"))
    return "ROYAL";


  if(plano.includes("elite"))
    return "ELITE";


  if(plano.includes("desfire"))
    return "DESFIRE";


  return "ESSENCE";

}


/* =========================================================
   WHATSAPP
========================================================= */

function numeroWhatsApp(valor){

  return String(valor || "")
    .replace(/\D/g,"");

}


function chamarModelo(modelo){

  const numero =
    numeroWhatsApp(

      modelo.whatsapp ||

      modelo.telefone ||

      modelo.celular

    );


  if(!numero){

    alert(
      "Esta modelo ainda não possui um número de WhatsApp disponível."
    );

    return;

  }


  const mensagem =
    "Olá! Encontrei seu perfil na LUX e gostaria de falar com você.";


  const url =
    "https://wa.me/" +
    numero +
    "?text=" +
    encodeURIComponent(
      mensagem
    );


  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =========================================================
   USUÁRIO LOGADO
========================================================= */

async function obterUsuario(){

  try{

    if(!window.luxSupabase){

      return null;

    }


    const resposta =
      await window.luxSupabase
        .auth
        .getUser();


    if(resposta.error){

      console.error(
        "[LUX USUÁRIO]",
        resposta.error
      );

      return null;

    }


    return
      resposta.data?.user ||
      null;

  }
  catch(erro){

    console.error(
      "[LUX USUÁRIO]",
      erro
    );

    return null;

  }

}


/* =========================================================
   AVALIAÇÃO
   1 ESTRELINHA POR USUÁRIO / MODELO
========================================================= */

async function avaliarModelo(
  modeloId
){

  const usuario =
    await obterUsuario();


  if(!usuario){

    alert(
      "Sua sessão não foi encontrada. Entre novamente na sua área para avaliar."
    );

    return;

  }


  try{

    /*
     * Verifica se o usuário
     * já avaliou esta modelo.
     */

    const {
      data:existente,
      error:erroBusca
    } =
      await window.luxSupabase

        .from("avaliacoes_modelos")

        .select("id")

        .eq(
          "modelo_id",
          modeloId
        )

        .eq(
          "usuario_id",
          usuario.id
        )

        .maybeSingle();


    if(erroBusca){

      throw erroBusca;

    }


    if(existente){

      alert(
        "Você já avaliou este perfil. Cada usuário pode dar uma avaliação por modelo."
      );

      return;

    }


    /*
     * A tabela do seu sistema
     * usa valor = 1.
     */

    const {
      error
    } =
      await window.luxSupabase

        .from("avaliacoes_modelos")

        .insert({

          modelo_id:
            modeloId,

          usuario_id:
            usuario.id,

          valor:
            1

        });


    if(error){

      console.error(
        "[LUX AVALIAÇÃO]",
        error
      );

      throw error;

    }


    /*
     * Recarrega os modelos para
     * atualizar a quantidade.
     */

    await carregarModelos();


    alert(
      "Sua avaliação foi registrada com sucesso. ⭐"
    );


  }
  catch(erro){

    console.error(
      "[LUX AVALIAÇÃO]",
      erro
    );


    alert(
      erro?.message ||
      "Não foi possível registrar sua avaliação."
    );

  }

}


/* =========================================================
   ESTRELA
========================================================= */

function htmlEstrelas(modelo){

  const total =
    Number(
      modelo.estrelas_total ||
      modelo.avaliacoes_total ||
      0
    );


  return `

    <div class="estrelas">

      <button
        type="button"
        class="estrela ativa"
        data-avaliar-id="${escapeHTML(modelo.id)}"
        aria-label="Avaliar modelo com uma estrela"
        title="Avaliar com 1 estrela"
      >
        ★
      </button>

    </div>


    <div class="nota-info">

      ${
        total > 0

        ? total +
          (
            total === 1
              ? " avaliação"
              : " avaliações"
          )

        : "Ainda não avaliada"
      }

      • 1 estrelinha por usuário

    </div>

  `;

}


/* =========================================================
   RENDER
========================================================= */

function renderModelos(){

  const lista =
    document.getElementById(
      "listaModelos"
    );


  const contador =
    document.getElementById(
      "contadorModelos"
    );


  const paisFiltro =
    document.getElementById(
      "filtroPais"
    )?.value || "";


  const estadoFiltro =
    document.getElementById(
      "filtroEstado"
    )?.value || "";


  const cidadeFiltro =
    document.getElementById(
      "filtroCidade"
    )?.value || "";


  const filtrados =
    modelosLUX.filter(
      modelo => {


        /*
         * CATEGORIA
         */

        if(
          categoriaAtual !==
          "todos"
        ){

          if(
            normalizarCategoria(
              modelo.categoria_catalogo
            ) !==
            categoriaAtual
          ){

            return false;

          }

        }


        /*
         * LOCALIZAÇÃO
         */

        const paisModelo =
          String(
            modelo.pais ||
            "Brasil"
          ).trim();


        const estadoModelo =
          String(
            modelo.estado ||
            ""
          ).trim();


        const cidadeModelo =
          String(
            modelo.cidade ||
            ""
          ).trim();


        if(
          paisFiltro &&
          paisModelo.toLowerCase() !==
          paisFiltro.toLowerCase()
        ){

          return false;

        }


        if(
          estadoFiltro &&
          estadoModelo.toLowerCase() !==
          estadoFiltro.toLowerCase()
        ){

          return false;

        }


        if(
          cidadeFiltro &&
          cidadeModelo.toLowerCase() !==
          cidadeFiltro.toLowerCase()
        ){

          return false;

        }


        return true;

      }
    );


  contador.textContent =
    filtrados.length +
    (
      filtrados.length === 1
        ? " MODELO DISPONÍVEL"
        : " MODELOS DISPONÍVEIS"
    );


  if(!filtrados.length){

    lista.innerHTML = `

      <div
        class="mensagem-vazia"
      >

        Nenhum modelo aprovado
        encontrado com os filtros selecionados.

      </div>

    `;

    return;

  }


  lista.innerHTML =
    filtrados.map(
      modelo => {


        const nome =
          escapeHTML(
            modelo.nome_exibicao ||
            "Modelo"
          );


        const cidade =
          escapeHTML(
            modelo.cidade ||
            "Disponível na LUX"
          );


        const estado =
          escapeHTML(
            modelo.estado ||
            ""
          );


        const pais =
          escapeHTML(
            modelo.pais ||
            "Brasil"
          );


        const foto =
          modelo.foto_url ||
          "";


        const plano =
          obterPlano(
            modelo
          );


        const categoria =
          normalizarCategoria(
            modelo.categoria_catalogo
          );


        const numero =
          numeroWhatsApp(

            modelo.whatsapp ||

            modelo.telefone ||

            modelo.celular

          );


        const classePlano =
          "plano-" +
          plano.toLowerCase();


        let iconePlano =
          "✦";


        if(
          plano === "DESFIRE"
        ){

          iconePlano =
            "🔥";

        }


        if(
          plano === "ELITE"
        ){

          iconePlano =
            "♛";

        }


        if(
          plano === "ROYAL"
        ){

          iconePlano =
            "♕";

        }


        if(
          plano === "DIAMOND"
        ){

          iconePlano =
            "💎";

        }


        const fotoHTML =
          foto

          ? `

            <img
              class="modelo-foto"
              src="${escapeHTML(foto)}"
              alt="${nome}"
              loading="lazy"
            >

          `

          : `

            <div
              class="modelo-sem-foto"
            >
              LUX
            </div>

          `;


        const whatsappHTML =
          numero

          ? `

            <button
              type="button"
              class="btn-chamar-modelo"
              data-whatsapp-id="${escapeHTML(modelo.id)}"
            >
              📱 CHAMAR NO WHATSAPP
            </button>

          `

          : `

            <div
              class="btn-chamar-modelo indisponivel"
            >
              WhatsApp indisponível
            </div>

          `;


        return `

          <article
            class="
              modelo-card
              ${classePlano}
            "
          >


            <div
              class="modelo-foto-area"
            >


              <div
                class="plano-topo"
              >

                <span
                  class="plano-nome"
                >

                  ${iconePlano}

                  LUX ${plano}

                </span>


                <span
                  class="plano-icone"
                >
                  🎃
                </span>

              </div>


              ${fotoHTML}


              <div
                class="modelo-status"
              >
                ✓ PERFIL APROVADO
              </div>


            </div>


            <div
              class="modelo-conteudo"
            >


              <div
                class="modelo-etiquetas"
              >

                <span
                  class="modelo-etiqueta"
                >

                  ${
                    categoria ===
                    "feminino"

                    ? "♀ FEMININA"

                    : categoria ===
                    "masculino"

                    ? "♂ MASCULINO"

                    : "♡ LGBTQ+"
                  }

                </span>


                <span
                  class="modelo-etiqueta"
                >

                  LUX ${plano}

                </span>

              </div>


              <h2
                class="modelo-nome"
              >
                ${nome}
              </h2>


              <p
                class="modelo-local"
              >

                📍 ${cidade}

                ${
                  estado
                    ? " • " + estado
                    : ""
                }

                ${
                  pais
                    ? " • " + pais
                    : ""
                }

              </p>


              <div
                class="avaliacao"
              >

                <div
                  class="avaliacao-titulo"
                >

                  <span>
                    AVALIE ESTE PERFIL
                  </span>


                  <span>
                    ⭐
                    ${Number(
                      modelo.estrelas_total ||
                      modelo.avaliacoes_total ||
                      0
                    )}
                  </span>

                </div>


                ${htmlEstrelas(modelo)}

              </div>


              <div
                class="modelo-acoes"
              >

                ${whatsappHTML}

              </div>


            </div>


          </article>

        `;

      }
    ).join("");


  /*
   * WHATSAPP
   */

  lista
    .querySelectorAll(
      "[data-whatsapp-id]"
    )
    .forEach(
      botao => {

        botao.addEventListener(
          "click",
          () => {


            const modelo =
              modelosLUX.find(
                item =>
                  String(item.id) ===
                  String(
                    botao.dataset
                      .whatsappId
                  )
              );


            if(modelo){

              chamarModelo(
                modelo
              );

            }

          }
        );

      }
    );


  /*
   * AVALIAÇÃO
   */

  lista
    .querySelectorAll(
      "[data-avaliar-id]"
    )
    .forEach(
      botao => {

        botao.addEventListener(
          "click",
          () => {

            avaliarModelo(
              botao.dataset
                .avaliarId
            );

          }
        );

      }
    );

}


/* =========================================================
   FILTROS DE LOCALIZAÇÃO
========================================================= */

function preencherFiltrosLocalizacao(){

  const paisSelect =
    document.getElementById(
      "filtroPais"
    );


  const estadoSelect =
    document.getElementById(
      "filtroEstado"
    );


  const cidadeSelect =
    document.getElementById(
      "filtroCidade"
    );


  if(
    !paisSelect ||
    !estadoSelect ||
    !cidadeSelect
  ){

    return;

  }


  const valorAtualPais =
    paisSelect.value;


  const valorAtualEstado =
    estadoSelect.value;


  const valorAtualCidade =
    cidadeSelect.value;


  /*
   * PAÍSES
   */

  const paises =
    [
      ...new Set(

        modelosLUX

          .map(
            modelo =>
              String(
                modelo.pais ||
                "Brasil"
              ).trim()
          )

          .filter(Boolean)

      )
    ]
    .sort(
      (a,b) =>
        a.localeCompare(
          b,
          "pt-BR"
        )
    );


  /*
   * ESTADOS
   */

  const estados =
    [
      ...new Set(

        modelosLUX

          .filter(
            modelo => {

              if(!valorAtualPais){

                return true;

              }


              return (

                String(
                  modelo.pais ||
                  "Brasil"
                )
                .trim()
                .toLowerCase()

                ===

                valorAtualPais
                  .toLowerCase()

              );

            }
          )

          .map(
            modelo =>
              String(
                modelo.estado ||
                ""
              ).trim()
          )

          .filter(Boolean)

      )
    ]
    .sort(
      (a,b) =>
        a.localeCompare(
          b,
          "pt-BR"
        )
    );


  /*
   * CIDADES
   */

  const cidades =
    [
      ...new Set(

        modelosLUX

          .filter(
            modelo => {

              const paisOk =
                !valorAtualPais ||

                String(
                  modelo.pais ||
                  "Brasil"
                )
                .trim()
                .toLowerCase()

                ===

                valorAtualPais
                  .toLowerCase();


              const estadoOk =
                !valorAtualEstado ||

                String(
                  modelo.estado ||
                  ""
                )
                .trim()
                .toLowerCase()

                ===

                valorAtualEstado
                  .toLowerCase();


              return (
                paisOk &&
                estadoOk
              );

            }
          )

          .map(
            modelo =>
              String(
                modelo.cidade ||
                ""
              ).trim()
          )

          .filter(Boolean)

      )
    ]
    .sort(
      (a,b) =>
        a.localeCompare(
          b,
          "pt-BR"
        )
    );


  /*
   * MONTA PAÍSES
   */

  paisSelect.innerHTML =
    `
      <option value="">
        🌎 TODOS OS PAÍSES
      </option>
    `

    +

    paises
      .map(
        valor => `

          <option
            value="${escapeHTML(valor)}"
          >
            ${escapeHTML(valor)}
          </option>

        `
      )
      .join("");


  /*
   * MONTA ESTADOS
   */

  estadoSelect.innerHTML =
    `
      <option value="">
        📍 TODOS OS ESTADOS
      </option>
    `

    +

    estados
      .map(
        valor => `

          <option
            value="${escapeHTML(valor)}"
          >
            ${escapeHTML(valor)}
          </option>

        `
      )
      .join("");


  /*
   * MONTA CIDADES
   */

  cidadeSelect.innerHTML =
    `
      <option value="">
        🏙️ TODAS AS CIDADES
      </option>
    `

    +

    cidades
      .map(
        valor => `

          <option
            value="${escapeHTML(valor)}"
          >
            ${escapeHTML(valor)}
          </option>

        `
      )
      .join("");


  /*
   * RESTAURA SELEÇÕES
   */

  if(
    paises.includes(
      valorAtualPais
    )
  ){

    paisSelect.value =
      valorAtualPais;

  }


  if(
    estados.includes(
      valorAtualEstado
    )
  ){

    estadoSelect.value =
      valorAtualEstado;

  }


  if(
    cidades.includes(
      valorAtualCidade
    )
  ){

    cidadeSelect.value =
      valorAtualCidade;

  }

}


/* =========================================================
   EVENTOS DOS FILTROS
========================================================= */

function instalarFiltrosLocalizacao(){

  [
    "filtroPais",
    "filtroEstado",
    "filtroCidade"

  ]
  .forEach(
    id => {

      const elemento =
        document.getElementById(
          id
        );


      if(!elemento){

        return;

      }


      elemento.addEventListener(
        "change",
        () => {

          preencherFiltrosLocalizacao();

          renderModelos();

        }
      );

    }
  );

}


/* =========================================================
   CARREGAR MODELOS
========================================================= */

async function carregarModelos(){

  const lista =
    document.getElementById(
      "listaModelos"
    );


  try{

    if(!window.luxSupabase){

      throw new Error(
        "Supabase não foi inicializado."
      );

    }


    const {
      data,
      error
    } =
      await window.luxSupabase

        .from(
          "modelo_perfis"
        )

        .select("*")

        .in(
          "verificacao_status",
          [
            "aprovado",
            "verificada"
          ]
        );


    if(error){

      throw error;

    }


    modelosLUX =
      data || [];


    preencherFiltrosLocalizacao();


    renderModelos();


  }
  catch(erro){

    console.error(
      "[LUX MODELOS]",
      erro
    );


    lista.innerHTML = `

      <div
        class="mensagem-vazia"
      >

        Não foi possível carregar
        os modelos aprovados.

      </div>

    `;


    document
      .getElementById(
        "contadorModelos"
      )
      .textContent =
        "ERRO AO CARREGAR MODELOS";

  }

}


/* =========================================================
   CATEGORIAS
========================================================= */

document
  .querySelectorAll(
    ".categoria-btn"
  )
  .forEach(
    botao => {

      botao.addEventListener(
        "click",
        () => {


          document
            .querySelectorAll(
              ".categoria-btn"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "ativo"
                )
            );


          botao.classList.add(
            "ativo"
          );


          categoriaAtual =
            botao.dataset.categoria;


          renderModelos();

        }
      );

    }
  );


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

instalarFiltrosLocalizacao();

carregarModelos();

</script>
