<style>

/* =========================================================
   LUX ADVANCE — HALLOWEEN
========================================================= */

:root{
  --lux-gold:#f8d58a;
  --lux-pink:#ff4da6;
  --lux-bg:#080509;
  --lux-card:#110b10;
  --lux-text:#f7f2f4;
  --lux-muted:#b9afb4;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(255,77,166,.10),
      transparent 35%
    ),
    radial-gradient(
      circle at 100% 50%,
      rgba(248,213,138,.07),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #050305,
      #0b0608 45%,
      #050305
    );
  color:var(--lux-text);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.12;
  background:
    radial-gradient(
      circle at 15% 20%,
      #ff4da6 0 1px,
      transparent 2px
    ),
    radial-gradient(
      circle at 80% 70%,
      #f8d58a 0 1px,
      transparent 2px
    );
  background-size:120px 120px,180px 180px;
  z-index:0;
}

.topbar,
.container,
.footer{
  position:relative;
  z-index:1;
}


/* =========================================================
   CABEÇALHO
========================================================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:16px 18px;
  border-bottom:1px solid rgba(248,213,138,.10);
  background:rgba(5,3,5,.78);
  backdrop-filter:blur(14px);
}

.brand{
  font-family:
    "Playfair Display",
    Georgia,
    serif;
  font-size:31px;
  font-weight:700;
  letter-spacing:6px;
  text-decoration:none;
  color:var(--lux-gold);
}


/* =========================================================
   BOTÃO VOLTAR
========================================================= */

.btn-voltar-area{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:42px;
  padding:0 16px;
  border-radius:13px;
  border:1px solid rgba(248,213,138,.24);
  background:
    linear-gradient(
      145deg,
      rgba(248,213,138,.10),
      rgba(255,255,255,.025)
    );
  color:#f8d58a;
  text-decoration:none;
  font-size:10px;
  font-weight:900;
  letter-spacing:.8px;
  box-shadow:
    0 8px 25px rgba(0,0,0,.25);
  transition:.22s ease;
}

.btn-voltar-area:hover{
  transform:translateY(-2px);
  border-color:rgba(248,213,138,.55);
  background:
    linear-gradient(
      145deg,
      rgba(248,213,138,.18),
      rgba(255,255,255,.04)
    );
}


/* =========================================================
   HERO
========================================================= */

.hero{
  text-align:center;
  max-width:850px;
  margin:0 auto 25px;
  padding:30px 12px 10px;
}

.hero .eyebrow{
  color:var(--lux-gold);
  font-size:11px;
  font-weight:800;
  letter-spacing:4px;
  margin-bottom:13px;
}

.hero .title{
  font-family:
    "Playfair Display",
    Georgia,
    serif;
  font-size:
    clamp(40px,8vw,68px);
  line-height:1;
  margin:0 0 16px;
}

.hero .subtitle{
  max-width:650px;
  margin:auto;
  color:var(--lux-muted);
  line-height:1.7;
}


/* =========================================================
   CATEGORIAS
========================================================= */

.seletor-categorias{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:10px;
  max-width:900px;
  margin:15px auto 32px;
}

.categoria-btn{
  min-height:52px;
  border-radius:15px;
  border:1px solid rgba(248,213,138,.16);
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );
  color:#cfc5ca;
  font-weight:800;
  font-size:11px;
  letter-spacing:.8px;
  cursor:pointer;
  transition:.22s ease;
}

.categoria-btn:hover{
  border-color:rgba(248,213,138,.4);
  transform:translateY(-2px);
}

.categoria-btn.ativo{

  background:
    linear-gradient(
      135deg,

}


/* =========================================================
   CONTADOR
========================================================= */

.contador-modelos{
  text-align:center;
  color:#8f858a;
  font-size:11px;
  letter-spacing:1px;
  margin:-15px 0 22px;
}


/* =========================================================
   CARD
========================================================= */

.modelo-card{

.modelo-card:hover{

/* =========================================================

========================================================= */

}

.plano-essence .plano-topo{

.plano-desfire .plano-nome{

}


.plano-elite{
  border-color:rgba(248,213,138,.34);
  box-shadow:
    0 18px 55px
    rgba(248,213,138,.10);
}

.plano-elite .plano-topo{
  background:
    linear-gradient(
      135deg,
      #352716,

}

.plano-elite .plano-nome{
  color:#f8d58a;

.plano-royal{

  box-shadow:

}

.plano-royal .plano-topo{

.plano-royal .plano-nome{

}


/* DIAMOND */

.plano-diamond{
  border-color:
    rgba(126,224,255,.48);
  box-shadow:
    0 18px 65px
    rgba(74,190,255,.13);
}

.plano-diamond .plano-topo{
  background:
    linear-gradient(

      #102b36,
      #071116 55%,

    );
}

.plano-diamond .plano-nome{
  color:#9eeaff;
  text-shadow:
    0 0 14px
    rgba(126,224,255,.25);
}


/* =========================================================
   FOTO
========================================================= */

.modelo-foto-area{
  position:relative;
  width:100%;
  aspect-ratio:4/4.7;
  overflow:hidden;
  background:#0b070a;
}

.modelo-foto{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:transform .4s ease;
}

.modelo-card:hover

}

.modelo-sem-foto{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--lux-gold);
  font-family:Georgia,serif;
  font-size:34px;
  letter-spacing:6px;
  background:
    radial-gradient(
      circle,
      rgba(248,213,138,.10),
      transparent 55%
    ),
    #090609;
}


/* =========================================================
   PLANO TOPO
========================================================= */

.plano-topo{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:2;
  padding:10px 13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(8px);
}

.plano-nome{
  font-size:10px;
  font-weight:900;
  letter-spacing:1.4px;
}

.plano-icone{

}


/* =========================================================
   STATUS
========================================================= */

.modelo-status{
  position:absolute;
  left:13px;
  bottom:13px;
  padding:7px 10px;
  border-radius:999px;
  background:rgba(5,3,5,.82);
  border:1px solid rgba(248,213,138,.20);
  color:#f8d58a;
  font-size:9px;
  font-weight:800;
  letter-spacing:1px;
}


/* =========================================================
   CONTEÚDO
========================================================= */

.modelo-conteudo{
  display:flex;
  flex-direction:column;
  flex:1;
  padding:18px;
}

.modelo-etiquetas{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:11px;
}

.modelo-etiqueta{
  padding:5px 8px;
  border-radius:999px;
  background:rgba(248,213,138,.06);

}

.modelo-nome{

    "Playfair Display",
    Georgia,

}

.modelo-local{

  color:#a69ca1;
  font-size:12px;
}


/* =========================================================
   AVALIAÇÕES
========================================================= */

.avaliacao{
  margin:4px 0 17px;

  border-top:1px solid rgba(255,255,255,.06);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.avaliacao-titulo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:7px;
  color:#91878c;
  font-size:10px;
  letter-spacing:.7px;
}

.estrelas{

}

.estrela{

  background:transparent;

.estrela:hover{

}

.estrela.ativa{

.nota-info{

/* =========================================================
   WHATSAPP
========================================================= */

.modelo-acoes{
  margin-top:auto;
}

.btn-chamar-modelo{
  width:100%;
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:0;
  border-radius:12px;
  background:
    linear-gradient(
      135deg,
      #f8d58a,
      #d6ab55
    );
  color:#160d10;
  font-weight:900;
  font-size:11px;
  letter-spacing:.8px;
  cursor:pointer;

.btn-chamar-modelo:hover{

.btn-chamar-modelo.indisponivel{

  border:1px solid rgba(255,255,255,.07);

}


/* =========================================================
   MENSAGEM
========================================================= */

.mensagem-vazia{
  width:100%;
  padding:50px 20px;
  text-align:center;
  border-radius:20px;
  border:1px solid rgba(248,213,138,.12);
  background:rgba(255,255,255,.025);
  color:#a69ca1;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .seletor-categorias{

  }

@media(max-width:520px){

  .topbar{

  }

  .seletor-categorias{
    grid-template-columns:1fr;
  }

  .hero .title{
    font-size:43px;
  }

}

</style>

</head>

<script>

let modelosLUX = [];

let categoriaAtual = "todos";


function escapeHTML(valor){

  return String(valor ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   CATEGORIA
========================================================= */

function normalizarCategoria(valor){

  const texto =
    String(valor || "")
      .toLowerCase()
      .trim()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"");


  if(
    texto.includes("lgbt") ||
    texto.includes("gay") ||
    texto.includes("trans") ||
    texto.includes("queer")
  ){
    return "lgbtq";
  }


  if(
    texto.includes("mascul") ||
    texto === "homem"
  ){
    return "masculino";
  }


  if(
    texto.includes("feminin") ||
    texto === "mulher"
  ){
    return "feminino";
  }


  return texto || "feminino";

}


/* =========================================================
   PLANO
========================================================= */

function obterPlano(modelo){

  const plano =
    String(
      modelo.plano ||
      modelo.plano_atual ||
      modelo.nome_plano ||
      modelo.assinatura ||
      modelo.plano_codigo ||
      modelo.selo_codigo ||
      "ESSENCE"
    )
    .toLowerCase()
    .trim();


  if(plano.includes("diamond"))
    return "DIAMOND";


  if(plano.includes("royal"))
    return "ROYAL";


  if(plano.includes("elite"))
    return "ELITE";


  if(plano.includes("desfire"))
    return "DESFIRE";


  return "ESSENCE";

}


/* =========================================================
   WHATSAPP
========================================================= */

function numeroWhatsApp(valor){

  return String(valor || "")
    .replace(/\D/g,"");

}


function chamarModelo(modelo){

  const numero =
    numeroWhatsApp(
      modelo.whatsapp
    );


  if(!numero)
    return;


  const mensagem =
    "Olá! Encontrei seu perfil na LUX e gostaria de falar com você.";


  const url =
    "https://wa.me/" +
    numero +
    "?text=" +
    encodeURIComponent(
      mensagem
    );


  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =========================================================
   USUÁRIO
========================================================= */

async function obterUsuario(){

  try{

    if(!window.luxSupabase)
      return null;


    const resposta =
      await window.luxSupabase
        .auth
        .getUser();


    if(resposta.error)
      return null;


    return
      resposta.data?.user ||
      null;

  }catch{

    return null;

  }

}


/* =========================================================
   AVALIAÇÃO
   UMA AVALIAÇÃO POR USUÁRIO / MODELO
========================================================= */

async function avaliarModelo(
  modeloId,
  nota
){

  const usuario =
    await obterUsuario();


  if(!usuario){

    alert(
      "Sua sessão não foi encontrada. Entre novamente na sua área para avaliar."
    );

    return;

  }


  if(
    nota < 1 ||
    nota > 5
  ){

    return;

  }


  try{

    /*
     * UPSERT:
     * se já existir avaliação,
     * altera a nota.
     * se não existir,
     * cria uma nova.
     */

    const {
      error
    } =
      await window.luxSupabase

        .from("avaliacoes")

        .upsert(
          {
            usuario_id:
              usuario.id,

            modelo_id:
              modeloId,

            estrelas:
              nota

          },
          {
            onConflict:
              "modelo_id,usuario_id"
          }
        );


    if(error){

      console.error(
        "[LUX AVALIAÇÃO]",
        error
      );


      alert(
        "O Supabase não permitiu registrar a avaliação.\n\n" +
        error.message
      );


      return;

    }


    /*
     * Recarrega a média verdadeira
     * depois da avaliação.
     */

    await carregarModelos();


    alert(
      "Sua avaliação foi registrada com sucesso. ⭐"
    );


  }catch(erro){

    console.error(
      "[LUX AVALIAÇÃO]",
      erro
    );


    alert(
      "Não foi possível registrar sua avaliação."
    );

  }

}


/* =========================================================
   ESTRELAS
========================================================= */

function htmlEstrelas(modelo){

  const media =
    Number(
      modelo.media_estrelas || 0
    );


  const total =
    Number(
      modelo.avaliacoes_total || 0
    );


  let estrelas = "";


  for(
    let i=1;
    i<=5;
    i++
  ){

    const ativa =
      i <= Math.round(media)
        ? "ativa"
        : "";


    estrelas += `

      <button
        type="button"
        class="estrela ${ativa}"
        data-avaliar-id="${escapeHTML(modelo.id)}"
        data-nota="${i}"
        aria-label="Dar ${i} estrelas"
      >
        ★
      </button>

    `;

  }


  return `

    <div class="estrelas">

      ${estrelas}

    </div>


    <div class="nota-info">

      ${
        total > 0
          ? media.toFixed(1) +
            " / 5 • " +
            total +
            (
              total === 1
                ? " avaliação"
                : " avaliações"
            )
          : "Ainda não avaliada"
      }

      • Toque para avaliar

    </div>

  `;

}


/* =========================================================
   RENDER
========================================================= */

function renderModelos(){

  const lista =
    document.getElementById(
      "listaModelos"
    );


  const contador =
    document.getElementById(
      "contadorModelos"
    );


  const filtrados =
    modelosLUX.filter(
      modelo => {

        if(
          categoriaAtual ===
          "todos"
        ){

          return true;

        }


        return (
          normalizarCategoria(
            modelo.categoria_catalogo
          ) ===
          categoriaAtual
        );

      }
    );


  contador.textContent =
    filtrados.length +
    (
      filtrados.length === 1
        ? " MODELO DISPONÍVEL"
        : " MODELOS DISPONÍVEIS"
    );


  if(!filtrados.length){

    lista.innerHTML = `

      <div
        class="mensagem-vazia"
      >

        Nenhum modelo aprovado
        encontrado nesta categoria.

      </div>

    `;

    return;

  }


  lista.innerHTML =
    filtrados.map(
      modelo => {

        const nome =
          escapeHTML(
            modelo.nome_exibicao ||
            "Modelo"
          );


        const cidade =
          escapeHTML(
            modelo.cidade ||
            "Disponível na LUX"
          );


        const foto =
          modelo.foto_url ||
          "";


        const plano =
          obterPlano(modelo);


        const categoria =
          normalizarCategoria(
            modelo.categoria_catalogo
          );


        const numero =
          numeroWhatsApp(
            modelo.whatsapp
          );


        const classePlano =
          "plano-" +
          plano.toLowerCase();


        let iconePlano = "✦";


        if(plano === "DESFIRE")
          iconePlano = "🔥";


        if(plano === "ELITE")
          iconePlano = "♛";


        if(plano === "ROYAL")
          iconePlano = "♕";


        if(plano === "DIAMOND")
          iconePlano = "💎";


        const fotoHTML =
          foto

          ? `

            <img
              class="modelo-foto"
              src="${escapeHTML(foto)}"
              alt="${nome}"
              loading="lazy"
            >

          `

          : `

            <div
              class="modelo-sem-foto"
            >
              LUX
            </div>

          `;


        const whatsappHTML =
          numero

          ? `

            <button
              type="button"
              class="btn-chamar-modelo"
              data-whatsapp-id="${escapeHTML(modelo.id)}"
            >
              📞 CHAMAR MODELO
            </button>

          `

          : `

            <div
              class="btn-chamar-modelo indisponivel"
            >
              WhatsApp indisponível
            </div>

          `;


        return `

          <article
            class="
              modelo-card
              ${classePlano}
            "
          >


            <div
              class="modelo-foto-area"
            >


              <div
                class="plano-topo"
              >

                <span
                  class="plano-nome"
                >
                  ${iconePlano}
                  LUX ${plano}
                </span>


                <span
                  class="plano-icone"
                >
                  🎃
                </span>

              </div>


              ${fotoHTML}


              <div
                class="modelo-status"
              >
                ✓ PERFIL APROVADO
              </div>


            </div>


            <div
              class="modelo-conteudo"
            >


              <div
                class="modelo-etiquetas"
              >

                <span
                  class="modelo-etiqueta"
                >

                  ${
                    categoria ===
                    "feminino"

                    ? "♀ FEMININA"

                    : categoria ===
                    "masculino"

                    ? "♂ MASCULINO"

                    : "♡ LGBTQ+"
                  }

                </span>


                <span
                  class="modelo-etiqueta"
                >

                  LUX ${plano}

                </span>

              </div>


              <h2
                class="modelo-nome"
              >
                ${nome}
              </h2>


              <p
                class="modelo-local"
              >
                📍 ${cidade}
              </p>


              <div
                class="avaliacao"
              >

                <div
                  class="avaliacao-titulo"
                >

                  <span>
                    AVALIE ESTE PERFIL
                  </span>


                  <span>
                    ⭐
                    ${Number(
                      modelo.media_estrelas || 0
                    ).toFixed(1)}
                  </span>

                </div>


                ${htmlEstrelas(modelo)}

              </div>


              <div
                class="modelo-acoes"
              >

                ${whatsappHTML}

              </div>


            </div>


          </article>

        `;

      }
    ).join("");


  /*
   * WhatsApp
   */

  lista
    .querySelectorAll(
      "[data-whatsapp-id]"
    )
    .forEach(
      botao => {

        botao.addEventListener(
          "click",
          () => {

            const modelo =
              modelosLUX.find(
                item =>
                  String(item.id) ===
                  String(
                    botao.dataset.whatsappId
                  )
              );


            if(modelo)
              chamarModelo(modelo);

          }
        );

      }
    );


  /*
   * Estrelas
   */

  lista
    .querySelectorAll(
      "[data-avaliar-id]"
    )
    .forEach(
      botao => {

        botao.addEventListener(
          "click",
          () => {

            avaliarModelo(

              botao.dataset.avaliarId,

              Number(
                botao.dataset.nota
              )

            );

          }
        );

      }
    );

}


/* =========================================================
   CARREGAR MODELOS
========================================================= */

async function carregarModelos(){

  const lista =
    document.getElementById(
      "listaModelos"
    );


  try{

    if(!window.luxSupabase){

      throw new Error(
        "Supabase não foi inicializado."
      );

    }


    const {
      data,
      error
    } =
      await window.luxSupabase

        .from("modelo_perfis")

        .select("*")

        .in(
          "verificacao_status",
          [
            "aprovado",
            "verificada"
          ]
        );


    if(error)
      throw error;


    modelosLUX =
      data || [];


    renderModelos();


  }catch(erro){

    console.error(
      "[LUX MODELOS]",
      erro
    );


    lista.innerHTML = `

      <div
        class="mensagem-vazia"
      >

        Não foi possível carregar
        os modelos aprovados.

      </div>

    `;


    document
      .getElementById(
        "contadorModelos"
      )
      .textContent =
        "ERRO AO CARREGAR MODELOS";

  }

}


/* =========================================================
   FILTROS
========================================================= */

document
  .querySelectorAll(
    ".categoria-btn"
  )
  .forEach(
    botao => {

      botao.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".categoria-btn"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "ativo"
                )
            );


          botao.classList.add(
            "ativo"
          );


          categoriaAtual =
            botao.dataset.categoria;


          renderModelos();

        }
      );

    }
  );


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

carregarModelos();

</script>
