<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUX — Modelos</title><link rel="stylesheet" href="css/app.css"></head><body><header class="topbar"><a class="brand" href="index.html">LUX</a><div class="actions"><a class="btn ghost" href="login.html">Entrar</a><a class="btn primary" href="index.html">Início</a></div></header><main class="container"><div class="hero"><div class="eyebrow">LUX Models</div><h1 class="title">Perfis em destaque</h1><p class="subtitle">Os perfis são ordenados pelo número de estrelas recebidas. Cada usuário pode dar uma estrela a cada perfil uma única vez.</p></div><div id="msg" class="notice" hidden></div><div id="grid" class="grid"><div class="empty">Carregando perfis...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script>
const grid=document.getElementById('grid'),msg=document.getElementById('msg');
function card(m){const foto=m.foto_url||'vip1.png';const ver=m.verificacao_status==='verificada'?'✓ Verificada':'';return `<article class="card"><img class="avatar" src="${escapeHTML(foto)}" alt="${escapeHTML(m.nome_exibicao)}"><div class="card-body"><span class="pill">${ver||'Perfil LUX'}</span><h2>${escapeHTML(m.nome_exibicao)}, ${m.idade}</h2><p class="subtitle">${escapeHTML(m.cidade||m.pais||'')}${m.descricao?' · '+escapeHTML(m.descricao.slice(0,120)):' '}</p><div class="actions"><span class="rating">★ ${m.estrelas_total||0} estrela(s)</span><button class="btn primary" data-id="${m.id}">+1 estrela</button></div></div></article>`}
async function carregar(){const db=requireClient();const {data,error}=await db.from('modelo_perfis').select('*').eq('verificacao_status','verificada').order('estrelas_total',{ascending:false}).order('atualizado_em',{ascending:false});if(error)throw error;grid.innerHTML=data?.length?data.map(card).join(''):'<div class="empty">Ainda não existem perfis publicados.</div>';grid.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>avaliar(b.dataset.id,b));}
async function avaliar(modelo_id,btn){try{const u=await usuarioAtual();if(!u){location.href='login.html';return}const p=await getPerfil(u.id);if(p.tipo!=='usuario')throw new Error('Somente contas de usuário podem avaliar.');btn.disabled=true;const db=requireClient();const {error}=await db.from('avaliacoes_modelos').insert({modelo_id,usuario_id:u.id,valor:1});if(error){if(error.code==='23505')throw new Error('Você já deu sua estrela para este perfil.');throw error;}msg.hidden=false;msg.className='notice success';msg.textContent='Estrela registrada com sucesso.';await carregar();}catch(e){msg.hidden=false;msg.className='notice error';msg.textContent=e.message||'Não foi possível avaliar.';btn.disabled=false;}}
carregar().catch(e=>{grid.innerHTML='<div class="empty">Não foi possível carregar os perfis: '+escapeHTML(e.message)+'</div>';});
</script></body></html>
