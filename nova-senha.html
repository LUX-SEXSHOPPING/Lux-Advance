<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUX — Nova senha</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/login.css"></head><body><main class="login-wrap"><section class="login-card"><div class="marca">LUX</div><p class="sub">Criar nova senha</p><p style="color:#b9afb4">Escolha uma nova senha para acessar sua conta.</p><div id="mensagem" class="mensagem" hidden></div><form id="form"><label>Nova senha</label><input id="senha" type="password" autocomplete="new-password" minlength="6" required placeholder="Mínimo de 6 caracteres"><label>Confirmar nova senha</label><input id="confirmar" type="password" autocomplete="new-password" minlength="6" required placeholder="Repita a senha"><button class="btn primary" type="submit">Salvar nova senha</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('mensagem');m.hidden=false;m.className='mensagem';const a=document.getElementById('senha').value,b=document.getElementById('confirmar').value;if(a.length<6){m.className='mensagem error';m.textContent='A senha precisa ter pelo menos 6 caracteres.';return}if(a!==b){m.className='mensagem error';m.textContent='As senhas não são iguais.';return}m.textContent='Salvando...';try{await atualizarSenha(a);m.textContent='Senha alterada com sucesso! Redirecionando para o login...';setTimeout(()=>location.href='login.html',1200);}catch(err){m.className='mensagem error';m.textContent=err.message;}});</script></body></html>
