<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUX — Administração</title><link rel="stylesheet" href="../css/app.css"></head><body><header class="topbar"><a class="brand" href="../index.html">LUX</a><a class="btn" href="#" id="sair">Sair</a></header><main class="container"><div class="hero"><div class="eyebrow">Controle interno</div><h1 class="title">Administração de modelos</h1><p class="subtitle">Revise os dados antes de verificar e publicar. A verificação aqui representa uma decisão administrativa; não invente informações.</p></div><div id="msg" class="notice" hidden></div><div id="grid" class="grid"><div class="empty">Carregando...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/auth.js"></script><script>
const grid=document.getElementById('grid'),msg=document.getElementById('msg');
function card(m){return `<article class="card"><img class="avatar" src="${escapeHTML(m.foto_url||'../vip1.png')}" alt="${escapeHTML(m.nome_exibicao)}"><div class="card-body"><span class="pill">${escapeHTML(m.verificacao_status)}</span><h2>${escapeHTML(m.nome_exibicao)}, ${m.idade}</h2><p class="subtitle">${escapeHTML(m.cidade||'')} · ${escapeHTML(m.pais||'')}</p><div class="info-list"><div class="info"><small>Cabelo</small>${escapeHTML(m.cor_cabelo||'—')}</div><div class="info"><small>Olhos</small>${escapeHTML(m.cor_olhos||'—')}</div><div class="info"><small>Altura</small>${m.altura_cm?m.altura_cm+' cm':'—'}</div><div class="info"><small>Estrelas</small>★ ${m.estrelas_total||0}</div></div><p class="subtitle">${escapeHTML(m.descricao||'Sem descrição')}</p><div class="actions"><button class="btn primary" data-action="verify" data-id="${m.id}">✓ Verificar e publicar</button><button class="btn" data-action="review" data-id="${m.id}">Em análise</button><button class="btn" data-action="reject" data-id="${m.id}">Reprovar</button></div></div></article>`}
async function carregar(){const db=requireClient();const {data,error}=await db.from('modelo_perfis').select('*').order('verificacao_status').order('estrelas_total',{ascending:false});if(error)throw error;grid.innerHTML=data?.length?data.map(card).join(''):'<div class="empty">Nenhum cadastro de modelo.</div>';grid.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>acao(b.dataset.id,b.dataset.action));}
async function acao(id,action){try{const db=requireClient();const status=action==='verify'?'verificada':action==='reject'?'reprovada':'em_analise';const perfilStatus=action==='verify'?'aprovado':'pendente';const a=await db.from('modelo_perfis').update({verificacao_status:status}).eq('id',id);if(a.error)throw a.error;const b=await db.from('perfis').update({status:perfilStatus}).eq('id',id);if(b.error)throw b.error;msg.hidden=false;msg.className='notice success';msg.textContent='Status atualizado.';carregar();}catch(e){msg.hidden=false;msg.className='notice error';msg.textContent=e.message;}}
document.getElementById('sair').onclick=e=>{e.preventDefault();sair()};(async()=>{try{await proteger('admin');await carregar()}catch(e){grid.innerHTML='<div class="empty">'+escapeHTML(e.message)+'</div>';}})();
</script></body></html>
