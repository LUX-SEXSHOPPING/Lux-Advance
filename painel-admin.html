<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LUX — Painel Administrativo</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./config.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #080509;
      color: #fff;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          rgba(80, 15, 55, 0.25),
          transparent 55%
        ),
        #080509;
    }

    .topo {
      width: 100%;
      padding: 20px;
      border-bottom: 1px solid rgba(248, 213, 138, 0.20);
      background: rgba(12, 6, 10, 0.96);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .marca {
      font-family: Georgia, serif;
      color: #f8d58a;
      font-size: 25px;
      letter-spacing: 4px;
    }

    .submarca {
      color: #aaa;
      font-size: 12px;
      margin-top: 4px;
    }

    .btn-sair {
      border: 1px solid rgba(248, 213, 138, 0.30);
      background: transparent;
      color: #f8d58a;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 1150px;
      margin: 0 auto;
      padding: 25px 18px 50px;
    }

    .titulo {
      font-family: Georgia, serif;
      color: #f8d58a;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .descricao {
      color: #aaa;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    .btn-filtro {
      border: 1px solid rgba(248, 213, 138, 0.25);
      background: #120a10;
      color: #ddd;
      border-radius: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }

    .btn-filtro.ativo {
      background: #f8d58a;
      color: #180d12;
    }

    #lista-precadastros {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(250px, 1fr)
      );
      gap: 16px;
    }

    .card-registro {
      background: rgba(20, 8, 17, 0.96);
      border: 1px solid rgba(248, 213, 138, 0.18);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .35);
    }

    .card-registro h4 {
      color: #f8d58a;
      margin: 0 0 12px;
      font-size: 19px;
    }

    .card-registro p {
      color: #ccc;
      font-size: 14px;
      line-height: 1.5;
      margin: 7px 0;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-secundario {
      background: #f8d58a;
      color: #180d12;
    }

    .status-pendente {
      color: #f8d58a;
    }

    .status-aprovado {
      color: #7dffb2;
    }

    .status-rejeitado {
      color: #ff8da9;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, .78);
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-conteudo {
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      background: #140811;
      border: 1px solid rgba(248, 213, 138, .25);
      border-radius: 20px;
      padding: 22px;
    }

    .modal-conteudo h3 {
      color: #f8d58a;
      margin-top: 0;
    }

    #corpo-ficha {
      color: #ddd;
      line-height: 1.6;
    }

    #corpo-ficha img {
      width: 100%;
      max-width: 220px;
      border-radius: 12px;
      margin: 6px;
    }

    #corpo-ficha video {
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
    }

    .acoes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    #botao-aprovar {
      background: #d9fbe6;
      color: #102017;
    }

    #botao-rejeitar {
      background: #ffd7df;
      color: #301018;
    }

    .btn-fechar {
      background: #333;
      color: #fff;
    }

    @media (max-width: 600px) {

      .topo {
        align-items: flex-start;
      }

      .marca {
        font-size: 21px;
      }

      .titulo {
        font-size: 24px;
      }

      .modal-conteudo {
        padding: 17px;
      }

    }

  </style>

</head>

<body>

  <header class="topo">

    <div>

      <div class="marca">
        LUX
      </div>

      <div class="submarca">
        Painel Administrativo
      </div>

    </div>

    <button
      type="button"
      class="btn-sair"
      id="btnSair"
    >
      SAIR
    </button>

  </header>


  <main class="container">

    <h1 class="titulo">
      Painel Administrativo
    </h1>

    <p class="descricao">
      Gerencie os pré-cadastros enviados para a LUX.
    </p>


    <div class="filtros">

      <button
        type="button"
        class="btn-filtro ativo"
        data-filtro="todos"
      >
        Todos
      </button>

      <button
        type="button"
        class="btn-filtro"
        data-filtro="pendente"
      >
        Pendentes
      </button>

      <button
        type="button"
        class="btn-filtro"
        data-filtro="aprovado"
      >
        Aprovados
      </button>

      <button
        type="button"
        class="btn-filtro"
        data-filtro="rejeitado"
      >
        Rejeitados
      </button>

    </div>


    <section id="lista-precadastros">

      <p
        style="
          grid-column:1/-1;
          text-align:center;
          color:#777;
        "
      >
        Carregando registros...
      </p>

    </section>

  </main>


  <div
    id="modal-ver-ficha"
    class="modal"
  >

    <div class="modal-conteudo">

      <h3>
        Ficha completa
      </h3>

      <div id="corpo-ficha"></div>

      <div class="acoes">

        <button
          type="button"
          class="btn"
          id="botao-aprovar"
        >
          APROVAR
        </button>

        <button
          type="button"
          class="btn"
          id="botao-rejeitar"
        >
          REJEITAR
        </button>

        <button
          type="button"
          class="btn btn-fechar"
          onclick="fecharModalFicha()"
        >
          FECHAR
        </button>

        <button
          type="button"
          class="btn btn-secundario"
          onclick="imprimirFicha()"
        >
          IMPRIMIR
        </button>

      </div>

    </div>

  </div>


  <script>

    /*
     * PROTEÇÃO DO PAINEL
     *
     * O painel só abre se existir uma
     * sessão administrativa válida.
     */

    document.addEventListener(
      "DOMContentLoaded",
      async function(){

        try{

          if(!window.luxSupabase){

            document.body.innerHTML =
              "<p style='padding:30px;color:#fff'>Erro ao carregar o Supabase. Verifique o config.js.</p>";

            return;
          }


          const resposta =
            await window.luxSupabase.auth.getSession();


          const sessao =
            resposta.data
              ? resposta.data.session
              : null;


          if(!sessao || !sessao.user){

            window.location.replace(
              "./acesso-admin.html"
            );

            return;
          }


          const emailUsuario =
            (
              sessao.user.email || ""
            ).toLowerCase().trim();


          const emailAdmin =
            (
              window.LUX_ADMIN_EMAIL || ""
            ).toLowerCase().trim();


          if(
            !emailAdmin ||
            emailUsuario !== emailAdmin
          ){

            await window.luxSupabase.auth.signOut();

            window.location.replace(
              "./acesso-admin.html"
            );

            return;
          }


          const btnSair =
            document.getElementById("btnSair");


          if(btnSair){

            btnSair.addEventListener(
              "click",
              async function(){

                await window.luxSupabase.auth.signOut();

                window.location.replace(
                  "./acesso-admin.html"
                );

              }
            );

          }

        }catch(erro){

          console.error(
            "Erro ao validar acesso administrativo:",
            erro
          );

          window.location.replace(
            "./acesso-admin.html"
          );

        }

      }
    );

  </script>


  <script src="./painel-admin.js"></script>

</body>

</html>
