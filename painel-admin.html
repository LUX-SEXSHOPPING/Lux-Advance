<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LUX — Acesso Administrativo</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./config.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #080509;
      color: #fff;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(
          circle at center,
          rgba(80, 15, 55, 0.25),
          transparent 55%
        ),
        #080509;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      width: 100%;
      padding: 38px 28px;
      border-radius: 28px;
      border: 1px solid rgba(248, 213, 138, 0.25);
      background: rgba(20, 8, 17, 0.97);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.65),
        0 0 35px rgba(255, 77, 166, 0.08);
      text-align: center;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 64px;
      letter-spacing: 8px;
      color: #f8d58a;
      margin-bottom: 8px;
    }

    .titulo {
      font-family: Georgia, serif;
      font-size: 25px;
      color: #f8d58a;
      margin-bottom: 8px;
    }

    .subtitulo {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .campo {
      text-align: left;
      margin-bottom: 18px;
    }

    .campo label {
      display: block;
      color: #ddd;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .campo input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(248, 213, 138, 0.25);
      outline: none;
      background: #100912;
      color: #fff;
      font-size: 16px;
    }

    .campo input:focus {
      border-color: #ff4da6;
      box-shadow: 0 0 0 2px rgba(255, 77, 166, 0.10);
    }

    .botao {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      margin-top: 5px;
      background: linear-gradient(
        135deg,
        #f8d58a,
        #c99d45
      );
      color: #180d12;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .mensagem {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    .erro {
      display: block;
      color: #ffb3d6;
      background: rgba(255, 30, 120, 0.10);
      border: 1px solid rgba(255, 30, 120, 0.25);
    }

    .sucesso {
      display: block;
      color: #f8d58a;
      background: rgba(248, 213, 138, 0.08);
      border: 1px solid rgba(248, 213, 138, 0.20);
    }

    .voltar {
      display: block;
      margin-top: 22px;
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
    }

    .voltar:hover {
      color: #f8d58a;
    }

  </style>

</head>

<body>

  <main class="container">

    <section class="card">

      <div class="logo">
        LUX
      </div>

      <div class="titulo">
        Acesso Administrativo
      </div>

      <div class="subtitulo">
        Área exclusiva de administração.
        Digite sua senha para continuar.
      </div>

      <form id="formAdmin">

        <div class="campo">

          <label for="senhaAdmin">
            Senha administrativa
          </label>

          <input
            id="senhaAdmin"
            type="password"
            autocomplete="current-password"
            placeholder="Digite sua senha"
            required
          >

        </div>

        <button
          id="btnEntrar"
          class="botao"
          type="submit"
        >
          ENTRAR NO PAINEL
        </button>

      </form>

      <div
        id="mensagem"
        class="mensagem"
      ></div>

      <a
        href="./index.html"
        class="voltar"
      >
        Voltar para o site
      </a>

    </section>

  </main>


  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const form =
          document.getElementById("formAdmin");

        const senhaInput =
          document.getElementById("senhaAdmin");

        const botao =
          document.getElementById("btnEntrar");

        const mensagem =
          document.getElementById("mensagem");


        function mostrarMensagem(
          texto,
          tipo
        ) {

          mensagem.textContent = texto;

          mensagem.className =
            "mensagem " + tipo;

        }


        form.addEventListener(
          "submit",
          async function (evento) {

            evento.preventDefault();

            const senha =
              senhaInput.value.trim();


            if (!senha) {

              mostrarMensagem(
                "Digite a senha administrativa.",
                "erro"
              );

              return;
            }


            if (
              !window.luxSupabase
            ) {

              mostrarMensagem(
                "Erro ao carregar o sistema. Verifique o config.js.",
                "erro"
              );

              return;
            }


            botao.disabled = true;

            botao.textContent =
              "ENTRANDO...";

            mensagem.className =
              "mensagem";

            mensagem.textContent =
              "";


            try {

              /*
               * O e-mail administrativo
               * vem diretamente do config.js
               */

              const email =
                window.LUX_ADMIN_EMAIL;


              if (!email) {

                throw new Error(
                  "E-mail administrativo não configurado no config.js."
                );

              }


              /*
               * LOGIN DIRETO
               *
               * Não fazemos getSession(),
               * não fazemos polling,
               * não ficamos verificando acesso.
               *
               * Se a senha estiver correta,
               * o Supabase cria a sessão e
               * abrimos o painel imediatamente.
               */

              const resultado =
                await window.luxSupabase.auth.signInWithPassword({

                  email: email,

                  password: senha

                });


              if (resultado.error) {

                throw resultado.error;

              }


              if (
                !resultado.data ||
                !resultado.data.user
              ) {

                throw new Error(
                  "Não foi possível confirmar o acesso."
                );

              }


              /*
               * SENHA CORRETA
               *
               * Abre diretamente o painel.
               */

              mostrarMensagem(
                "Acesso autorizado. Abrindo painel...",
                "sucesso"
              );


              botao.textContent =
                "ACESSO AUTORIZADO";


              /*
               * Pequeno intervalo apenas
               * para o navegador gravar a sessão.
               */

              setTimeout(
                function () {

                  window.location.href =
                    "./painel-admin.html";

                },
                300
              );


            } catch (erro) {

              console.error(
                "Erro no acesso administrativo:",
                erro
              );


              let texto =
                "Senha incorreta ou acesso não autorizado.";


              if (
                erro &&
                erro.message
              ) {

                const erroSupabase =
                  erro.message.toLowerCase();


                if (
                  erroSupabase.includes(
                    "invalid login credentials"
                  )
                ) {

                  texto =
                    "Senha incorreta. Tente novamente.";

                }
                else if (
                  erroSupabase.includes(
                    "email not confirmed"
                  )
                ) {

                  texto =
                    "O e-mail administrativo ainda não foi confirmado no Supabase.";

                }
                else if (
                  erroSupabase.includes(
                    "user not found"
                  )
                ) {

                  texto =
                    "Usuário administrativo não encontrado.";

                }
                else if (
                  erroSupabase.includes(
                    "invalid"
                  )
                ) {

                  texto =
                    "Dados de acesso inválidos.";

                }
              }


              mostrarMensagem(
                texto,
                "erro"
              );


              botao.disabled = false;

              botao.textContent =
                "ENTRAR NO PAINEL";

            }

          }
        );

      }
    );

  </script>

</body>

</html>
