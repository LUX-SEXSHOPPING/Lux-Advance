<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LUX — Acesso Administrativo</title>

  <!-- FONTES -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CONFIGURAÇÃO LUX -->
  <script src="./config.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      color: #eee4d8;

      background:
        linear-gradient(
          rgba(8, 3, 7, 0.72),
          rgba(8, 3, 7, 0.88)
        ),
        url("./lux-halloween.jpg")
        center center /
        cover
        fixed
        no-repeat;

      overflow-x: hidden;
    }

    body::before {
      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(201, 162, 39, 0.12),
          transparent 38%
        );
    }

    .container {
      position: relative;

      width: 100%;
      max-width: 470px;

      z-index: 2;
    }

    .painel {

      width: 100%;

      padding: 38px 30px 32px;

      border:
        1px solid
        rgba(201, 162, 39, 0.55);

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(20, 7, 13, 0.96),
          rgba(7, 3, 7, 0.94)
        );

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.75),
        0 0 45px rgba(201, 162, 39, 0.08);

      backdrop-filter: blur(12px);

      text-align: center;
    }

    .icone {

      width: 82px;
      height: 82px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid
        rgba(241, 211, 107, 0.65);

      border-radius: 50%;

      color: #f1d36b;

      background:
        radial-gradient(
          circle,
          rgba(201, 162, 39, 0.18),
          rgba(0, 0, 0, 0.35)
        );

      box-shadow:
        0 0 30px rgba(201, 162, 39, 0.12);
    }

    .icone i {
      font-size: 32px;
    }

    .marca {

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 32px;

      font-weight: 600;

      letter-spacing: 3px;

      color: #f1d36b;

      text-shadow:
        0 0 18px
        rgba(241, 211, 107, 0.2);
    }

    .subtitulo {

      margin-top: 7px;

      color: #cbbfb1;

      font-size: 17px;

      letter-spacing: 1px;
    }

    .linha {

      width: 90px;
      height: 1px;

      margin: 23px auto 25px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #c9a227,
          transparent
        );
    }

    .titulo {

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 24px;

      color: #fff1d0;

      margin-bottom: 8px;
    }

    .descricao {

      color: #bfb2a5;

      font-size: 16px;

      line-height: 1.5;

      margin-bottom: 25px;
    }

    .campo {

      position: relative;

      margin-bottom: 17px;
    }

    .campo i {

      position: absolute;

      left: 17px;
      top: 50%;

      transform:
        translateY(-50%);

      color: #c9a227;

      font-size: 15px;

      z-index: 2;
    }

    .campo input {

      width: 100%;

      height: 54px;

      padding:
        0 17px
        0 48px;

      border:
        1px solid
        rgba(201, 162, 39, 0.30);

      border-radius: 13px;

      outline: none;

      color: #fff;

      background:
        rgba(255, 255, 255, 0.045);

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size: 17px;

      transition: 0.25s;
    }

    .campo input:focus {

      border-color:
        rgba(241, 211, 107, 0.85);

      background:
        rgba(255, 255, 255, 0.065);

      box-shadow:
        0 0 0 3px
        rgba(201, 162, 39, 0.08);
    }

    .campo input::placeholder {
      color: #8f8378;
    }

    .botao {

      width: 100%;

      height: 55px;

      border: none;

      border-radius: 13px;

      cursor: pointer;

      color: #170d05;

      background:
        linear-gradient(
          135deg,
          #c9a227,
          #f1d36b,
          #c9a227
        );

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 17px;

      font-weight: 700;

      letter-spacing: 1px;

      box-shadow:
        0 10px 25px
        rgba(201, 162, 39, 0.16);

      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    .botao:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 14px 30px
        rgba(201, 162, 39, 0.25);
    }

    .botao:disabled {

      cursor: wait;

      opacity: 0.65;

      transform: none;
    }

    .mensagem {

      min-height: 25px;

      margin-top: 17px;

      font-size: 15px;

      line-height: 1.4;
    }

    .mensagem.erro {
      color: #ff8f8f;
    }

    .mensagem.sucesso {
      color: #e6c86e;
    }

    .esqueci {

      display: inline-block;

      margin-top: 19px;

      color: #c9a227;

      text-decoration: none;

      font-size: 15px;

      cursor: pointer;

      transition: 0.2s;
    }

    .esqueci:hover {
      color: #f1d36b;
    }

    .voltar {

      display: block;

      margin-top: 23px;

      color: #9e9287;

      text-decoration: none;

      font-size: 14px;

      transition: 0.2s;
    }

    .voltar:hover {
      color: #eee4d8;
    }

    .rodape {

      margin-top: 23px;

      padding-top: 19px;

      border-top:
        1px solid
        rgba(255, 255, 255, 0.07);

      color: #70675f;

      font-size: 12px;

      line-height: 1.5;
    }

    /* MODAL */

    .modal {

      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0, 0, 0, 0.82);

      z-index: 50;
    }

    .modal.ativo {
      display: flex;
    }

    .modal-box {

      width: 100%;
      max-width: 430px;

      padding: 30px;

      border:
        1px solid
        rgba(201, 162, 39, 0.5);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          #190a11,
          #080307
        );

      box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.75);

      text-align: center;
    }

    .modal-box h2 {

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      color: #f1d36b;

      margin-bottom: 10px;
    }

    .modal-box p {

      color: #bfb2a5;

      font-size: 15px;

      line-height: 1.5;

      margin-bottom: 20px;
    }

    .modal-botoes {

      display: flex;

      gap: 10px;

      margin-top: 16px;
    }

    .modal-botoes button {

      flex: 1;

      height: 48px;

      border-radius: 10px;

      cursor: pointer;

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 15px;
    }

    .btn-enviar {

      border: none;

      color: #170d05;

      background:
        linear-gradient(
          135deg,
          #c9a227,
          #f1d36b
        );
    }

    .btn-fechar {

      border:
        1px solid
        rgba(255,255,255,0.15);

      color: #ddd;

      background:
        rgba(255,255,255,0.05);
    }

    .mensagem-recuperacao {

      min-height: 22px;

      margin-top: 13px;

      font-size: 14px;
    }

    @media (max-width: 520px) {

      body {
        padding: 15px;
      }

      .painel {
        padding: 30px 21px 27px;
        border-radius: 20px;
      }

      .marca {
        font-size: 28px;
      }

      .titulo {
        font-size: 22px;
      }

    }

  </style>

</head>


<body>

  <main class="container">

    <section class="painel">

      <div class="icone">
        <i class="fas fa-user-shield"></i>
      </div>

      <div class="marca">
        LUX
      </div>

      <div class="subtitulo">
        ADVANCE
      </div>

      <div class="linha"></div>

      <h1 class="titulo">
        Acesso Administrativo
      </h1>

      <p class="descricao">
        Área exclusiva para gerenciamento e administração da plataforma LUX.
      </p>


      <form id="formAdmin">

        <div class="campo">

          <i class="fas fa-lock"></i>

          <input
            type="password"
            id="senhaAdmin"
            placeholder="Senha administrativa"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          class="botao"
          id="btnEntrar"
        >
          <i class="fas fa-right-to-bracket"></i>
          &nbsp;
          ENTRAR NO PAINEL
        </button>

      </form>


      <div
        id="mensagem"
        class="mensagem"
      ></div>


      <a
        href="#"
        class="esqueci"
        id="btnEsqueci"
      >
        Esqueci minha senha
      </a>


      <a
        href="./index.html"
        class="voltar"
      >
        <i class="fas fa-arrow-left"></i>
        Voltar para o site
      </a>


      <div class="rodape">
        LUX Advance © 2026<br>
        Área administrativa protegida.
      </div>

    </section>

  </main>


  <!-- MODAL RECUPERAÇÃO -->

  <div
    class="modal"
    id="modalRecuperacao"
  >

    <div class="modal-box">

      <h2>
        Recuperar acesso
      </h2>

      <p>
        Enviaremos um link para redefinição da senha administrativa.
      </p>

      <div class="campo">

        <i class="fas fa-envelope"></i>

        <input
          type="email"
          id="emailRecuperacao"
          placeholder="E-mail administrativo"
          autocomplete="email"
        >

      </div>

      <div class="modal-botoes">

        <button
          type="button"
          class="btn-fechar"
          id="btnFecharModal"
        >
          Cancelar
        </button>

        <button
          type="button"
          class="btn-enviar"
          id="btnEnviarRecuperacao"
        >
          Enviar
        </button>

      </div>

      <div
        class="mensagem-recuperacao"
        id="mensagemRecuperacao"
      ></div>

    </div>

  </div>


  <script>

    /* =========================================================
       LUX — ACESSO ADMINISTRATIVO
       DESTINO: painel-admin.html
       ========================================================= */


    const formAdmin =
      document.getElementById("formAdmin");

    const senhaAdmin =
      document.getElementById("senhaAdmin");

    const btnEntrar =
      document.getElementById("btnEntrar");

    const mensagem =
      document.getElementById("mensagem");


    function mostrarMensagem(texto, tipo) {

      mensagem.textContent = texto;

      mensagem.className =
        "mensagem " +
        (tipo || "");

    }


    formAdmin.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        mostrarMensagem("", "");

        const senha =
          String(
            senhaAdmin.value || ""
          ).trim();


        if (!senha) {

          mostrarMensagem(
            "Digite a senha administrativa.",
            "erro"
          );

          senhaAdmin.focus();

          return;
        }


        if (!window.luxSupabase) {

          mostrarMensagem(
            "Supabase não foi inicializado. Verifique o config.js.",
            "erro"
          );

          return;
        }


        const supabase =
          window.luxSupabase;


        const emailAdmin =
          String(
            window.LUX_ADMIN_EMAIL || ""
          )
            .trim()
            .toLowerCase();


        if (!emailAdmin) {

          mostrarMensagem(
            "E-mail administrativo não configurado no config.js.",
            "erro"
          );

          return;
        }


        btnEntrar.disabled = true;

        btnEntrar.innerHTML =
          '<i class="fas fa-spinner fa-spin"></i> AUTENTICANDO...';


        try {

          /*
           * LOGIN SUPABASE
           */

          const {
            data,
            error
          } =
            await supabase.auth.signInWithPassword({
              email: emailAdmin,
              password: senha
            });


          if (error) {

            console.error(
              "Erro Supabase:",
              error
            );

            const erroTexto =
              String(
                error.message || ""
              ).toLowerCase();


            if (
              erroTexto.includes(
                "invalid login credentials"
              )
            ) {

              throw new Error(
                "Senha administrativa incorreta."
              );

            }


            if (
              erroTexto.includes(
                "email not confirmed"
              )
            ) {

              throw new Error(
                "O e-mail administrativo ainda não foi confirmado no Supabase."
              );

            }


            throw new Error(
              error.message ||
              "Não foi possível realizar o acesso."
            );

          }


          const user =
            data?.user;


          if (!user) {

            throw new Error(
              "O usuário administrativo não foi encontrado."
            );

          }


          /*
           * CONFIRMA O E-MAIL
           */

          const emailUsuario =
            String(
              user.email || ""
            )
              .trim()
              .toLowerCase();


          if (
            emailUsuario !== emailAdmin
          ) {

            await supabase.auth.signOut();

            throw new Error(
              "Esta conta não possui permissão administrativa."
            );

          }


          /*
           * CONFIRMA A SESSÃO
           */

          let session = null;


          for (
            let tentativa = 0;
            tentativa < 10;
            tentativa++
          ) {

            const {
              data: sessionData
            } =
              await supabase.auth.getSession();


            session =
              sessionData?.session || null;


            if (session) {
              break;
            }


            await new Promise(
              resolve =>
                setTimeout(resolve, 300)
            );

          }


          if (!session) {

            throw new Error(
              "O login foi realizado, mas a sessão não foi criada. Tente novamente."
            );

          }


          /*
           * LOGIN CONFIRMADO
           */

          console.log(
            "LUX ADMIN: sessão confirmada."
          );

          console.log(
            "LUX ADMIN: usuário:",
            user.email
          );


          mostrarMensagem(
            "Acesso autorizado. Abrindo painel administrativo...",
            "sucesso"
          );


          /*
           * REDIRECIONAMENTO CORRETO
           *
           * acesso-admin.html
           *       ↓
           * painel-admin.html
           */

          setTimeout(
            function() {

              window.location.replace(
                "./painel-admin.html"
              );

            },
            500
          );


        } catch (erro) {

          console.error(
            "LUX ADMIN:",
            erro
          );


          mostrarMensagem(
            erro.message ||
            "Não foi possível acessar o painel.",
            "erro"
          );


          btnEntrar.disabled = false;

          btnEntrar.innerHTML =
            '<i class="fas fa-right-to-bracket"></i> &nbsp; ENTRAR NO PAINEL';

        }

      }
    );


    /* =========================================================
       RECUPERAÇÃO DE SENHA
       ========================================================= */

    const modalRecuperacao =
      document.getElementById(
        "modalRecuperacao"
      );

    const btnEsqueci =
      document.getElementById(
        "btnEsqueci"
      );

    const btnFecharModal =
      document.getElementById(
        "btnFecharModal"
      );

    const btnEnviarRecuperacao =
      document.getElementById(
        "btnEnviarRecuperacao"
      );

    const emailRecuperacao =
      document.getElementById(
        "emailRecuperacao"
      );

    const mensagemRecuperacao =
      document.getElementById(
        "mensagemRecuperacao"
      );


    btnEsqueci.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        const emailAdmin =
          String(
            window.LUX_ADMIN_EMAIL || ""
          ).trim();

        emailRecuperacao.value =
          emailAdmin;

        mensagemRecuperacao.textContent =
          "";

        modalRecuperacao.classList.add(
          "ativo"
        );

      }
    );


    btnFecharModal.addEventListener(
      "click",
      function() {

        modalRecuperacao.classList.remove(
          "ativo"
        );

      }
    );


    modalRecuperacao.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          modalRecuperacao
        ) {

          modalRecuperacao.classList.remove(
            "ativo"
          );

        }

      }
    );


    btnEnviarRecuperacao.addEventListener(
      "click",
      async function() {

        const email =
          String(
            emailRecuperacao.value || ""
          )
            .trim()
            .toLowerCase();


        if (!email) {

          mensagemRecuperacao.textContent =
            "Informe o e-mail administrativo.";

          return;
        }


        if (!window.luxSupabase) {

          mensagemRecuperacao.textContent =
            "Supabase não foi inicializado.";

          return;
        }


        const emailAdmin =
          String(
            window.LUX_ADMIN_EMAIL || ""
          )
            .trim()
            .toLowerCase();


        if (
          email !== emailAdmin
        ) {

          mensagemRecuperacao.textContent =
            "Este e-mail não corresponde ao administrador.";

          return;
        }


        btnEnviarRecuperacao.disabled =
          true;

        btnEnviarRecuperacao.textContent =
          "Enviando...";


        try {

          const origem =
            window.location.origin;


          const redirectUrl =
            origem +
            "/Lux-Advance/redefinir-senha.html";


          const {
            error
          } =
            await window.luxSupabase.auth
              .resetPasswordForEmail(
                email,
                {
                  redirectTo:
                    redirectUrl
                }
              );


          if (error) {
            throw error;
          }


          mensagemRecuperacao.textContent =
            "Link enviado. Verifique o e-mail administrativo.";

        } catch (erro) {

          console.error(
            erro
          );

          mensagemRecuperacao.textContent =
            erro.message ||
            "Não foi possível enviar o link.";

        } finally {

          btnEnviarRecuperacao.disabled =
            false;

          btnEnviarRecuperacao.textContent =
            "Enviar";

        }

      }
    );


  </script>

</body>

</html>
