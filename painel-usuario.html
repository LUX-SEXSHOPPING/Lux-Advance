<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>LUX — Área do Usuário</title>

  <link
    rel="stylesheet"
    href="app.css"
  >

  <style>

    /* =====================================================
       PAINEL DO USUÁRIO — LAYOUT PREMIUM
       A autenticação original permanece preservada.
       ===================================================== */

    :root {
      --lux-gold: #c9a227;
      --lux-gold-light: #f0d878;
      --lux-wine: #6e0f2e;
      --lux-dark: #080607;
      --lux-card: #120d10;
      --lux-border: rgba(201, 162, 39, .25);
      --lux-muted: #b8adb2;
    }


    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(110, 15, 46, .22),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          #080607 0%,
          #0c0809 55%,
          #080607 100%
        );
      color: #f5e6c8;
    }


    /* =====================================================
       TOPO
       ===================================================== */

    .lux-header {
      position: sticky;
      top: 0;
      z-index: 20;

      height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 22px;

      background: rgba(8, 6, 7, .94);

      border-bottom:
        1px solid var(--lux-border);

      backdrop-filter: blur(14px);
    }


    .lux-brand {
      display: flex;
      align-items: center;
      gap: 10px;

      text-decoration: none;
    }


    .lux-brand-name {
      font-family: Georgia, serif;

      font-size: 30px;
      font-weight: 700;
      letter-spacing: 5px;

      color: var(--lux-gold-light);

      text-shadow:
        0 0 18px rgba(201, 162, 39, .22);
    }


    .lux-brand-sub {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--lux-muted);
      text-transform: uppercase;
    }


    .lux-logout {
      border: 1px solid rgba(201, 162, 39, .35);

      background: rgba(255,255,255,.03);

      color: #f5e6c8;

      padding: 10px 17px;

      border-radius: 8px;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;

      transition: .25s ease;
    }


    .lux-logout:hover {
      background: var(--lux-wine);
      border-color: var(--lux-gold);
      transform: translateY(-1px);
    }


    /* =====================================================
       CONTEÚDO
       ===================================================== */

    .lux-container {
      width: min(1100px, calc(100% - 30px));

      margin: 0 auto;

      padding:
        42px 0
        60px;
    }


    /* =====================================================
       HERO
       ===================================================== */

    .lux-welcome {
      position: relative;

      overflow: hidden;

      padding: 34px 30px;

      border-radius: 18px;

      border: 1px solid var(--lux-border);

      background:
        linear-gradient(
          135deg,
          rgba(110, 15, 46, .30),
          rgba(18, 13, 16, .96) 55%
        );

      box-shadow:
        0 20px 60px rgba(0,0,0,.35);
    }


    .lux-welcome::after {
      content: "";

      position: absolute;

      width: 220px;
      height: 220px;

      right: -90px;
      top: -100px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(201,162,39,.18),
          transparent 70%
        );

      pointer-events: none;
    }


    .lux-eyebrow {
      color: var(--lux-gold-light);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 3px;

      margin-bottom: 12px;
    }


    .lux-title {
      margin: 0;

      font-family: Georgia, serif;

      font-size:
        clamp(30px, 7vw, 52px);

      line-height: 1.1;

      color: #fff8ed;
    }


    .lux-title span {
      color: var(--lux-gold-light);
    }


    .lux-subtitle {
      margin:
        15px
        0
        0;

      max-width: 650px;

      color: var(--lux-muted);

      font-size: 15px;

      line-height: 1.7;
    }


    /* =====================================================
       GRID PRINCIPAL
       ===================================================== */

    .lux-grid {
      display: grid;

      grid-template-columns:
        minmax(0, 1.1fr)
        minmax(0, .9fr);

      gap: 20px;

      margin-top: 22px;
    }


    .lux-card {
      background:
        linear-gradient(
          145deg,
          rgba(25,17,21,.98),
          rgba(13,9,11,.98)
        );

      border:
        1px solid var(--lux-border);

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 14px 40px rgba(0,0,0,.25);
    }


    .lux-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 20px 22px;

      border-bottom:
        1px solid rgba(201,162,39,.12);
    }


    .lux-card-label {
      color: var(--lux-gold-light);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 2px;
    }


    .lux-card-body {
      padding: 24px 22px;
    }


    .lux-profile {
      display: flex;
      align-items: center;
      gap: 18px;

      margin-bottom: 22px;
    }


    .lux-avatar {
      width: 64px;
      height: 64px;

      flex: 0 0 64px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      border:
        1px solid
        rgba(201,162,39,.55);

      background:
        linear-gradient(
          145deg,
          var(--lux-wine),
          #1a0b11
        );

      color: var(--lux-gold-light);

      font-family: Georgia, serif;

      font-size: 25px;
      font-weight: 700;

      box-shadow:
        0 0 25px
        rgba(110,15,46,.25);
    }


    .lux-profile h2 {
      margin: 0 0 5px;

      color: #fff8ed;

      font-family: Georgia, serif;

      font-size: 24px;
    }


    .lux-email {
      margin: 0;

      color: var(--lux-muted);

      font-size: 13px;

      word-break: break-word;
    }


    .lux-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 7px 11px;

      border-radius: 999px;

      background:
        rgba(38, 150, 80, .10);

      border:
        1px solid
        rgba(100, 210, 130, .20);

      color: #a9e5b8;

      font-size: 11px;
      font-weight: 600;

      margin-top: 15px;
    }


    .lux-status::before {
      content: "";

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #79d58c;

      box-shadow:
        0 0 8px
        rgba(121,213,140,.7);
    }


    /* =====================================================
       ATALHOS
       ===================================================== */

    .lux-actions {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0,1fr));

      gap: 12px;
    }


    .lux-action {
      display: flex;
      align-items: center;
      gap: 12px;

      min-height: 78px;

      padding: 15px;
