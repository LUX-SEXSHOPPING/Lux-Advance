<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>LUX — Área do Usuário</title>

  <link
    rel="stylesheet"
    href="app.css"
  >

</head>


<body>

  <header class="topbar">

    <a
      class="brand"
      href="index.html"
    >
      LUX
    </a>


    <button
      class="btn ghost"
      id="btnSair"
      type="button"
    >
      Sair
    </button>

  </header>


  <main class="container">

    <section class="hero">

      <div class="eyebrow">
        ÁREA EXCLUSIVA
      </div>


      <h1
        class="title"
        id="titulo"
      >
        Minha conta
      </h1>


      <p
        class="subtitle"
        id="subtitulo"
      >
        Carregando sua conta...
      </p>

    </section>


    <div
      id="mensagem"
      class="notice"
      hidden
    ></div>


    <section
      id="conteudo"
      class="grid"
      hidden
    >

      <article class="card">

        <div class="card-body">

          <span class="pill">
            PERFIL
          </span>


          <h2 id="nomeUsuario">
            Usuário
          </h2>


          <p
            id="emailUsuario"
            style="color:var(--muted)"
          ></p>


          <p
            id="statusUsuario"
            style="color:var(--muted)"
          ></p>

        </div>

      </article>


      <article class="card">

        <div class="card-body">

          <span class="pill">
            LUX
          </span>


          <h2>
            Bem-vindo
          </h2>


          <p
            style="
              color:var(--muted);
              line-height:1.7;
            "
          >
            Sua conta está ativa.
            Explore a plataforma LUX e
            acompanhe as novidades.
          </p>


          <div class="actions">

            <a
              class="btn primary"
              href="modelos.html"
            >
              Ver modelos
            </a>


            <a
              class="btn"
              href="index.html"
            >
              Página inicial
            </a>

          </div>

        </div>

      </article>

    </section>

  </main>


  <footer class="footer">

    LUX — Sensualidade & Sofisticação

  </footer>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="auth.js"></script>


  <script>

    const mensagem =
      document.getElementById(
        "mensagem"
      );


    /* =====================================================
       CARREGAR PAINEL
       ===================================================== */

    async function iniciarPainel() {

      try {

        const supabase =
          window.luxSupabase;


        if (!supabase) {

          throw new Error(
            "Supabase não foi inicializado."
          );

        }


        /*
         * Aguarda o Supabase restaurar
         * a sessão do navegador.
         */

        let session = null;


        for (
          let tentativa = 0;
          tentativa < 10;
          tentativa++
        ) {

          const {
            data
          } =
            await supabase.auth
              .getSession();


          session =
            data?.session || null;


          if (session) {
            break;
          }


          await new Promise(
            function(resolve) {

              setTimeout(
                resolve,
                300
              );

            }
          );

        }


        /*
         * Só manda para o login se,
         * depois das tentativas,
         * realmente não houver sessão.
         */

        if (!session) {

          window.location.replace(
            "login.html"
          );

          return;

        }


        const user =
          session.user;


        /*
         * Busca o perfil.
         */

        let perfil = null;


        for (
          let tentativa = 0;
          tentativa < 5;
          tentativa++
        ) {

          perfil =
            await getPerfil(
              user.id
            );


          if (perfil) {
            break;
          }


          await new Promise(
            function(resolve) {

              setTimeout(
                resolve,
                500
              );

            }
          );

        }


        if (!perfil) {

          mensagem.hidden = false;

          mensagem.className =
            "notice error";

          mensagem.textContent =
            "Sua conta foi autenticada, mas o perfil ainda está sendo criado. Atualize a página em alguns segundos.";

          document
            .getElementById("subtitulo")
            .textContent =
            "Preparando sua conta...";

          return;

        }


        /*
         * Se a conta não for de usuário,
         * encaminha para o painel correto.
         */

        if (
          perfil.tipo === "modelo"
        ) {

          window.location.replace(
            "painel-modelo.html"
          );

          return;

        }


        if (
          perfil.tipo === "admin"
        ) {

          window.location.replace(
            "painel.html"
          );

          return;

        }


        /*
         * Confirma que é usuário.
         */

        if (
          perfil.tipo !== "usuario"
        ) {

          throw new Error(
            "Tipo de conta não reconhecido."
          );

        }


        /*
         * Preenche o painel.
         */

        document
          .getElementById(
            "nomeUsuario"
          )
          .textContent =
          perfil.nome ||
          user.user_metadata?.nome ||
          "Usuário";


        document
          .getElementById(
            "emailUsuario"
          )
          .textContent =
          user.email ||
          "";


        document
          .getElementById(
            "statusUsuario"
          )
          .textContent =
          "Status: " +
          (
            perfil.status ||
            "ativo"
          );


        document
          .getElementById(
            "titulo"
          )
          .textContent =
          "Olá, " +
          (
            perfil.nome ||
            user.user_metadata?.nome ||
            "usuário"
          );


        document
          .getElementById(
            "subtitulo"
          )
          .textContent =
          "Esta é sua área exclusiva na LUX.";


        document
          .getElementById(
            "conteudo"
          )
          .hidden = false;


      } catch (erro) {

        console.error(
          "Erro no painel:",
          erro
        );


        mensagem.hidden = false;

        mensagem.className =
          "notice error";

        mensagem.textContent =
          erro.message ||
          "Não foi possível carregar sua conta.";

      }

    }


    /* =====================================================
       SAIR
       ===================================================== */

    document
      .getElementById(
        "btnSair"
      )
      .addEventListener(
        "click",
        async function() {

          await sair();

        }
      );


    /* =====================================================
       INICIAR
       ===================================================== */

    iniciarPainel();

  </script>

</body>

</html>
