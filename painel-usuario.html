<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LUX — Painel do Usuário</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --dourado: #c9a227;
      --dourado-claro: #f0d878;
      --champanhe: #f5e6c8;
      --vinho: #6e0f2e;
      --fundo: #0c0809;
      --card: #151012;
      --texto: #f5f0f2;
      --suave: #b9afb3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(110, 15, 46, 0.25), transparent 35%),
        linear-gradient(135deg, #0c0809, #130b0e);
      color: var(--texto);
      font-family: Arial, sans-serif;
    }

    header {
      width: 100%;
      padding: 18px 20px;
      border-bottom: 1px solid rgba(201, 162, 39, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 8px;
    }

    .logo-text {
      font-family: "Playfair Display", serif;
      color: var(--dourado-claro);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .container {
      width: min(92%, 900px);
      margin: 40px auto;
    }

    .painel {
      background: rgba(21, 16, 18, 0.96);
      border: 1px solid rgba(201, 162, 39, 0.28);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.45);
    }

    .titulo {
      font-family: "Playfair Display", serif;
      font-size: 32px;
      color: var(--dourado-claro);
      margin-bottom: 8px;
    }

    .subtitulo {
      color: var(--suave);
      margin-bottom: 28px;
    }

    .perfil {
      background: #100c0e;
      border: 1px solid rgba(245, 230, 200, 0.12);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .perfil h2 {
      color: var(--champanhe);
      margin-bottom: 15px;
      font-family: "Playfair Display", serif;
    }

    .linha {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .linha:last-child {
      border-bottom: none;
    }

    .label {
      color: var(--suave);
    }

    .valor {
      color: var(--texto);
      text-align: right;
      font-weight: 600;
    }

    .acoes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 13px 18px;
      border-radius: 11px;
      border: 1px solid rgba(201, 162, 39, 0.45);
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s ease;
      font-size: 15px;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-plano {
      background: linear-gradient(135deg, var(--dourado), var(--dourado-claro));
      color: #0c0809;
      border: none;
      box-shadow: 0 7px 22px rgba(201, 162, 39, 0.22);
    }

    .btn-plano:hover {
      box-shadow: 0 10px 28px rgba(201, 162, 39, 0.35);
    }

    .btn-normal {
      background: rgba(255,255,255,0.03);
      color: var(--champanhe);
    }

    .btn-sair {
      background: rgba(110, 15, 46, 0.25);
      color: #f2c7d5;
      border-color: rgba(110, 15, 46, 0.7);
    }

    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(201, 162, 39, 0.12);
      color: var(--dourado-claro);
      font-size: 13px;
    }

    #mensagem {
      text-align: center;
      color: var(--suave);
      padding: 20px;
    }

    @media (max-width: 600px) {

      .container {
        margin: 25px auto;
      }

      .painel {
        padding: 20px;
      }

      .titulo {
        font-size: 26px;
      }

      .linha {
        flex-direction: column;
        gap: 5px;
      }

      .valor {
        text-align: left;
      }

      .logo-text {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo-area">
      <img src="logo4.png" alt="LUX" class="logo">
      <div class="logo-text">LUX - ADVANCE</div>
    </div>
  </header>

  <main class="container">

    <section class="painel">

      <h1 class="titulo">Painel do Usuário</h1>

      <p class="subtitulo">
        Bem-vindo à sua área exclusiva LUX.
      </p>

      <div id="mensagem">
        Carregando seu perfil...
      </div>

      <div id="conteudo" style="display:none;">

        <div class="perfil">

          <h2>Minha conta</h2>

          <div class="linha">
            <span class="label">Nome</span>
            <span class="valor" id="nomeUsuario">---</span>
          </div>

          <div class="linha">
            <span class="label">E-mail</span>
            <span class="valor" id="emailUsuario">---</span>
          </div>

          <div class="linha">
            <span class="label">Tipo de conta</span>
            <span class="valor" id="tipoUsuario">---</span>
          </div>

          <div class="linha">
            <span class="label">Status</span>
            <span class="valor">
              <span class="status" id="statusUsuario">---</span>
            </span>
          </div>

        </div>

        <div class="acoes">

          <!-- NOVO BOTÃO DE PLANOS -->
          <a href="planos.html" class="btn btn-plano">
            💎 PLANOS LUX
          </a>

          <a href="index.html" class="btn btn-normal">
            🏠 Página Inicial
          </a>

          <button onclick="sair()" class="btn btn-sair">
            🚪 Sair da Conta
          </button>

        </div>

      </div>

    </section>

  </main>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CONFIGURAÇÃO LUX -->
  <script src="config.js"></script>

  <!-- AUTENTICAÇÃO LUX -->
  <script src="auth.js"></script>


  <script>

    async function carregarPainel() {

      const mensagem = document.getElementById("mensagem");
      const conteudo = document.getElementById("conteudo");

      try {

        const supabase = window.luxSupabase;

        if (!supabase) {
          throw new Error("Supabase não foi inicializado.");
        }

        const {
          data: {
            session
          }
        } = await supabase.auth.getSession();

        if (!session || !session.user) {

          window.location.href =
            "login.html?redirect=painel-usuario.html";

          return;
        }

        const user = session.user;

        /*
         * Mostra imediatamente os dados básicos
         */
        document.getElementById("nomeUsuario").textContent =
          user.user_metadata?.nome ||
          user.email ||
          "Usuário";

        document.getElementById("emailUsuario").textContent =
          user.email || "---";

        /*
         * Busca o perfil no Supabase
         */
        const {
          data: perfil,
          error
        } = await supabase
          .from("perfis")
          .select("nome,tipo,status")
          .eq("id", user.id)
          .single();

        if (error) {
          console.error("Erro ao carregar perfil:", error);
        }

        if (perfil) {

          document.getElementById("nomeUsuario").textContent =
            perfil.nome || user.email || "Usuário";

          document.getElementById("tipoUsuario").textContent =
            perfil.tipo || "usuario";

          document.getElementById("statusUsuario").textContent =
            perfil.status || "ativo";

          /*
           * Modelos vão para o painel de modelos
           */
          if (perfil.tipo === "modelo") {

            window.location.href =
              "painel-modelo.html";

            return;
          }

          /*
           * Administrador vai para o painel administrativo
           */
          if (perfil.tipo === "admin") {

            window.location.href =
              "painel-admin.html";

            return;
          }

        } else {

          document.getElementById("tipoUsuario").textContent =
            "usuario";

          document.getElementById("statusUsuario").textContent =
            "ativo";
        }

        mensagem.style.display = "none";
        conteudo.style.display = "block";

      } catch (erro) {

        console.error("Erro no painel:", erro);

        mensagem.textContent =
          "Não foi possível carregar seu painel. Tente novamente.";

      }

    }


    /*
     * Logout
     */
    async function sairDoSistema() {

      try {

        const supabase = window.luxSupabase;

        if (supabase) {
          await supabase.auth.signOut();
        }

      } catch (erro) {

        console.error("Erro ao sair:", erro);

      }

      window.location.href = "login.html";

    }


    /*
     * Mantém compatibilidade com o auth.js
     */
    window.sair = sairDoSistema;


    /*
     * Inicia painel
     */
    carregarPainel();

  </script>

</body>
</html>
