<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>LUX — Área do Usuário</title>

  <link
    rel="stylesheet"
    href="app.css"
  >

  <style>

    /* =========================================
       LUX HALLOWEEN — ÁREA DO USUÁRIO
       ========================================= */

    body {
      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(255, 102, 0, .12),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 85%,
          rgba(110, 15, 46, .18),
          transparent 35%
        ),
        #080607;

      min-height: 100vh;
    }


    /* TOPO */

    .topbar {

      border-bottom:
        1px solid rgba(255, 140, 0, .22);

      box-shadow:
        0 5px 30px rgba(0,0,0,.55);

    }


    .brand {

      color:
        #f0d878 !important;

      letter-spacing:
        5px;

      text-shadow:
        0 0 15px
        rgba(240,216,120,.25);

    }


    /* BOTÃO SAIR */

    .btn.ghost {

      background:
        rgba(255,255,255,.035) !important;

      color:
        #f0d878 !important;

      border:
        1px solid
        rgba(240,216,120,.25) !important;

      box-shadow:
        none;

    }


    /* HERO */

    .hero {

      position:
        relative;

      overflow:
        hidden;

      border:
        1px solid
        rgba(255,140,0,.18);

      background:
        linear-gradient(
          135deg,
          rgba(30,18,15,.97),
          rgba(12,8,9,.99)
        );

      box-shadow:
        0 18px 50px
        rgba(0,0,0,.45),

        inset 0 1px
        rgba(255,255,255,.025);

    }


    .hero::before {

      content:
        "🎃";

      position:
        absolute;

      right:
        25px;

      top:
        15px;

      font-size:
        58px;

      opacity:
        .12;

    }


    .hero::after {

      content:
        "🕸️";

      position:
        absolute;

      right:
        15px;

      bottom:
        -12px;

      font-size:
        75px;

      opacity:
        .08;

      transform:
        rotate(-10deg);

    }


    .eyebrow {

      color:
        #ff9d32 !important;

      letter-spacing:
        3px;

    }


    .title {

      text-shadow:
        0 0 25px
        rgba(255,110,0,.12);

    }


    .subtitle {

      color:
        #bdb0b5 !important;

    }


    /* MENSAGEM */

    .notice {

      border-color:
        rgba(255,140,0,.20);

    }


    /* CARDS */

    .card {

      position:
        relative;

      overflow:
        hidden;

      border:
        1px solid
        rgba(255,140,0,.16) !important;

      background:
        linear-gradient(
          145deg,
          rgba(25,17,19,.98),
          rgba(13,9,10,.98)
        ) !important;

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.45),

        inset 0 1px
        rgba(255,255,255,.025);

      transition:
        transform .2s ease,
        box-shadow .2s ease;

    }


    .card:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 20px 55px
        rgba(0,0,0,.55),

        0 0 25px
        rgba(255,100,0,.05);

    }


    .card::after {

      content:
        "";

      position:
        absolute;

      width:
        130px;

      height:
        130px;

      right:
        -70px;

      bottom:
        -70px;

      border-radius:
        50%;

      background:
        rgba(255,100,0,.07);

      filter:
        blur(5px);

      pointer-events:
        none;

    }


    /* ETIQUETAS */

    .pill {

      border-color:
        rgba(255,140,0,.28) !important;

      background:
        rgba(255,100,0,.08) !important;

      color:
        #f0d878 !important;

      box-shadow:
        0 0 12px
        rgba(255,100,0,.04);

    }


    /* TEXTO */

    #nomeUsuario {

      color:
        #f4e9e2;

      text-shadow:
        0 0 15px
        rgba(255,140,0,.08);

    }


    #emailUsuario {

      color:
        #a99da2 !important;

    }


    /* BOTOES */

    .actions {

      margin-top:
        22px;

      gap:
        12px;

      display:
        flex;

      flex-wrap:
        wrap;

    }


    .btn {

      background:
        linear-gradient(
          135deg,
          #d88916,
          #a95e08
        ) !important;

      color:
        #120b08 !important;

      border:
        0 !important;

      box-shadow:
        0 8px 25px
        rgba(210,100,0,.18);

    }


    .btn:hover {

      transform:
        translateY(-1px);

      box-shadow:
        0 10px 30px
        rgba(255,120,0,.25);

    }


    .btn.primary {

      background:
        linear-gradient(
          135deg,
          #f0b13b,
          #c8730d
        ) !important;

      color:
        #100907 !important;

    }


    /* FOOTER */

    .footer {

      border-top:
        1px solid
        rgba(255,140,0,.12);

      color:
        #756b70 !important;

    }


    /* DECORAÇÕES */

    .halloween-decoration {

      position:
        fixed;

      pointer-events:
        none;

      z-index:
        0;

      opacity:
        .08;

      font-size:
        75px;

    }


    .web-left {

      left:
        -18px;

      top:
        110px;

    }


    .web-right {

      right:
        -15px;

      top:
        330px;

      transform:
        rotate(180deg);

    }


    .container,
    .topbar,
    .footer {

      position:
        relative;

      z-index:
        2;

    }


    /* CELULAR */

    @media (max-width: 600px) {

      .hero::before {

        font-size:
          45px;

        right:
          15px;

      }


      .card {

        border-radius:
          18px;

      }


      .actions {

        flex-direction:
          column;

      }


      .actions .btn {

        width:
          100%;

        text-align:
          center;

      }

    }

  </style>

</head>


<body>


  <!-- DECORAÇÕES HALLOWEEN -->

  <div class="halloween-decoration web-left">
    🕸️
  </div>

  <div class="halloween-decoration web-right">
    🕸️
  </div>


  <!-- TOPO -->

  <header class="topbar">

    <a
      class="brand"
      href="index.html"
    >
      LUX
    </a>


    <button
      class="btn ghost"
      id="btnSair"
    >
      Sair
    </button>

  </header>


  <!-- CONTEÚDO -->

  <main class="container">


    <!-- HERO -->

    <section class="hero">

      <div class="eyebrow">
        🎃 ÁREA EXCLUSIVA
      </div>


      <h1
        class="title"
        id="titulo"
      >
        Minha conta
      </h1>


      <p
        class="subtitle"
        id="subtitulo"
      >
        Carregando suas informações...
      </p>

    </section>


    <!-- MENSAGEM -->

    <div
      id="mensagem"
      class="notice"
      hidden
    ></div>


    <!-- CONTEÚDO -->

    <section
      id="conteudo"
      class="grid"
      hidden
    >


      <!-- PERFIL -->

      <article class="card">

        <div class="card-body">

          <span class="pill">
            ✦ PERFIL
          </span>


          <h2 id="nomeUsuario">
            Usuário
          </h2>


          <p
            id="emailUsuario"
            style="color:var(--muted)"
          >
          </p>

        </div>

      </article>


      <!-- BOAS-VINDAS -->

      <article class="card">

        <div class="card-body">

          <span class="pill">
            🎃 LUX
          </span>


          <h2>
            Bem-vindo
          </h2>


          <p
            style="
              color:var(--muted);
              line-height:1.7;
            "
          >

            Sua conta está ativa.
            Explore a plataforma LUX,
            conheça os perfis disponíveis
            e acompanhe as novidades.

          </p>


          <div class="actions">


            <a
              class="btn primary"
              href="modelos.html"
            >
              ✦ Ver modelos
            </a>


            <a
              class="btn"
              href="index.html"
            >
              Página inicial
            </a>


          </div>

        </div>

      </article>


    </section>

  </main>


  <!-- RODAPÉ -->

  <footer class="footer">

    LUX — Sensualidade & Sofisticação · Halloween Edition 🎃

  </footer>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="auth.js"></script>


  <script>

    async function iniciar() {

      const mensagem =
        document.getElementById(
          "mensagem"
        );


      try {


        /* USUÁRIO ATUAL */

        const user =
          await usuarioAtual();


        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        /* PERFIL */

        const perfil =
          await getPerfil(
            user.id
          );


        if (!perfil) {

          throw new Error(
            "Perfil não encontrado."
          );

        }


        /* REDIRECIONAMENTO */

        if (
          perfil.tipo !== "usuario"
        ) {


          if (
            perfil.tipo === "modelo"
          ) {

            window.location.href =
              "painel-modelo.html";

          }


          else if (
            perfil.tipo === "admin"
          ) {

            window.location.href =
              "painel.html";

          }


          return;

        }


        /* NOME */

        document
          .getElementById("nomeUsuario")
          .textContent =
          perfil.nome ||
          "Usuário";


        /* E-MAIL */

        document
          .getElementById("emailUsuario")
          .textContent =
          perfil.email ||
          user.email ||
          "";


        /* TÍTULO */

        document
          .getElementById("titulo")
          .textContent =
          "Olá, " +
          (
            perfil.nome ||
            "usuário"
          );


        /* SUBTÍTULO */

        document
          .getElementById("subtitulo")
          .textContent =
          "Esta é sua área exclusiva na LUX.";


        /* MOSTRAR */

        document
          .getElementById("conteudo")
          .hidden =
          false;


      }

      catch (erro) {

        console.error(
          "Erro no painel do usuário:",
          erro
        );


        mensagem.hidden =
          false;


        mensagem.className =
          "notice error";


        mensagem.textContent =
          erro.message ||
          "Não foi possível carregar sua conta.";

      }

    }


    /* SAIR */

    document
      .getElementById("btnSair")
      .addEventListener(
        "click",
        sair
      );


    /* INICIAR */

    iniciar();

  </script>


</body>

</html>
