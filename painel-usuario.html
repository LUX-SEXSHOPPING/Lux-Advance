<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>LUX — Área do Usuário</title>

  <link
    rel="stylesheet"
    href="app.css"
  >

</head>

<body>

  <header class="topbar">

    <a
      class="brand"
      href="index.html"
    >
      LUX
    </a>

    <button
      class="btn ghost"
      id="btnSair"
      type="button"
    >
      Sair
    </button>

  </header>


  <main class="container">

    <section class="hero">

      <div class="eyebrow">
        ÁREA EXCLUSIVA
      </div>

      <h1
        class="title"
        id="titulo"
      >
        Minha conta
      </h1>

      <p
        class="subtitle"
        id="subtitulo"
      >
        Carregando suas informações...
      </p>

    </section>


    <div
      id="mensagem"
      class="notice"
      hidden
    ></div>


    <section
      id="conteudo"
      class="grid"
      hidden
    >

      <article class="card">

        <div class="card-body">

          <span class="pill">
            PERFIL
          </span>

          <h2 id="nomeUsuario">
            Usuário
          </h2>

          <p
            id="emailUsuario"
            style="color:var(--muted)"
          ></p>

          <p
            id="statusUsuario"
            style="color:var(--muted)"
          ></p>

        </div>

      </article>


      <article class="card">

        <div class="card-body">

          <span class="pill">
            LUX
          </span>

          <h2>
            Bem-vindo
          </h2>

          <p
            style="
              color:var(--muted);
              line-height:1.7;
            "
          >
            Sua conta está ativa.
            Explore a plataforma LUX e
            acompanhe as novidades.
          </p>

          <div class="actions">

            <a
              class="btn primary"
              href="modelos.html"
            >
              Ver modelos
            </a>

            <a
              class="btn"
              href="index.html"
            >
              Página inicial
            </a>

          </div>

        </div>

      </article>

    </section>

  </main>


  <footer class="footer">

    LUX — Sensualidade & Sofisticação

  </footer>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CONFIGURAÇÃO -->

  <script src="config.js"></script>

  <!-- AUTENTICAÇÃO -->

  <script src="auth.js"></script>


  <script>

    async function iniciarPainel() {

      const mensagem =
        document.getElementById("mensagem");

      try {

        /*
         * Aguarda o carregamento da sessão
         * antes de decidir se o usuário está logado.
         */

        const supabase =
          window.luxSupabase;


        if (!supabase) {

          throw new Error(
            "Supabase não foi inicializado."
          );

        }


        /*
         * Primeiro verifica a sessão atual.
         */

        let resultadoSessao =
          await supabase.auth.getSession();


        let session =
          resultadoSessao &&
          resultadoSessao.data
            ? resultadoSessao.data.session
            : null;


        /*
         * Pequena espera para o Supabase
         * restaurar a sessão no navegador.
         */

        if (!session) {

          await new Promise(
            function(resolve) {
              setTimeout(resolve, 800);
            }
          );


          resultadoSessao =
            await supabase.auth.getSession();


          session =
            resultadoSessao &&
            resultadoSessao.data
              ? resultadoSessao.data.session
              : null;

        }


        /*
         * Se realmente não existe sessão,
         * aí sim volta para o login.
         */

        if (!session) {

          window.location.replace(
            "login.html"
          );

          return;

        }


        const user =
          session.user;


        /*
         * Busca o perfil no banco.
         */

        const perfil =
          await getPerfil(user.id);


        if (!perfil) {

          mensagem.hidden = false;

          mensagem.className =
            "notice error";

          mensagem.textContent =
            "Sua conta foi autenticada, mas o perfil ainda está sendo criado. Aguarde alguns segundos e atualize a página.";

          document
            .getElementById("subtitulo")
            .textContent =
            "Preparando sua conta...";

          return;

        }


        /*
         * Se for modelo, vai para painel de modelo.
         */

        if (
          perfil.tipo === "modelo"
        ) {

          window.location.replace(
            "painel-modelo.html"
          );

          return;

        }


        /*
         * Se for administrador,
         * vai para painel administrativo.
         */

        if (
          perfil.tipo === "admin"
        ) {

          window.location.replace(
            "painel.html"
          );

          return;

        }


        /*
         * Somente usuários chegam aqui.
         */

        if (
          perfil.tipo !== "usuario"
        ) {

          throw new Error(
            "Tipo de conta não reconhecido."
          );

        }


        /*
         * Preenche os dados.
         */

        document
          .getElementById("nomeUsuario")
          .textContent =
          perfil.nome ||
          user.user_metadata?.nome ||
          "Usuário";


        document
          .getElementById("emailUsuario")
          .textContent =
          user.email ||
          "";


        document
          .getElementById("statusUsuario")
          .textContent =
          "Status: " +
          (
            perfil.status ||
            "ativo"
          );


        document
          .getElementById("titulo")
          .textContent =
          "Olá, " +
          (
            perfil.nome ||
            user.user_metadata?.nome ||
            "usuário"
          );


        document
          .getElementById("subtitulo")
          .textContent =
          "Esta é sua área exclusiva na LUX.";


        /*
         * Mostra o conteúdo somente depois
         * de confirmar que está tudo certo.
         */

        document
          .getElementById("conteudo")
          .hidden = false;


      } catch (erro) {

        console.error(
          "Erro no painel do usuário:",
          erro
        );


        mensagem.hidden = false;

        mensagem.className =
          "notice error";

        mensagem.textContent =
          erro.message ||
          "Não foi possível carregar sua conta.";

      }

    }


    /*
     * Botão sair
     */

    document
      .getElementById("btnSair")
      .addEventListener(
        "click",
        async function() {

          await sair();

        }
      );


    /*
     * Inicia o painel
     */

    iniciarPainel();

  </script>

</body>

</html>
