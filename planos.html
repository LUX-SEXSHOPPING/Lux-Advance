<html lang="pt-BR">

<head>

  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>LUX — Planos Halloween</title>

<meta
  name="description"
  content="Planos LUX Advance — presença, destaque e exclusividade em uma experiência Halloween premium."
>

  rel="preconnect"
  href="https://fonts.googleapis.com"
>

  crossorigin

  href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"

>

  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"

<style>

:root{

  --o:#ff6a00;

  --p:#7b2cff;

  --gold:#f8d58a;

  --bg:#070507;

  --muted:#b9aebf;

}


*{
  box-sizing:border-box;
}


body{

  margin:0;

  min-height:100vh;

  background:

    radial-gradient(
      circle at 50% 0,
      #28103d 0,
      transparent 42%
    ),

    radial-gradient(
      circle at 10% 70%,
      rgba(255,106,0,.11),
      transparent 28%
    ),

    #070507;

  color:#f8f2ff;

  font-family:Arial,sans-serif;

}


.wrap{

  max-width:1180px;

  margin:auto;

  padding:28px 18px 70px;

}


.back{

  display:inline-flex;

  align-items:center;

  gap:7px;

  padding:10px 15px;

  border:1px solid
    rgba(255,106,0,.35);

  border-radius:12px;

  color:#ffb15c;

  text-decoration:none;

  transition:.25s;

}


.back:hover{

  background:rgba(255,106,0,.08);

  transform:translateY(-2px);

}


.hero{

  text-align:center;

  padding:45px 0 28px;

}


.eyebrow{

  display:inline-block;

  color:#ffb15c;

  border:1px solid
    rgba(255,106,0,.35);

  border-radius:999px;

  padding:7px 13px;

  font-size:12px;

  letter-spacing:.15em;

}


.hero h1{

  font-family:Cinzel,serif;

  font-size:
    clamp(34px,6vw,62px);

  margin:18px 0 10px;

  text-shadow:
    0 0 30px
    rgba(123,44,255,.3);

}


.hero p{

  max-width:680px;

  margin:auto;

  color:var(--muted);

  line-height:1.65;

}


.grid{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:16px;

}


.plan{

  position:relative;

  padding:22px;

  border-radius:22px;

  background:

    linear-gradient(
      155deg,
      rgba(26,16,32,.97),
      rgba(10,7,12,.98)
    );

  border:1px solid
    rgba(123,44,255,.35);

  box-shadow:
    0 20px 50px
    rgba(0,0,0,.35);

  overflow:hidden;

}


.plan:before{

  content:"";

  position:absolute;

  inset:0 auto auto 0;

  width:100%;

  height:3px;

  background:
    linear-gradient(
      90deg,
      var(--o),
      var(--p)
    );

}


.plan.featured{

  border-color:
    rgba(255,106,0,.65);

  transform:
    translateY(-5px);

}


.name{

  font-family:Cinzel,serif;

  font-weight:800;

  letter-spacing:.07em;

  font-size:18px;

}


.price{

  font-size:30px;

  font-weight:800;

  margin:17px 0 5px;

  color:#fff;

}


.price small{

  font-size:13px;

  color:var(--muted);

}


.slogan{

  color:#ffb15c;

  min-height:42px;

  font-style:italic;

  line-height:1.45;

}


.plan ul{

  list-style:none;

  padding:0;

  margin:18px 0;

}


.plan li{

  padding:9px 0;

  border-bottom:
    1px solid
    rgba(255,255,255,.06);

  color:#ddd4e3;

  font-size:14px;

  line-height:1.4;

}


.plan li:before{

  content:'✦';

  color:var(--o);

  margin-right:8px;

}


.choose{

  width:100%;

  border:0;

  border-radius:12px;

  padding:13px;

  font-weight:800;

  cursor:pointer;

  background:

    linear-gradient(
      135deg,
      var(--o),
      var(--p)
    );

  color:#fff;

  transition:.25s;

}


.choose:hover{

  transform:
    translateY(-2px);

  box-shadow:
    0 8px 25px
    rgba(123,44,255,.18);

}


.status{

  margin-top:18px;

  text-align:center;

  color:#a99eae;

  font-size:13px;

}


.status.ok{

  color:#ffb15c;

}


.note{

  margin:24px auto 0;

  max-width:850px;

  padding:14px 16px;

  border:1px solid
    rgba(255,106,0,.2);

  border-radius:14px;

  background:
    rgba(255,106,0,.045);

  color:#bfb4c5;

  font-size:13px;

  line-height:1.6;

}


.badge-title{

  display:inline-block;

  margin-bottom:8px;

  font-size:11px;

  letter-spacing:.12em
