<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUX — Recuperar senha</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/login.css"></head><body><main class="login-wrap"><a class="voltar" href="login.html">← Voltar ao login</a><section class="login-card"><div class="marca">LUX</div><p class="sub">Recuperação de senha</p><p style="color:#b9afb4">Digite o e-mail da sua conta e enviaremos um link para criar uma nova senha.</p><div id="mensagem" class="mensagem" hidden></div><form id="form"><label>E-mail</label><input id="email" type="email" autocomplete="email" required placeholder="seu@email.com"><button class="btn primary" type="submit">Enviar link de recuperação</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('mensagem');m.hidden=false;m.className='mensagem';m.textContent='Enviando...';try{await solicitarRecuperacao(document.getElementById('email').value.trim());m.textContent='Se o e-mail estiver cadastrado, enviamos o link de recuperação. Verifique também a caixa de spam.';document.getElementById('form').reset();}catch(err){m.className='mensagem error';m.textContent=err.message;}});</script></body></html>
